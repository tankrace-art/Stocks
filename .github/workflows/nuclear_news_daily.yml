name: "☢️ Nuclear News Daily Dashboard"

on:
  schedule:
    # 매일 오전 6시 (한국시간 KST = UTC+9 → UTC 21:00 전날)
    - cron: "0 21 * * *"
  workflow_dispatch:  # 수동 실행 버튼

jobs:
  send-dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: claude/nuclear-news-dashboard-eihN3

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum > /dev/null 2>&1
          fc-cache -f

      - name: Create .env file
        run: |
          echo "TELEGRAM_BOT_TOKEN=${{ secrets.TELEGRAM_BOT_TOKEN }}" > .env
          echo "TELEGRAM_CHAT_ID=${{ secrets.TELEGRAM_CHAT_ID }}" >> .env

      - name: Run Nuclear News Dashboard
        run: python -m nuclear_news.main

      - name: Cleanup
        if: always()
        run: rm -f .env
