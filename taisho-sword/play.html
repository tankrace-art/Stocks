class Player {
  constructor(scene, character = CHARACTERS[0], progress = null) {
    this.scene = scene;
    this.ch = character;
    this.progress = progress;
    this.parts = buildModel(character);
    this.group = new THREE.Group();
    this.group.add(this.parts.body);
    scene.add(this.group);

    this.pos = this.group.position;
    this.pos.set(0, 0, 4);
    this.yaw = Math.PI;
    this.camYaw = 0;
    this.camPitch = 0.3;
    this.radius = PLAYER_RADIUS;
    this.height = 1.9;

    this.applySkills();
    this.hp = this.maxHp;
    this.gauge = 0; this.gaugeMax = GAUGE_MAX;
    this.combo = 0; this.comboTimer = 0; this.comboPop = 0;
    this.invuln = 0;
    this.alive = true;

    this.attack = null;
    this.queued = null;
    this.comboResetTimer = 0;
    this.nextLight = 'light1';

    this.dashTime = 0; this.dashCooldown = 0; this.dashDir = new THREE.Vector3();
    this.moving = false; this.walkPhase = 0;
    this.knock = new THREE.Vector3();

    this.waves = [];
    this.events = [];
    this.hitstop = 0;
    this.fwd = new THREE.Vector3(0, 0, 1);
    this._tmp = new THREE.Vector3();
    this.blink = 0;
    this.kills = 0;
    this.lookIdle = 10;     // 마지막 수동 시점 조작 후 경과 시간
    this.camTarget = null;  // 소프트 록온 대상
    this._camPos = new THREE.Vector3();
    this._camLook = new THREE.Vector3();
  }

  // 스킬 트리 효과 적용 (선택 시/학습 시 호출)
  applySkills() {
    const s = this.ch.stats;
    const has = (id) => this.progress && this.progress.has(id);
    const eq = this.progress ? sumEquipment(this.progress.equipped) : {};
    const g = (k) => eq[k] || 0;
    this.skill = {
      dmgMul: s.dmg * (has('atk1') ? 1.15 : 1) * (1 + g('dmg')),
      comboBonus: has('atk2'),
      heavyPlus: has('atk3'),
      regen: (has('def3') ? 0.8 : 0) + g('regen'),
      dashCooldown: s.dashCooldown * (has('def2') ? 0.6 : 1) * Math.max(0.3, 1 - g('dash')),
      dashInvulnBonus: has('def2') ? 0.3 : 0,
      gaugeMul: s.gauge * (has('tec1') ? 1.5 : 1) * (1 + g('gauge')),
      specialMul: (has('tec2') ? 1.5 : 1) * (1 + g('special')),
      extraWave: has('tec2') ? 1 : 0,
      specialHeal: has('tec3') ? 25 : 0,
      reduce: Math.min(0.6, g('reduce')),
    };
    const prevMax = this.maxHp || 0;
    this.maxHp = Math.round(s.hp + (has('def1') ? 30 : 0) + g('hp'));
    if (prevMax && this.maxHp > prevMax) this.hp = Math.min(this.maxHp, (this.hp || 0) + (this.maxHp - prevMax));
    if (this.hp > this.maxHp) this.hp = this.maxHp;
    this.moveSpeed = s.speed * (1 + g('speed'));
  }

  get forward() { return this.fwd.set(Math.sin(this.yaw), 0, Math.cos(this.yaw)); }
  get center() { return this._tmp.set(this.pos.x, this.pos.y + 1.1, this.pos.z); }
  get busy() { return !!this.attack; }
  get specialReady() { return this.gauge >= this.gaugeMax; }

  // ---------- 입력/이동 ----------
  update(dt, input, ctx) {
    this.events.length = 0;
    if (!this.alive) { this._animateDead(dt); return; }

    // 카메라 회전 (수동)
    if (input.mouseDX !== 0 || input.mouseDY !== 0) this.lookIdle = 0; else this.lookIdle += dt;
    this.camYaw -= input.mouseDX * 0.0022;
    this.camPitch = clamp(this.camPitch + input.mouseDY * 0.0018, -0.35, 1.05);

    // 카메라 기준 이동 방향
    const cfx = -Math.sin(this.camYaw), cfz = -Math.cos(this.camYaw);
    const crx = -cfz, crz = cfx;
    let mx = 0, mz = 0;
    if (input.keys.KeyW) { mx += cfx; mz += cfz; }
    if (input.keys.KeyS) { mx -= cfx; mz -= cfz; }
    if (input.keys.KeyD) { mx += crx; mz += crz; }
    if (input.keys.KeyA) { mx -= crx; mz -= crz; }
    if (input.axisX || input.axisY) {
      mx += cfx * input.axisY + crx * input.axisX;
      mz += cfz * input.axisY + crz * input.axisX;
    }
    let ml = Math.hypot(mx, mz);
    if (ml > 1) { mx /= ml; mz /= ml; ml = 1; }
    this.moving = ml > 0.001;

    // 타이머
    this.invuln = Math.max(0, this.invuln - dt);
    this.dashCooldown = Math.max(0, this.dashCooldown - dt);
    this.blink = Math.max(0, this.blink - dt);
    if (this.comboTimer > 0) { this.comboTimer -= dt; if (this.comboTimer <= 0) this.combo = 0; }
    this.comboPop = Math.max(0, this.comboPop - dt * 4);
    if (this.comboResetTimer > 0 && !this.attack) {
      this.comboResetTimer -= dt;
      if (this.comboResetTimer <= 0) this.nextLight = 'light1';
    }
    if (this.skill.regen > 0 && this.hp < this.maxHp) this.hp = Math.min(this.maxHp, this.hp + this.skill.regen * dt);

    // 대시
    if (input.dash && this.dashCooldown <= 0 && this.dashTime <= 0 && !(this.attack && this.attack.def.special)) {
      this.dashTime = DASH_TIME;
      this.dashCooldown = this.skill.dashCooldown;
      if (ml > 0) this.dashDir.set(mx, 0, mz).normalize(); else this.dashDir.copy(this.forward);
      this.yaw = Math.atan2(this.dashDir.x, this.dashDir.z);
      this.attack = null; this.queued = null;
      this.invuln = Math.max(this.invuln, DASH_TIME + 0.05 + this.skill.dashInvulnBonus);
      ctx.effects.burst(this.center, { count: 14, colors: [this.ch.colors.glow, 0xe0f0ff], speed: 2, life: 0.4, size: 0.5, gravity: 0, drag: 2 });
      this.events.push({ type: 'dash' });
    }
    input.dash = false;

    // 공격 입력
    if (input.light) {
      if (!this.attack) this._startAttack(this.nextLight, ctx);
      else if (this.attack.def.next && this.attack.t >= this.attack.def.active[0]) this.queued = this.attack.def.next;
    }
    if (input.heavy) {
      if (!this.attack) this._startAttack('heavy', ctx);
      else if (!this.attack.def.heavy && !this.attack.def.special && this.attack.t >= this.attack.def.active[0]) this.queued = 'heavy';
    }
    if (input.special && this.specialReady && !(this.attack && this.attack.def.special)) {
      this.gauge = 0;
      this._startAttack('special', ctx);
      this.invuln = Math.max(this.invuln, ATTACKS.special.dur);
      if (this.skill.specialHeal) {
        this.hp = Math.min(this.maxHp, this.hp + this.skill.specialHeal);
        for (const e of ctx.enemies) if (e.targetable && Math.hypot(e.pos.x - this.pos.x, e.pos.z - this.pos.z) < 8) e.stagger = Math.max(e.stagger, 1.2);
      }
      this.events.push({ type: 'special' });
    }
    // 회복약
    if (input.potion) {
      if (this.progress && this.hp < this.maxHp && this.progress.usePotion()) {
        this.heal(POTION_HEAL);
        ctx.effects.burst(this.center, { count: 24, colors: [0xff6080, 0xffb0c0, 0xffffff], speed: 2, life: 0.8, size: 0.4, gravity: 2, drag: 1, up: 2 });
        this.events.push({ type: 'potion' });
      } else this.events.push({ type: 'potionFail' });
    }
    input.light = input.heavy = input.special = input.potion = false;

    // 이동
    const move = new THREE.Vector3();
    if (this.dashTime > 0) {
      this.dashTime -= dt;
      move.copy(this.dashDir).multiplyScalar(DASH_SPEED * dt);
      ctx.effects.emit({ pos: this.center, vel: new THREE.Vector3(rand(-1, 1), rand(0, 1), rand(-1, 1)), life: 0.3, size: 0.6, color: this.ch.colors.glow, drag: 2 });
    } else if (this.attack) {
      const a = this.attack; const d = a.def; const w = d.active[0];
      if (a.t < w && ml > 0) this.yaw = angleLerp(this.yaw, Math.atan2(mx, mz), 1 - Math.exp(-14 * dt));
      if (a.t >= w * 0.6 && a.t < d.active[1] && d.lunge) move.copy(this.forward).multiplyScalar(d.lunge * dt);
    } else if (ml > 0) {
      move.set(mx, 0, mz).multiplyScalar(this.moveSpeed * dt);
      this.yaw = angleLerp(this.yaw, Math.atan2(mx, mz), 1 - Math.exp(-12 * dt));
    }
    move.addScaledVector(this.knock, dt);
    this.knock.multiplyScalar(Math.max(0, 1 - 7 * dt));
    this.pos.add(move);
    ctx.stage.resolveCollisions(this.pos, this.radius);
    this.pos.y = 0;

    if (this.attack) this._updateAttack(dt, ctx);
    this._updateWaves(dt, ctx);
    this._updateCamTarget(ctx);
    this._animate(dt);
    this.group.rotation.y = this.yaw;
  }

  // 소프트 록온 대상: 가까운 적 (10m 이내)
  _updateCamTarget(ctx) {
    let best = null, bestD = 10;
    for (const e of ctx.enemies) {
      if (!e.targetable) continue;
      const d = Math.hypot(e.pos.x - this.pos.x, e.pos.z - this.pos.z) - (e.isBoss ? 2 : 0);
      if (d < bestD) { bestD = d; best = e; }
    }
    this.camTarget = best;
  }

  // ---------- 공격 ----------
  _attackDamage(d) {
    let dmg = d.dmg * this.skill.dmgMul;
    if (d.special) dmg = this.ch.special.dmg * this.skill.dmgMul * this.skill.specialMul;
    if (this.skill.comboBonus && this.combo >= 8) dmg *= 1.25;
    return dmg;
  }

  _startAttack(name, ctx) {
    const def = ATTACKS[name];
    this.attack = { name, def, t: 0, hitSet: new Set(), fxDone: false, waveDone: false, waveCount: 0 };
    this.queued = null;
    if (name.startsWith('light')) { this.nextLight = def.next || 'light1'; this.comboResetTimer = 0.55; }
    else this.nextLight = 'light1';
    const wasMoving = this.moving;
    if (!this.moving || def.special) this.yaw = this.camYaw + Math.PI;
    // 조준 보정: 이동 중엔 정면 ±65°, 정지 시엔 전방향에서 가장 가까운 적 쪽으로
    if (!def.special && ctx.enemies) {
      let best = null, bestD = def.range + 1.8;
      const limit = wasMoving ? 1.15 : Math.PI;
      for (const e of ctx.enemies) {
        if (!e.targetable) continue;
        const dx = e.pos.x - this.pos.x, dz = e.pos.z - this.pos.z;
        const d = Math.hypot(dx, dz);
        if (d > bestD) continue;
        const ang = Math.atan2(dx, dz);
        if (Math.abs(angleDiff(this.yaw, ang)) > limit) continue;
        best = ang; bestD = d;
      }
      if (best !== null) this.yaw = best;
    }
    this.events.push({ type: 'swing', heavy: !!def.heavy, special: !!def.special });
    if (def.special) {
      const sp = this.ch.special;
      ctx.effects.shockwave(this.pos, { color: sp.c1, radius: 3, life: 0.5, y: 0.1 });
      ctx.effects.burst(this.center, { count: 40, colors: [sp.c1, sp.c2, sp.c3], speed: 3, life: 0.8, size: 0.45, gravity: 1.5, drag: 1, up: 2 });
    }
  }

  _updateAttack(dt, ctx) {
    const a = this.attack; const d = a.def;
    a.t += dt;
    const [as, ae] = d.active;
    const sp = this.ch.special;
    const heavyPlus = d.heavy && this.skill.heavyPlus;
    const range = d.special ? sp.range : d.range * (heavyPlus ? 1.4 : 1);

    if (!a.fxDone && a.t >= as) {
      a.fxDone = true;
      const fx = d.fx;
      ctx.effects.slashArc(this.pos, this.yaw, {
        rIn: 0.5, rOut: d.special ? sp.range - 0.2 : (fx.rOut || d.range) * (heavyPlus ? 1.4 : 1), angle: Math.min(d.arc, Math.PI * 1.1), tilt: fx.tilt, roll: fx.roll,
        color: d.special ? sp.c1 : fx.color, life: d.special ? 0.45 : 0.22, sweep: fx.sweep, y: fx.y,
      });
      if (d.special) ctx.effects.slashArc(this.pos, this.yaw + Math.PI, { rIn: 0.5, rOut: sp.range - 0.2, angle: Math.PI * 1.1, tilt: 0.15, color: sp.c2, life: 0.45, sweep: 1, y: 0.9 });
    }
    if (a.t >= as && a.t <= ae) {
      this._hitCheck(a, ctx, range, heavyPlus);
      if (d.special) this._specialParticles(ctx, a.t);
    }
    // 비검: 검기 파동 발사 (스킬로 추가 발사)
    if (d.special) {
      const total = sp.waves + this.skill.extraWave;
      if (a.waveCount < total && a.t >= 0.72 + a.waveCount * 0.22) {
        const spread = total > 1 ? (a.waveCount - (total - 1) / 2) * 0.35 : 0;
        this._launchWave(ctx, spread);
        a.waveCount++;
        this.events.push({ type: 'wave' });
      }
    }
    if (this.queued && a.t >= ae + (d.dur - ae) * 0.45) { this._startAttack(this.queued, ctx); return; }
    if (a.t >= d.dur) {
      this.attack = null;
      this.comboResetTimer = 0.55;
      if (d.special) this.parts.body.rotation.y = 0;
    }
  }

  // 캐릭터별 비검 파티클 테마
  _specialParticles(ctx, t) {
    const c = this.center;
    const sp = this.ch.special;
    const theme = sp.theme;
    for (let i = 0; i < 6; i++) {
      const a = rand(0, Math.PI * 2);
      const r = rand(0.6, sp.range - 0.8);
      const p = new THREE.Vector3(c.x + Math.cos(a) * r, 0.2 + rand(0, 0.6), c.z + Math.sin(a) * r);
      let v;
      if (theme === 'lightning') v = new THREE.Vector3(rand(-6, 6), rand(2, 9), rand(-6, 6));
      else if (theme === 'wind') v = new THREE.Vector3(-Math.sin(a), 1.2, Math.cos(a)).multiplyScalar(rand(3, 7));
      else if (theme === 'quake') v = new THREE.Vector3(Math.cos(a) * 0.5, rand(4, 8), Math.sin(a) * 0.5);
      else v = new THREE.Vector3(Math.cos(a), 0.3, Math.sin(a)).multiplyScalar(rand(2, 5));
      ctx.effects.emit({ pos: p, vel: v, life: theme === 'lightning' ? 0.25 : 0.7, size: theme === 'lightning' ? 0.3 : 0.45, color: i % 3 === 0 ? sp.c3 : sp.c1, drag: 1.5, gravity: theme === 'quake' ? -9 : 0 });
    }
    for (let i = 0; i < 5; i++) {
      const a = rand(0, Math.PI * 2);
      const r = rand(0.3, 2.5);
      const p = new THREE.Vector3(c.x + Math.cos(a) * r, rand(0, 1.2), c.z + Math.sin(a) * r);
      const v = theme === 'wind' ? new THREE.Vector3(-Math.sin(a) * 4, rand(2, 5), Math.cos(a) * 4) : new THREE.Vector3(rand(-0.6, 0.6), rand(2.5, 5), rand(-0.6, 0.6));
      ctx.effects.emit({ pos: p, vel: v, life: 0.9, size: 0.55, color: [sp.c2, sp.c3, sp.c1][i % 3], gravity: theme === 'flame' ? 2.5 : 1.5, drag: 1.2 });
    }
    if (theme === 'quake' && Math.random() < 0.15) ctx.effects.shockwave(this.pos, { color: sp.c1, radius: rand(3, 5.5), life: 0.5, y: 0.1, opacity: 0.5 });
    if (theme === 'lightning' && Math.random() < 0.2) ctx.effects.burst(c, { count: 6, colors: [0xffffff], speed: 1, life: 0.1, size: 1.6, gravity: 0, drag: 0 });
  }

  _launchWave(ctx, spread = 0) {
    const sp = this.ch.special;
    const geo = ctx.effects._arcGeo(0.9, 1.9, 2.3);
    const m = new THREE.MeshBasicMaterial({ color: sp.c1, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true });
    const mesh = new THREE.Mesh(geo, m);
    mesh.rotation.order = 'YXZ';
    mesh.rotation.y = this.yaw + spread;
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set(this.pos.x, 1.2, this.pos.z);
    this.scene.add(mesh);
    const dir = new THREE.Vector3(Math.sin(this.yaw + spread), 0, Math.cos(this.yaw + spread));
    this.waves.push({ mesh, mat: m, dir, life: 1.4, maxLife: 1.4, hitSet: new Set(), speed: sp.waveSpeed || 15 });
  }

  _updateWaves(dt, ctx) {
    const sp = this.ch.special;
    for (let i = this.waves.length - 1; i >= 0; i--) {
      const w = this.waves[i];
      w.life -= dt;
      w.mesh.position.addScaledVector(w.dir, w.speed * dt);
      const s = 1 + (1 - w.life / w.maxLife) * 1.2;
      w.mesh.scale.set(s, s, s);
      w.mat.opacity = 0.9 * Math.min(1, w.life / 0.4);
      for (let k = 0; k < 3; k++) {
        const side = rand(-1.6, 1.6) * s;
        const p = new THREE.Vector3(w.mesh.position.x - w.dir.z * side, rand(0.3, 2.0), w.mesh.position.z + w.dir.x * side);
        ctx.effects.emit({ pos: p, vel: new THREE.Vector3(rand(-1, 1), rand(1, 3), rand(-1, 1)), life: 0.6, size: 0.5, color: k === 0 ? sp.c2 : sp.c1, drag: 1 });
      }
      for (const e of ctx.enemies) {
        if (!e.targetable || w.hitSet.has(e)) continue;
        const dx = e.pos.x - w.mesh.position.x, dz = e.pos.z - w.mesh.position.z;
        const along = dx * w.dir.x + dz * w.dir.z;
        const lateral = Math.abs(-dx * w.dir.z + dz * w.dir.x);
        if (Math.abs(along) < 1.2 + e.radius && lateral < 1.9 * s + e.radius) {
          w.hitSet.add(e);
          const dir = new THREE.Vector3(dx, 0, dz).normalize();
          this._applyHit(e, { dmg: 45 * this.skill.dmgMul * this.skill.specialMul, knock: 10, stagger: 0.8, gauge: 0, hitstop: 0.06, shake: 0.3, special: true }, dir, ctx);
        }
      }
      for (const p of ctx.projectiles) {
        if (p.alive && p.pos.distanceTo(w.mesh.position) < 2.2 * s) p.destroy(ctx.effects);
      }
      if (w.life <= 0 || Math.hypot(w.mesh.position.x, w.mesh.position.z) > 40) {
        this.scene.remove(w.mesh); w.mat.dispose(); this.waves.splice(i, 1);
      }
    }
  }

  _hitCheck(a, ctx, range, heavyPlus) {
    const d = a.def;
    const f = this.forward;
    const dmg = this._attackDamage(d);
    const knock = d.knock * (heavyPlus ? 1.5 : 1);
    const stagger = heavyPlus ? 1.2 : d.stagger;
    for (const e of ctx.enemies) {
      if (!e.targetable || a.hitSet.has(e)) continue;
      const dx = e.pos.x - this.pos.x, dz = e.pos.z - this.pos.z;
      const dist = Math.hypot(dx, dz);
      if (dist > range + e.radius) continue;
      const cosA = clamp((dx * f.x + dz * f.z) / Math.max(dist, 1e-4), -1, 1);
      if (Math.acos(cosA) > d.arc / 2 && dist > e.radius + 0.5) continue;
      a.hitSet.add(e);
      const dir = new THREE.Vector3(dx, 0, dz).normalize();
      this._applyHit(e, { dmg, knock, stagger, gauge: d.gauge, hitstop: d.hitstop, shake: d.shake, heavy: d.heavy, special: d.special }, dir, ctx);
    }
    for (const p of ctx.projectiles) {
      if (!p.alive || a.hitSet.has(p)) continue;
      const dx = p.pos.x - this.pos.x, dz = p.pos.z - this.pos.z;
      const dist = Math.hypot(dx, dz);
      if (dist > range + 0.5) continue;
      const cosA = clamp((dx * f.x + dz * f.z) / Math.max(dist, 1e-4), -1, 1);
      if (Math.acos(cosA) > d.arc / 2 + 0.3) continue;
      a.hitSet.add(p);
      p.destroy(ctx.effects);
      this.gauge = Math.min(this.gaugeMax, this.gauge + 3 * this.skill.gaugeMul);
      this.events.push({ type: 'parry' });
    }
  }

  _applyHit(e, d, dir, ctx) {
    const killed = e.takeHit(d.dmg, dir, d.knock, d.stagger, ctx.effects);
    const hitPos = new THREE.Vector3(e.pos.x - dir.x * e.radius * 0.5, e.pos.y + e.height * 0.55, e.pos.z - dir.z * e.radius * 0.5);
    const sp = this.ch.special;
    ctx.effects.sparks(hitPos, dir, d.special ? [sp.c1, sp.c2, 0xffffff] : undefined);
    this.gauge = Math.min(this.gaugeMax, this.gauge + (d.gauge || 0) * this.skill.gaugeMul);
    this.combo += 1;
    this.comboTimer = COMBO_WINDOW;
    this.comboPop = 1;
    this.hitstop = Math.max(this.hitstop, d.hitstop || 0.04);
    ctx.effects.addShake(d.shake || 0.1);
    this.events.push({ type: 'hit', enemy: e, dmg: d.dmg, killed, heavy: !!d.heavy });
    if (killed) { this.kills++; this.gauge = Math.min(this.gaugeMax, this.gauge + 6 * this.skill.gaugeMul); }
  }

  heal(v) { if (this.alive) this.hp = Math.min(this.maxHp, this.hp + v); }

  // ---------- 피격 ----------
  takeDamage(dmg, fromPos, effects) {
    if (!this.alive || this.invuln > 0) return false;
    dmg = Math.round(dmg * (1 - (this.skill.reduce || 0)));
    this.hp = Math.max(0, this.hp - dmg);
    this.invuln = 1.0;
    this.blink = 1.0;
    this.combo = 0; this.comboTimer = 0;
    const dir = new THREE.Vector3(this.pos.x - fromPos.x, 0, this.pos.z - fromPos.z).normalize();
    this.knock.copy(dir).multiplyScalar(6);
    effects.burst(this.center, { count: 16, colors: [0xff3040, 0xff8080, 0xffffff], speed: 4, life: 0.5, size: 0.3, gravity: -5, drag: 2 });
    effects.addShake(0.5);
    this.events.push({ type: 'damaged', dmg });
    if (this.attack && !this.attack.def.special) { this.attack = null; this.queued = null; }
    if (this.hp <= 0) { this.alive = false; this.deadT = 0; this.events.push({ type: 'dead' }); }
    return true;
  }

  // ---------- 애니메이션 ----------
  _animate(dt) {
    const P = this.parts; const body = P.body; const ra = P.rightArm; const la = P.leftArm;
    const blinkOn = this.blink > 0 && Math.floor(this.blink * 20) % 2 === 0;
    body.visible = !blinkOn;
    const glow = this.specialReady ? 0.6 + 0.4 * Math.sin(performance.now() * 0.008) : 0.15;
    P.bladeMat.emissiveIntensity = damp(P.bladeMat.emissiveIntensity, glow, 8, dt);

    let tx = 0.15, ty = 0, tz = -0.25;
    let lz = 0.2, lx = 0;
    let bodyTilt = 0, bodyYawOff = 0, bob = 0;

    if (this.attack) {
      const a = this.attack; const d = a.def; const [as, ae] = d.active;
      let pose;
      if (a.t < as) {
        const k = easeOutCubic(a.t / as);
        pose = { x: lerp(-0.6, d.windup.x, k), y: lerp(0, d.windup.y, k), z: lerp(-0.2, d.windup.z, k) };
        bodyYawOff = -0.35 * k * (d.fx.sweep || 0);
      } else if (a.t < ae) {
        const k = easeOutCubic((a.t - as) / (ae - as));
        pose = { x: lerp(d.windup.x, d.end.x, k), y: lerp(d.windup.y, d.end.y, k), z: lerp(d.windup.z, d.end.z, k) };
        bodyYawOff = lerp(-0.35, 0.3, k) * (d.fx.sweep || 0);
        bodyTilt = 0.12 * k;
      } else {
        const k = easeInCubic(clamp((a.t - ae) / (d.dur - ae), 0, 1));
        pose = { x: lerp(d.end.x, 0.15, k), y: lerp(d.end.y, 0, k), z: lerp(d.end.z, -0.25, k) };
        bodyYawOff = lerp(0.3, 0, k) * (d.fx.sweep || 0);
        bodyTilt = 0.12 * (1 - k);
      }
      if (d.special) {
        const spinT = clamp((a.t - as * 0.5) / (ae - as * 0.5), 0, 1);
        bodyYawOff = easeOutCubic(spinT) * Math.PI * 4;
        pose = { x: -1.45, y: -1.3, z: 0 };
        bodyTilt = 0.18 * Math.sin(spinT * Math.PI);
        if (a.t > ae) { const k = clamp((a.t - ae) / (d.dur - ae), 0, 1); pose = { x: lerp(-1.45, -2.4, easeOutBack(Math.min(1, k * 2))), y: lerp(-1.3, 0, k), z: 0 }; if (k > 0.6) pose.x = lerp(-2.4, 0.15, (k - 0.6) / 0.4); }
      }
      tx = pose.x; ty = pose.y; tz = pose.z;
      lx = -0.5; lz = 0.6;
      ra.rotation.set(damp(ra.rotation.x, tx, 30, dt), damp(ra.rotation.y, ty, 30, dt), damp(ra.rotation.z, tz, 30, dt));
    } else {
      if (this.dashTime > 0) { tx = -0.8; tz = -0.6; bodyTilt = 0.4; lx = -0.9; }
      else if (this.moving) {
        this.walkPhase += dt * 11;
        lx = Math.sin(this.walkPhase) * 0.55;
        tx = -Math.sin(this.walkPhase) * 0.4 + 0.1;
        bob = Math.abs(Math.sin(this.walkPhase)) * 0.06;
        bodyTilt = 0.08;
      } else {
        const t = performance.now() * 0.0015;
        tx = 0.15 + Math.sin(t) * 0.04;
        bob = Math.sin(t * 1.3) * 0.015;
      }
      ra.rotation.set(damp(ra.rotation.x, tx, 12, dt), damp(ra.rotation.y, ty, 12, dt), damp(ra.rotation.z, tz, 12, dt));
    }
    la.rotation.x = damp(la.rotation.x, lx, 12, dt);
    la.rotation.z = damp(la.rotation.z, lz, 12, dt);
    body.rotation.x = damp(body.rotation.x, bodyTilt, 12, dt);
    body.rotation.y = this.attack && this.attack.def.special ? bodyYawOff : damp(body.rotation.y, bodyYawOff, 20, dt);
    body.position.y = bob;
    const [fl, fr] = P.feet;
    if (this.moving && !this.attack) {
      fl.position.z = 0.05 + Math.sin(this.walkPhase) * 0.2;
      fr.position.z = 0.05 - Math.sin(this.walkPhase) * 0.2;
    } else {
      fl.position.z = damp(fl.position.z, 0.05, 10, dt);
      fr.position.z = damp(fr.position.z, 0.05, 10, dt);
    }
    P.scarfTail.rotation.x = 0.35 + Math.sin(performance.now() * 0.004) * 0.15 + (this.moving ? 0.5 : 0);
  }

  _animateDead(dt) {
    this.deadT += dt;
    const k = clamp(this.deadT / 0.8, 0, 1);
    this.parts.body.rotation.x = lerp(0, -Math.PI / 2 + 0.2, easeOutCubic(k));
    this.parts.body.position.y = lerp(0, 0.25, k);
    this.parts.body.visible = true;
  }

  // ---------- 카메라: 팔로우 + 소프트 록온 + 지연/선행 ----------
  updateCamera(camera, dt, shake) {
    const auto = this.lookIdle > 0.7 && this.alive;
    if (auto) {
      // 1) 이동 방향으로 서서히 돌아감 (카메라 쪽으로 걸어올 때는 제외)
      if (this.moving && this.dashTime <= 0) {
        const behind = this.yaw + Math.PI;
        const diff = angleDiff(this.camYaw, behind);
        // 앞쪽(±70°)으로 걸을 때만 따라 돔. 옆걸음·뒷걸음은 유지 → 끝없이 도는 현상 방지
        if (Math.abs(diff) < 1.22) this.camYaw = angleLerp(this.camYaw, behind, 1 - Math.exp(-1.1 * dt));
      }
      // 2) 가까운 적을 화면에 담도록 살짝 회전 (소프트 록온)
      if (this.camTarget) {
        const e = this.camTarget;
        const toEnemy = Math.atan2(e.pos.x - this.pos.x, e.pos.z - this.pos.z);
        const want = toEnemy + Math.PI;
        const diff = angleDiff(this.camYaw, want);
        if (Math.abs(diff) < 2.6) this.camYaw = angleLerp(this.camYaw, want, 1 - Math.exp(-0.9 * dt));
      }
      // 3) 피치는 기본값으로 천천히 복귀
      this.camPitch = damp(this.camPitch, 0.3, 0.6, dt);
    }

    const dist = 5.8 + (this.dashTime > 0 ? 0.6 : 0);

const { Projectile, Enemy, MeleeYokai, RangedYokai, BossOni, EnemyManager } = (() => {
// enemy.js — 요괴: 근접형(小鬼), 원거리형(鬼火), 보스(黒鬼), 투사체, 웨이브/새벽 소멸 관리




function mat(color, extra = {}) {
  return new THREE.MeshLambertMaterial({ color, flatShading: true, transparent: true, ...extra });
}

// ---------- 투사체 (귀화) ----------
class Projectile {
  constructor(scene, pos, dir, { speed = 9, dmg = 10, life = 4.5, color = 0x60c0ff, size = 0.28 } = {}) {
    this.scene = scene;
    this.pos = pos.clone();
    this.vel = dir.clone().normalize().multiplyScalar(speed);
    this.dmg = dmg; this.life = life; this.alive = true; this.radius = size + 0.25;
    this.color = color;
    this.mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(size, 0), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    this.glow = new THREE.Mesh(new THREE.IcosahedronGeometry(size * 1.9, 0), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false }));
    this.mesh.add(this.glow);
    this.mesh.position.copy(this.pos);
    scene.add(this.mesh);
  }
  update(dt, ctx) {
    if (!this.alive) return;
    this.life -= dt;
    this.pos.addScaledVector(this.vel, dt);
    this.mesh.position.copy(this.pos);
    this.mesh.rotation.x += dt * 6; this.mesh.rotation.y += dt * 4;
    ctx.effects.emit({ pos: this.pos, vel: new THREE.Vector3(rand(-0.5, 0.5), rand(0.5, 1.5), rand(-0.5, 0.5)), life: 0.45, size: 0.45, color: this.color, drag: 2 });
    const p = ctx.player;
    if (p.alive) {
      const dx = p.pos.x - this.pos.x, dz = p.pos.z - this.pos.z, dy = (p.pos.y + 1.0) - this.pos.y;
      if (Math.hypot(dx, dz) < this.radius + p.radius && Math.abs(dy) < 1.4) {
        p.takeDamage(this.dmg, this.pos, ctx.effects);
        this.destroy(ctx.effects, true);
        return;
      }
    }
    if (this.pos.y < 0.05 || this.life <= 0 || Math.hypot(this.pos.x, this.pos.z) > ARENA_RADIUS + 6) this.destroy(ctx.effects, this.pos.y < 0.05);
  }
  destroy(effects, impact = false) {
    if (!this.alive) return;
    this.alive = false;
    this.scene.remove(this.mesh);
    this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.glow.material.dispose();
    effects.burst(this.pos, { count: impact ? 18 : 12, colors: [this.color, 0xffffff, 0xa0e0ff], speed: impact ? 4 : 3, life: 0.45, size: 0.35, gravity: -3, drag: 2 });
  }

// ---------- 적 기본 ----------
let ENEMY_ID = 0;
class Enemy {
  constructor(scene, pos) {
    this.id = ENEMY_ID++;
    this.scene = scene;
    this.group = new THREE.Group();
    this.pos = this.group.position;
    this.pos.copy(pos); this.pos.y = 0;
    this.yaw = rand(0, Math.PI * 2);
    scene.add(this.group);

    this.hp = 40; this.maxHp = 40;
    this.speed = 3.2;
    this.radius = 0.5;
    this.height = 1.6;
    this.state = 'spawn'; this.stateT = 0;
    this.alive = true;
    this.removed = false;
    this.hitFlash = 0;
    this.stagger = 0;
    this.knock = new THREE.Vector3();
    this.isBoss = false;
    this.attackCooldown = rand(0.5, 1.5);
    this.mats = [];
    this.opacity = 1;
    this.scaleBase = 1;
    this.name = '요괴'; this.kind = 'melee';
    this.dissolving = false;
  }

  _collectMats() {
    this.group.traverse((o) => {
      if (o.isMesh) {
        o.castShadow = true; o.receiveShadow = true;
        const ms = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of ms) this.mats.push({ m, emissive: m.emissive ? m.emissive.getHex() : 0, ei: m.emissiveIntensity || 0 });
      }
    });
  }

  get targetable() { return this.alive && this.state !== 'spawn' && !this.dissolving; }
  get center() { return new THREE.Vector3(this.pos.x, this.pos.y + this.height * 0.55, this.pos.z); }

  setState(s) { this.state = s; this.stateT = 0; }

  takeHit(dmg, dir, knock, stagger, effects) {
    if (!this.targetable) return false;
    this.hp -= dmg;
    this.hitFlash = 1;
    const kMul = this.isBoss ? 0.12 : 1;
    this.knock.addScaledVector(dir, knock * kMul);
    // 보스는 경직에 강한 저항
    this.stagger = Math.max(this.stagger, this.isBoss ? stagger * 0.2 : stagger);
    if (this.hp <= 0) { this.die(effects); return true; }
    if (this.stagger > 0 && !this.isBoss) this.setState('hurt');
    return false;
  }

  die(effects) {
    this.alive = false;
    this.setState('dead');
    effects.burst(this.center, { count: 30, colors: [0x6a2a8a, 0x2a1040, 0xff6a3a, 0xffffff], speed: 4, life: 0.8, size: 0.5, gravity: -2, drag: 1.5 });
    effects.mist(this.center, undefined, 12);
  }

  // 새벽 소멸
  dissolve(effects) {
    if (this.dissolving || this.state === 'dead') return;
    this.dissolving = true;
    this.alive = false;
    this.setState('dissolve');
    effects.ashes(this.center, this.isBoss ? 80 : 30);
  }

  // 플레이어 방향/거리
  _toPlayer(player) {
    const dx = player.pos.x - this.pos.x, dz = player.pos.z - this.pos.z;
    const d = Math.hypot(dx, dz);
    return { dx, dz, d, ang: Math.atan2(dx, dz) };
  }

  _faceTo(ang, dt, rate = 8) { this.yaw = angleLerp(this.yaw, ang, 1 - Math.exp(-rate * dt)); }

  _moveTowards(dx, dz, d, dt, speed = this.speed) {
    if (d < 1e-3) return;
    this.pos.x += (dx / d) * speed * dt;
    this.pos.z += (dz / d) * speed * dt;
  }

  update(dt, ctx) {
    this.stateT += dt;
    this.hitFlash = Math.max(0, this.hitFlash - dt * 6);
    this.stagger = Math.max(0, this.stagger - dt);
    this.attackCooldown = Math.max(0, this.attackCooldown - dt);

    // 넉백
    this.pos.addScaledVector(this.knock, dt);
    this.knock.multiplyScalar(Math.max(0, 1 - 8 * dt));

    switch (this.state) {
      case 'spawn': {
        const k = clamp(this.stateT / 1.1, 0, 1);
        const s = easeOutCubic(k) * this.scaleBase;
        this.group.scale.set(s, s, s);
        this.pos.y = lerp(-this.height * 0.8, 0, easeOutCubic(k));
        if (Math.random() < 0.5) ctx.effects.mist(new THREE.Vector3(this.pos.x, 0.2, this.pos.z), undefined, 2);
        if (k >= 1) { this.pos.y = 0; this.setState('chase'); }
        break;
      }
      case 'dead': {
        const k = clamp(this.stateT / 0.9, 0, 1);
        this.opacity = 1 - k;
        this.group.rotation.x = -easeOutCubic(k) * 1.2;
        const s = this.scaleBase * (1 - k * 0.3);
        this.group.scale.set(s, s, s);
        if (k >= 1) this.remove();
        break;
      }
      case 'dissolve': {
        const k = clamp(this.stateT / 1.8, 0, 1);
        this.opacity = 1 - k;
        this.pos.y = k * 1.5;
        const s = this.scaleBase * (1 - k * 0.6);
        this.group.scale.set(s, s, s);
        this.group.rotation.y += dt * 2;
        if (Math.random() < 0.6) ctx.effects.emit({ pos: this.center, vel: new THREE.Vector3(rand(-1, 1), rand(1, 2.5), rand(-1, 1)), life: 1.2, size: 0.4, color: pick([0xffd9a0, 0xffffff, 0xb090ff]), drag: 0.5 });
        if (k >= 1) this.remove();
        break;
      }
      case 'hurt': {
        if (this.stagger <= 0) this.setState('chase');
        break;
      }
      default:
        if (this.alive) this.behave(dt, ctx);
    }

    if (this.alive && this.state !== 'spawn') {
      ctx.stage.resolveCollisions(this.pos, this.radius);
      // 적끼리 분리
      for (const o of ctx.enemies) {
        if (o === this || !o.alive) continue;
        const dx = this.pos.x - o.pos.x, dz = this.pos.z - o.pos.z;
        const d = Math.hypot(dx, dz);
        const min = this.radius + o.radius;
        if (d < min && d > 1e-3) {
          const push = (min - d) * 0.5;
          this.pos.x += (dx / d) * push; this.pos.z += (dz / d) * push;
        }
      }
      if (this.state !== 'dissolve') this.pos.y = 0;
    }

    this.group.rotation.y = this.yaw;
    // 피격 플래시 / 투명도
    for (const e of this.mats) {
      if (e.m.emissive) {
        e.m.emissive.setHex(e.emissive).lerp(new THREE.Color(0xffffff), this.hitFlash * 0.9);
        e.m.emissiveIntensity = lerp(e.ei, 1.2, this.hitFlash);
      }
      e.m.opacity = this.opacity * (this.baseOpacity || 1);
    }
    this.animate(dt);
  }

  behave() {}
  animate() {}

  remove() {
    if (this.removed) return;
    this.removed = true;
    this.scene.remove(this.group);
    this.group.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); } });
  }
}

  }
}

    } else if (this.state === 'cast') {
      const t = this.stateT;
      if (t < 0.6) {
        // 집중: 손끝에 불꽃 모임
        const src = this._handPos();
        ctx.effects.emit({ pos: new THREE.Vector3(src.x + rand(-0.6, 0.6), src.y + rand(-0.6, 0.6), src.z + rand(-0.6, 0.6)), vel: new THREE.Vector3(0, 0, 0), life: 0.3, size: 0.3, color: 0x70d0ff });
      }
      if (t >= 0.6 && !this.fired) {
        this.fired = true;
        const src = this._handPos();
        const target = new THREE.Vector3(p.pos.x, p.pos.y + 1.0, p.pos.z);
        // 약간의 리드
        const dir = target.sub(src).normalize();
        ctx.spawnProjectile(src, dir, { speed: 9, dmg: 7, color: 0x60c0ff });
        ctx.sfx && ctx.sfx('fire');
        ctx.effects.burst(src, { count: 8, colors: [0x70d0ff, 0xffffff], speed: 2, life: 0.3, size: 0.3, gravity: 0, drag: 2 });
      }
      if (t >= 1.0) { this.setState('chase'); this.fired = false; this.fireCooldown = rand(2.6, 4.0); }
    }
  }

  _handPos() {
    const fx = Math.sin(this.yaw), fz = Math.cos(this.yaw);
    return new THREE.Vector3(this.pos.x + fx * 0.7 + fz * 0.3, 1.5 + this.bobY, this.pos.z + fz * 0.7 - fx * 0.3);
  }

  animate(dt) {
    const t = performance.now() * 0.001 + this.id;
    this.bobY = Math.sin(t * 2.2) * 0.18 + 0.35;
    if (this.state !== 'dissolve' && this.state !== 'dead' && this.state !== 'spawn') this.pos.y = this.bobY;
    for (let i = 0; i < this.flames.length; i++) {
      const f = this.flames[i];
      const a = t * 2.5 + (i / 3) * Math.PI * 2;
      f.position.set(Math.cos(a) * 0.75, 1.3 + Math.sin(a * 1.7) * 0.3, Math.sin(a) * 0.75);
      f.rotation.set(t * 3, t * 2, 0);
      const s = 0.8 + 0.3 * Math.sin(t * 8 + i);
      f.scale.set(s, s * 1.6, s);
    }
    this.flameMat.opacity = this.opacity * 0.95;
    this.armR.rotation.x = damp(this.armR.rotation.x, this.state === 'cast' ? -1.6 : -0.9, 12, dt);
  }
}

// ---------- 보스: 黒鬼 (흑귀) ----------
class BossOni extends MeleeYokai {
  constructor(scene, pos) {
    super(scene, pos);
    this.name = '흑귀 — 대나무 숲의 주인'; this.kind = 'boss';
    this.isBoss = true;
    this.hp = this.maxHp = 480;
    this.speed = 3.0;
    this.scaleBase = 2.4;
    this.radius = 1.25; this.height = 4.2;
    this.dmg = 16; this.attackRange = 3.6;
    this.attackCooldown = 2;
    this.phase = 1;
    // 색 교체: 검은 몸, 붉은 눈
    for (const e of this.mats) {
      if (e.m.color && e.m.color.getHex() === 0xb8322a) e.m.color.setHex(0x1c1620);
      if (e.m.color && e.m.color.getHex() === 0xd9a640) e.m.color.setHex(0x7a2a2a);
    }
    this.eyeMat.color.setHex(0xff3020); this.eyeMat.emissive.setHex(0xff2010);
    for (const e of this.mats) if (e.m === this.eyeMat) e.emissive = 0xff2010;
    // 가나보 가시
    const spikeGeo = new THREE.ConeGeometry(0.04, 0.12, 4);
    const club = this.armR.children[1];
    for (let i = 0; i < 8; i++) {
      const s = new THREE.Mesh(spikeGeo, mat(0x8a8a90));
      const a = (i / 8) * Math.PI * 2;
      s.position.set(Math.cos(a) * 0.15, Math.sin(a) * 0.15, 0.85);
      s.rotation.z = a - Math.PI / 2;
      club.add(s);
    }
    this._collectMats();
    this.mats = this.mats.filter((v, i, arr) => arr.findIndex((w) => w.m === v.m) === i);
    this.group.scale.set(0.01, 0.01, 0.01);
    this.charge = null;
  }

  behave(dt, ctx) {
    const p = ctx.player;
    const { dx, dz, d, ang } = this._toPlayer(p);
    if (this.hp < this.maxHp * 0.5 && this.phase === 1) {
      this.phase = 2;
      ctx.onBossPhase && ctx.onBossPhase(this);
      ctx.sfx && ctx.sfx('roar');
      ctx.effects.shockwave(this.pos, { color: 0xff3020, radius: 9, life: 0.9, y: 0.1 });
      ctx.effects.burst(this.center, { count: 60, colors: [0xff3020, 0x8a1030, 0xffffff], speed: 6, life: 1.0, size: 0.6, gravity: -2, drag: 1 });
    }
    if (this.state === 'chase') {
      this._faceTo(ang, dt, 4);
      if (!p.alive) return;
      if (this.attackCooldown <= 0) {
        // 공격 선택
        const r = Math.random();
        if (d > 7 && r < 0.65) { this.setState('charge'); this.hit = false; this.charge = null; }
        else if (this.phase === 2 && d > 4 && r < 0.45) { this.setState('firering'); this.fired = false; }
        else if (d <= this.attackRange + 0.5) { this.setState('slam'); this.hit = false; }
        else this._moveTowards(dx, dz, d, dt);
      } else {
        if (d > this.attackRange) this._moveTowards(dx, dz, d, dt);
      }
    } else if (this.state === 'slam') {
      const t = this.stateT;
      if (t < 0.85) this._faceTo(ang, dt, 3);
      if (t >= 0.85 && !this.hit) {
        this.hit = true;
        const fx = Math.sin(this.yaw), fz = Math.cos(this.yaw);
        const impact = new THREE.Vector3(this.pos.x + fx * 2.4, 0, this.pos.z + fz * 2.4);
        ctx.effects.shockwave(impact, { color: 0xffa040, radius: 4.5, life: 0.55, y: 0.1 });
        ctx.effects.burst(impact, { count: 40, colors: [0x6a5a40, 0x9a8a60, 0xff8a30], speed: 6, life: 0.7, size: 0.5, gravity: -9, drag: 1, up: 2 });
        ctx.effects.addShake(0.8);
        ctx.sfx && ctx.sfx('slam');
        const dd = Math.hypot(p.pos.x - impact.x, p.pos.z - impact.z);
        if (dd < 4.2) p.takeDamage(this.dmg, impact, ctx.effects);
      }
      if (t >= 1.5) { this.setState('chase'); this.attackCooldown = rand(1.6, 2.4); }
    } else if (this.state === 'charge') {
      const t = this.stateT;
      if (t < 0.7) {
        if (t < 0.05 && !this.roared) { this.roared = true; ctx.sfx && ctx.sfx('roar'); }
        this._faceTo(ang, dt, 6);
        if (Math.random() < 0.6) ctx.effects.emit({ pos: new THREE.Vector3(this.pos.x + rand(-1, 1), 0.3, this.pos.z + rand(-1, 1)), vel: new THREE.Vector3(0, 2, 0), life: 0.4, size: 0.5, color: 0xff3020 });
      } else if (t < 1.5) {
        if (!this.charge) this.charge = new THREE.Vector3(Math.sin(this.yaw), 0, Math.cos(this.yaw));
        this.pos.addScaledVector(this.charge, 15 * dt);
        ctx.effects.emit({ pos: new THREE.Vector3(this.pos.x + rand(-1, 1), 0.3, this.pos.z + rand(-1, 1)), vel: new THREE.Vector3(0, 1.5, 0), life: 0.5, size: 0.7, color: 0x5a4a3a });
        if (!this.hit && d < this.radius + p.radius + 0.6) {
          this.hit = true;
          p.takeDamage(12, this.pos, ctx.effects);
          ctx.effects.addShake(0.5);
        }
        // 벽에 부딪히면 정지
        if (Math.hypot(this.pos.x, this.pos.z) > ARENA_RADIUS - this.radius - 0.2) { this.stateT = 1.5; ctx.effects.addShake(0.6); ctx.effects.shockwave(this.pos, { color: 0xffffff, radius: 3, life: 0.4 }); }
      }
      if (t >= 2.1) { this.setState('chase'); this.roared = false; this.attackCooldown = rand(1.4, 2.2); }
    } else if (this.state === 'firering') {
      const t = this.stateT;
      if (t < 0.9) {
        ctx.effects.emit({ pos: this.center.add(new THREE.Vector3(rand(-1.5, 1.5), rand(-1, 1), rand(-1.5, 1.5))), vel: new THREE.Vector3(0, 0, 0), life: 0.3, size: 0.5, color: 0xff6030 });
      }
      if (t >= 0.9 && !this.fired) {
        this.fired = true;
        const n = 10;
        const src = this.center;
        for (let i = 0; i < n; i++) {
          const a = ang + (i / n) * Math.PI * 2;
          const dir = new THREE.Vector3(Math.sin(a), -0.08, Math.cos(a));
          ctx.spawnProjectile(src.clone(), dir, { speed: 7.5, dmg: 8, color: 0xff6030, size: 0.32, life: 5 });
        }
        ctx.effects.shockwave(this.pos, { color: 0xff6030, radius: 5, life: 0.5 });
        ctx.sfx && ctx.sfx('fire');
      }
      if (t >= 1.6) { this.setState('chase'); this.attackCooldown = rand(1.5, 2.5); }
    }
  }

  animate(dt) {
    const t = this.stateT;
    let ax = 0.2, ay = 0, lean = 0;
    if (this.state === 'slam') {
      if (t < 0.85) { const k = easeOutCubic(t / 0.85); ax = lerp(0.2, -3.0, k); lean = -0.2 * k; }
      else { const k = clamp((t - 0.85) / 0.15, 0, 1); ax = lerp(-3.0, -0.3, easeOutCubic(k)); lean = lerp(-0.2, 0.3, k); }
      if (t > 1.1) { const k = clamp((t - 1.1) / 0.4, 0, 1); ax = lerp(-0.3, 0.2, k); lean = lerp(0.3, 0, k); }
    } else if (this.state === 'charge') {
      if (t < 0.7) { lean = -0.25; ax = -0.6; } else { lean = 0.35; ax = -1.2; ay = 0.8; }
    } else if (this.state === 'firering') {
      ax = -2.2; ay = 1.0; lean = -0.1;
    } else if (this.state === 'chase') {
      const w = performance.now() * 0.007 + this.id;
      this.legs[0].rotation.x = Math.sin(w) * 0.5; this.legs[1].rotation.x = -Math.sin(w) * 0.5;
      this.armL.rotation.x = -Math.sin(w) * 0.4;
      ax = 0.2 + Math.sin(w) * 0.2; lean = 0.1;
    }
    this.armR.rotation.x = damp(this.armR.rotation.x, ax, 18, dt);
    this.armR.rotation.y = damp(this.armR.rotation.y, ay, 18, dt);
    if (this.state !== 'dead') this.group.rotation.x = damp(this.group.rotation.x, lean, 10, dt);
    const telegraph = (this.state === 'slam' && t < 0.85) || (this.state === 'charge' && t < 0.7) || (this.state === 'firering' && t < 0.9);
    this.eyeMat.emissive.setHex(telegraph ? 0xffffff : 0xff2010);
    this.eyeMat.emissiveIntensity = telegraph ? 2 : 0.9;
  }
}

// ---------- 웨이브/스폰 관리 ----------
const WAVES = [
  { melee: 2, ranged: 0, title: '첫 번째 파도', sub: '소귀들이 안개 속에서 기어 나온다' },
  { melee: 2, ranged: 2, title: '두 번째 파도', sub: '귀화가 대나무 사이를 떠돈다' },
  { melee: 3, ranged: 2, title: '세 번째 파도', sub: '숲 전체가 술렁인다' },
  { boss: true, title: '흑귀', sub: '대나무 숲의 주인이 눈을 뜬다' },
];

class EnemyManager {
  constructor(scene) {
    this.scene = scene;
    this.list = [];
    this.projectiles = [];
    this.waveIndex = -1;
    this.waveDelay = 2.5;
    this.boss = null;
    this.bossDefeated = false;
    this.kills = 0;
    this.onMessage = null;
    this.onBossSpawn = null;
    this.onBossDefeated = null;
    this.dissolved = false;
    this.spawnQueue = [];
    this.pickups = [];
    this.onKill = null;
    this.onPickup = null;
    this.onWave = null;
  }

  get aliveCount() { return this.list.filter((e) => e.alive).length; }
  get totalWaves() { return WAVES.length; }
  get allWavesCleared() { return this.waveIndex >= WAVES.length - 1 && this.aliveCount === 0 && this.spawnQueue.length === 0; }

  _spawnPos(player, min = 10, max = 16) {
    for (let i = 0; i < 20; i++) {
      const a = rand(0, Math.PI * 2);
      const r = rand(min, max);
      const p = new THREE.Vector3(player.pos.x + Math.cos(a) * r, 0, player.pos.z + Math.sin(a) * r);
      const d = Math.hypot(p.x, p.z);
      if (d > ARENA_RADIUS - 2) { const k = (ARENA_RADIUS - 2) / d; p.x *= k; p.z *= k; }
      if (Math.hypot(p.x - player.pos.x, p.z - player.pos.z) > 6) return p;
    }
    return new THREE.Vector3(0, 0, -12);
  }

  startWave(index, player) {
    this.waveIndex = index;
    const w = WAVES[index];
    if (!w) return;
    this.onMessage && this.onMessage(w.title, w.sub);
    this.onWave && this.onWave(index, w);
    if (w.boss) {
      const pos = new THREE.Vector3(0, 0, -12);
      this.boss = new BossOni(this.scene, pos);
      this.list.push(this.boss);
      this.onBossSpawn && this.onBossSpawn(this.boss);
      return;
    }
    let delay = 0;
    for (let i = 0; i < w.melee; i++) { this.spawnQueue.push({ t: delay, type: 'melee' }); delay += 0.35; }
    for (let i = 0; i < w.ranged; i++) { this.spawnQueue.push({ t: delay, type: 'ranged' }); delay += 0.35; }
  }

  spawnProjectile(pos, dir, opts) {
    this.projectiles.push(new Projectile(this.scene, pos, dir, opts));
  }

  dissolveAll(effects) {
    if (this.dissolved) return;
    this.dissolved = true;
    this.spawnQueue.length = 0;
    for (const e of this.list) e.dissolve(effects);
    for (const p of this.projectiles) p.destroy(effects);
  }

  update(dt, ctx) {
    const player = ctx.player;
    ctx.enemies = this.list;
    ctx.pickups = this.pickups;
    ctx.projectiles = this.projectiles;
    ctx.spawnProjectile = (p, d, o) => this.spawnProjectile(p, d, o);

    // 스폰 큐
    if (!this.dissolved) {
      for (let i = this.spawnQueue.length - 1; i >= 0; i--) {
        const s = this.spawnQueue[i];
        s.t -= dt;
        if (s.t <= 0) {
          const pos = this._spawnPos(player);
          const e = s.type === 'melee' ? new MeleeYokai(this.scene, pos) : new RangedYokai(this.scene, pos);
          this.list.push(e);
          ctx.effects.mist(new THREE.Vector3(pos.x, 0.5, pos.z), undefined, 25);
          ctx.sfx && ctx.sfx('spawn');
          this.spawnQueue.splice(i, 1);
        }
      }
      // 다음 웨이브
      if (this.aliveCount === 0 && this.spawnQueue.length === 0 && this.waveIndex < WAVES.length - 1 && player.alive) {
        this.waveDelay -= dt;
        if (this.waveDelay <= 0) { this.startWave(this.waveIndex + 1, player); this.waveDelay = 3.5; }
      }
      // 보스 2페이즈 시 추가 소환
      if (this.boss && this.boss.alive && this.boss.phase === 2 && !this.boss.addsSpawned) {
        this.boss.addsSpawned = true;
        this.spawnQueue.push({ t: 0.5, type: 'ranged' }, { t: 1.3, type: 'melee' });
      }
    }

    // 적 업데이트
    for (const e of this.list) e.update(dt, ctx);
    for (let i = this.list.length - 1; i >= 0; i--) {
      const e = this.list[i];
      if (!e.alive && !e.dissolving && !e.dropped) { e.dropped = true; this._onDeath(e, ctx); }
      if (e.removed) this.list.splice(i, 1);
    }
    this._updatePickups(dt, ctx);
    // 보스 사망 → 새벽
    if (this.boss && !this.boss.alive && !this.bossDefeated && !this.boss.dissolving) {
      this.bossDefeated = true;
      this.onBossDefeated && this.onBossDefeated(this.boss);
    }

    // 투사체
    for (const p of this.projectiles) p.update(dt, ctx);
    for (let i = this.projectiles.length - 1; i >= 0; i--) if (!this.projectiles[i].alive) this.projectiles.splice(i, 1);
  }

  // 사망: 경험치 콜백 + 아이템 드롭
  _onDeath(e, ctx) {
    this.kills++;
    this.onKill && this.onKill(e);
    const boss = e.isBoss;
    const potionChance = boss ? 1 : 0.22;
    if (Math.random() < potionChance) this._spawnPickup({ type: 'potion' }, e.pos, ctx);
    const itemChance = boss ? 1 : e.kind === 'ranged' ? 0.3 : 0.24;
    if (Math.random() < itemChance) {
      const level = (ctx.player.progress && ctx.player.progress.level) || 1;
      this._spawnPickup({ type: 'item', item: generateItem(rollRarity(boss), null, level) }, e.pos, ctx);
      if (boss) this._spawnPickup({ type: 'item', item: generateItem(rollRarity(true), null, level) }, e.pos, ctx);
    }
  }

  _spawnPickup(data, pos, ctx) {
    const g = new THREE.Group();
    let color;
    if (data.type === 'potion') {
      color = 0xff5070;
      const bottle = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.36, 7), new THREE.MeshLambertMaterial({ color: 0xff4060, emissive: 0xff2040, emissiveIntensity: 0.8, transparent: true, opacity: 0.9 }));
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.14, 6), new THREE.MeshLambertMaterial({ color: 0x3a2a20 }));
      neck.position.y = 0.25;
      g.add(bottle, neck);
    } else {
      color = RARITIES[data.item.rarity].hex;
      const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.28, 0), new THREE.MeshLambertMaterial({ color, emissive: color, emissiveIntensity: 0.9 }));
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.03, 6, 20), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7 }));
      ring.rotation.x = Math.PI / 2;
      g.add(gem, ring);
    }
    const a = rand(0, Math.PI * 2), r = rand(0.4, 1.4);
    g.position.set(pos.x + Math.cos(a) * r, 0.5, pos.z + Math.sin(a) * r);
    ctx.stage.resolveCollisions(g.position, 0.3);
    this.scene.add(g);
    this.pickups.push({ ...data, group: g, color, life: 45, t: rand(0, 6), vy: 3 });
    ctx.effects.burst(g.position, { count: 12, colors: [color, 0xffffff], speed: 2, life: 0.6, size: 0.35, gravity: 0, drag: 2 });
  }

  _updatePickups(dt, ctx) {
    const p = ctx.player;
    for (let i = this.pickups.length - 1; i >= 0; i--) {
      const k = this.pickups[i];
      k.t += dt; k.life -= dt;
      // 낙하 후 둥실
      if (k.vy > 0) { k.vy -= 8 * dt; k.group.position.y += k.vy * dt; if (k.group.position.y < 0.5) { k.group.position.y = 0.5; k.vy = 0; } }
      else k.group.position.y = 0.5 + Math.sin(k.t * 3) * 0.12;
      k.group.rotation.y += dt * 2;
      if (Math.random() < 0.15) ctx.effects.emit({ pos: k.group.position, vel: new THREE.Vector3(rand(-0.3, 0.3), rand(0.5, 1.2), rand(-0.3, 0.3)), life: 0.7, size: 0.25, color: k.color, drag: 1 });
      const d = Math.hypot(p.pos.x - k.group.position.x, p.pos.z - k.group.position.z);
      // 가까우면 끌려옴
      if (p.alive && d < 3.2) {
        const pull = Math.min(1, (3.2 - d) / 3.2) * 9 * dt;
        k.group.position.x += (p.pos.x - k.group.position.x) / Math.max(d, 0.01) * pull;
        k.group.position.z += (p.pos.z - k.group.position.z) / Math.max(d, 0.01) * pull;
      }
      const taken = p.alive && d < 0.9 && this.onPickup && this.onPickup(k);
      if (taken || k.life <= 0) {
        if (taken) ctx.effects.burst(k.group.position, { count: 16, colors: [k.color, 0xffffff], speed: 3, life: 0.5, size: 0.35, gravity: 1, drag: 1.5, up: 2 });
        this.scene.remove(k.group);
        k.group.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
        this.pickups.splice(i, 1);
      }
    }
  }
}

return { Projectile, Enemy, MeleeYokai, RangedYokai, BossOni, EnemyManager };
})();

  // ---------- 캐릭터 선택 ----------
  showSelect(progressOf) {

  // ---------- 장비·스킬 메뉴 ----------

  }
  hideMenu() { this.menu.className = 'screen'; }
  setMenuTab(tab) { this.menuTab = tab; this.renderMenu(); }
  renderMenu() {
    const pr = this.progress, ch = this.character;
    if (!pr) return;
    for (const b of this.menu.querySelectorAll('.tab')) b.classList.toggle('on', b.dataset.tab === this.menuTab);

      <div class="skill-col">

          <div class="gear-title">합계</div>
          <div class="totals">${Object.keys(totals).length ? Object.entries(totals).map(([k, v]) => `<span>${STATS[k].name} ${STATS[k].fmt(v)}</span>`).join('') : '<span>장착한 장비 없음</span>'}</div>
          <div class="legend">${Object.values(RARITIES).map((r) => `<span style="color:${r.color}">■ ${r.name}</span>`).join('')}</div>

      </div>`;
    for (const el of box.querySelectorAll('.item[data-action=equip]')) {
      el.addEventListener('click', () => { pr.equip(el.dataset.id); this.onEquip && this.onEquip(); this.renderMenu(); });
      // 길게 누르거나 우클릭으로 버리기
      el.addEventListener('contextmenu', (e) => { e.preventDefault(); if (confirm('이 아이템을 버릴까요?')) { pr.discard(el.dataset.id); this.renderMenu(); } });
    }
    for (const el of box.querySelectorAll('.item[data-action=unequip]')) {
      el.addEventListener('click', () => { const slot = Object.keys(SLOTS).find((s) => pr.equipped[s] && pr.equipped[s].id === el.dataset.id); pr.unequip(slot); this.onUnequip && this.onUnequip(); this.renderMenu(); });
    }
  }

  update(dt) {
    if (this.msgTimer > 0) { this.msgTimer -= dt; if (this.msgTimer <= 0) this.msg.classList.remove('show'); }
    if (this.vig > 0) { this.vig = Math.max(0, this.vig - dt * 2.5); this.vignette.style.opacity = this.vig; }
  }
}

return { UI };
})();

    const len = Math.hypot(dx, dy);
    const k = len > STICK_RADIUS ? STICK_RADIUS / len : 1;
    const nx = (dx * k) / STICK_RADIUS, ny = (dy * k) / STICK_RADIUS;
    knob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
    const dead = 0.12;
    const mag = Math.hypot(nx, ny);
    if (mag < dead) { input.axisX = 0; input.axisY = 0; return; }
    const scale = Math.min(1, (mag - dead) / (1 - dead)) / mag;
    input.axisX = nx * scale;
    input.axisY = -ny * scale; // 화면 위쪽 = 전진
  };

  const onStart = (e) => {
    for (const t of e.changedTouches) {
      const target = t.target;
      if (target.closest && target.closest('.tb, #top-btns')) continue;
      const leftHalf = t.clientX < window.innerWidth * 0.5;
      if (leftHalf && stickId === null) {
        stickId = t.identifier; stickX = t.clientX; stickY = t.clientY;
        stick.style.left = `${stickX}px`; stick.style.top = `${stickY}px`;
        stick.style.display = 'block';
        setAxis(0, 0);
      } else if (lookId === null) {
        lookId = t.identifier; lookX = t.clientX; lookY = t.clientY;
        lookStart = performance.now(); lookMoved = 0;
      }
    }
    if (e.cancelable) e.preventDefault();
  };
  const onMove = (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) {
        setAxis(t.clientX - stickX, t.clientY - stickY);
      } else if (t.identifier === lookId) {
        const dx = t.clientX - lookX, dy = t.clientY - lookY;
        lookX = t.clientX; lookY = t.clientY;
        lookMoved += Math.hypot(dx, dy);
        input.mouseDX += dx * LOOK_SENS;
        input.mouseDY += dy * LOOK_SENS;
      }
    }
    if (e.cancelable) e.preventDefault();
  };
  const onEnd = (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) {
        stickId = null; input.axisX = 0; input.axisY = 0;
        stick.style.display = 'none';
      } else if (t.identifier === lookId) {
        if (performance.now() - lookStart < TAP_TIME && lookMoved < TAP_MOVE) input.light = true;
        lookId = null;
      }
    }
    if (e.cancelable) e.preventDefault();
  };
  const opts = { passive: false };
  layer.addEventListener('touchstart', onStart, opts);
  layer.addEventListener('touchmove', onMove, opts);
  layer.addEventListener('touchend', onEnd, opts);
  layer.addEventListener('touchcancel', onEnd, opts);

  // 액션 버튼
  for (const b of layer.querySelectorAll('.tb')) {
    const act = b.dataset.act;
    b.addEventListener('touchstart', (e) => { input[act] = true; b.classList.add('on'); if (e.cancelable) e.preventDefault(); e.stopPropagation(); }, opts);
    const off = (e) => { b.classList.remove('on'); if (e.cancelable) e.preventDefault(); e.stopPropagation(); };
    b.addEventListener('touchend', off, opts);
    b.addEventListener('touchcancel', off, opts);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  const bindTop = (id, fn) => {
    const b = layer.querySelector(id);
    b.addEventListener('touchstart', (e) => { if (e.cancelable) e.preventDefault(); e.stopPropagation(); fn && fn(); }, opts);
    b.addEventListener('click', (e) => { e.preventDefault(); fn && fn(); });
  };
  bindTop('#tb-pause', onPause);
  bindTop('#tb-menu', onMenu);
  bindTop('#tb-sound', onSound);

  const api = {
    layer,
    setActive(on) {
      layer.classList.toggle('active', !!on);
      if (!on) { stickId = null; lookId = null; input.axisX = 0; input.axisY = 0; stick.style.display = 'none'; }
      else if (!hintTimer) { hint.classList.add('show'); hintTimer = setTimeout(() => hint.classList.remove('show'), 5000); }
    },
    setSpecialReady(ready) { layer.querySelector('.tb-special').classList.toggle('ready', !!ready); },
    setPotions(n) { layer.querySelector('#tb-potion-n').textContent = n; layer.querySelector('.tb-potion').classList.toggle('empty', n <= 0); },
    setSound(muted) { layer.querySelector('#tb-sound').textContent = muted ? '소리 꺼짐' : '소리 켜짐'; },
  };
  return api;
}

return { isTouchDevice, setupTouch };
})();

// ===== main.js =====
(() => {
// main.js — 초기화, 입력, 게임 루프, 상태(타이틀/선택/플레이/일시정지/메뉴/결과), 밤→새벽 규칙,
//           경험치·레벨업, 아이템 획득, 오디오 연동










const TOUCH = isTouchDevice();

const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, TOUCH ? 1.5 : 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 260);

const ui = new UI({ touch: TOUCH });
const audio = new GameAudio();
let stage, player, enemies, effects;
let touch = null;
let state = 'title';   // title | select | playing | paused | menu | dying | ended
let wasLocked = false;
let elapsed = 0;
let hitstop = 0;
let dawnEndTimer = 0;
let endKind = null;
let character = CHARACTERS[0];
let progress = null;
const progressCache = {};
const progressOf = (id) => (progressCache[id] = progressCache[id] || new Progress(id));
const stats = { kills: 0, maxCombo: 0, specials: 0, time: 0, xpGained: 0, itemsGained: 0 };
try { const last = localStorage.getItem('taisho_last_char'); if (last) character = CHARACTERS.find((c) => c.id === last) || character; } catch (_) { /* ignore */ }

// ---------- 입력 ----------
const input = { keys: {}, mouseDX: 0, mouseDY: 0, axisX: 0, axisY: 0, light: false, heavy: false, special: false, dash: false, potion: false };
if (TOUCH) {
  touch = setupTouch(input, { onPause: () => pause(), onMenu: () => toggleMenu(), onSound: () => toggleSound() });
  touch.setSound(audio.muted);
  document.body.classList.add('touch');
}

window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  input.keys[e.code] = true;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') input.dash = true;
  if (e.code === 'KeyF' || e.code === 'Space') { input.special = true; e.preventDefault(); }
  if (e.code === 'KeyQ') input.potion = true;
  if (e.code === 'KeyM') toggleSound();
  if (e.code === 'Tab' || e.code === 'KeyT') { e.preventDefault(); toggleMenu(); }
  if (e.code === 'Escape') { if (state === 'playing') pause(); else if (state === 'menu') closeMenu(); }
});
window.addEventListener('keyup', (e) => { input.keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in input.keys) input.keys[k] = false; });
document.addEventListener('mousemove', (e) => {
  if (state !== 'playing') return;
  input.mouseDX += e.movementX || 0;
  input.mouseDY += e.movementY || 0;
});
canvas.addEventListener('mousedown', (e) => {
  if (state !== 'playing') return;
  if (e.button === 0) input.light = true;
  if (e.button === 2) input.heavy = true;
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
document.getElementById('ui').addEventListener('contextmenu', (e) => { if (!e.target.closest('.item')) e.preventDefault(); });

document.addEventListener('pointerlockchange', () => {
  const locked = document.pointerLockElement === canvas;
  if (locked) wasLocked = true;
  if (!locked && wasLocked && state === 'playing') pause();
});

ui.screen.addEventListener('click', () => {
  audio.init();
  if (state === 'title') { ui.hideScreen(); showSelect(); }
  else if (state === 'paused') resume();
  else if (state === 'ended') { ui.hideScreen(); showSelect(); }
});
ui.onSelect = (ch) => { audio.init(); character = ch; try { localStorage.setItem('taisho_last_char', ch.id); } catch (_) { /* ignore */ } ui.hideSelect(); resetWorld(); startGame(); };
ui.onMenuClose = () => closeMenu();
ui.onLearn = (id) => { player.applySkills(); audio.sfx('start'); ui.logLine(`<b>스킬 습득</b> ${id}`); };
ui.onResetSkills = () => player.applySkills();
ui.onEquip = () => { player.applySkills(); audio.sfx('parry'); };
ui.onUnequip = () => player.applySkills();

function lockPointer() {
  if (TOUCH) return;
  try {
    const p = canvas.requestPointerLock({ unadjustedMovement: true });
    if (p && p.catch) p.catch(() => { try { canvas.requestPointerLock(); } catch (_) { /* ignore */ } });
  } catch (_) { try { canvas.requestPointerLock(); } catch (__) { /* ignore */ } }
}
function toggleSound() {
  audio.init();
  const muted = audio.toggleMute();
  if (touch) touch.setSound(muted);
  ui.logLine(muted ? '소리 꺼짐' : '소리 켜짐');
}

// ---------- 월드 ----------
function buildWorld() {
  effects = new Effects(scene);
  stage = new Stage(scene, { mobile: TOUCH });
  progress = progressOf(character.id);
  player = new Player(scene, character, progress);
  enemies = new EnemyManager(scene);
  enemies.onMessage = (t, s) => ui.message(t, s);
  enemies.onWave = (i, w) => { audio.sfx('gong'); if (i > 0) gainXp(XP_REWARD.wave, '파도 돌파'); };
  enemies.onBossSpawn = (b) => { ui.showBoss(b.name); effects.addShake(0.6); audio.setMode('boss'); audio.sfx('roar'); };
  enemies.onBossDefeated = () => {
    stage.triggerDawn();
    ui.message('새벽', '새벽이 온다 — 요괴들이 재가 되어 흩어진다', 4);
    endKind = 'victory';
    audio.setMode('dawn'); audio.sfx('bell');
    gainXp(XP_REWARD.night, '밤을 넘김');
  };
  enemies.onKill = (e) => gainXp(XP_REWARD[e.kind] || XP_REWARD.melee, null);
  enemies.onPickup = (k) => onPickup(k);
  elapsed = 0; hitstop = 0; dawnEndTimer = 0; endKind = null;
  stats.kills = 0; stats.maxCombo = 0; stats.specials = 0; stats.time = 0; stats.xpGained = 0; stats.itemsGained = 0;
  ui.hideBoss();
  ui.setHP(player.hp, player.maxHp); ui.setGauge(0, 100); ui.setCombo(0, 0); ui.setProgress(progress);
}

function resetWorld() {
  while (scene.children.length) {
    const o = scene.children[0];
    scene.remove(o);
    o.traverse && o.traverse((c) => {
      if (c.isMesh || c.isPoints) {
        c.geometry && c.geometry.dispose();
        const ms = Array.isArray(c.material) ? c.material : [c.material];
        ms.forEach((m) => m && m.dispose && m.dispose());
      }
    });
  }
  scene.fog = null;
  buildWorld();
}

function gainXp(amount, label) {
  const ups = progress.addXp(amount);
  stats.xpGained += amount;
  if (label) ui.logLine(`<b>+${amount} 경험치</b> ${label}`);
  if (ups > 0) {
    ui.message(`레벨 ${progress.level}`, `스킬 포인트 +${ups} — ${TOUCH ? '장비·스킬 버튼' : 'Tab'}으로 스킬을 익히세요`, 3);
    audio.sfx('bell');
    effects.burst(player.center, { count: 40, colors: [0xffd9a0, 0xffffff, character.colors.glow], speed: 3, life: 1.0, size: 0.45, gravity: 2, drag: 1, up: 2 });
  }
  ui.setProgress(progress);
}

function onPickup(k) {
  if (k.type === 'potion') {
    if (progress.potions >= POTION_MAX) { return false; }
    progress.addPotion(1, POTION_MAX);
    ui.logLine(`<b>회복약</b> 획득 (${progress.potions}/${POTION_MAX})`, 'potion');
    audio.sfx('parry');
  } else {
    if (!progress.addItem(k.item, BAG_MAX)) { ui.logLine('가방이 가득 찼습니다', 'warn'); return false; }
    const r = RARITIES[k.item.rarity];
    stats.itemsGained++;
    ui.logLine(`<span style="color:${r.color}">[${r.name}] ${k.item.name}</span> 획득`, k.item.rarity);
    audio.sfx(k.item.rarity === 'common' ? 'parry' : 'bell');
    if (k.item.rarity === 'unique' || k.item.rarity === 'hidden') ui.message(`${r.name} 아이템!`, k.item.name, 2.2);
  }
  ui.setProgress(progress);
  return true;
}

function showSelect() { state = 'select'; ui.hideScreen(); ui.hideMenu(); ui.showSelect(progressOf); audio.setMode('menu'); }
function startGame() {
  state = 'playing';
  wasLocked = false;
  ui.hideScreen();
  lockPointer();
  ui.message('대숲의 밤', `${character.name} — ${character.style}. 요괴는 밤에만 움직인다.`, 3.5);
  enemies.waveDelay = 2.5;
  audio.setMode('night'); audio.sfx('start');
}
function pause() {
  if (state !== 'playing') return;
  state = 'paused';
  ui.showScreen('pause');
  if (document.pointerLockElement === canvas) document.exitPointerLock();
}
function resume() {
  state = 'playing';
  ui.hideScreen();
  lockPointer();
}
function toggleMenu() {
  if (state === 'playing' || state === 'paused') openMenu();
  else if (state === 'menu') closeMenu();
}
function openMenu() {
  state = 'menu';
  ui.hideScreen();
  ui.showMenu(character, progress, progress.points > 0 ? 'skills' : ui.menuTab);
  if (document.pointerLockElement === canvas) document.exitPointerLock();
}
function closeMenu() {
  ui.hideMenu();
  if (player.alive) resume(); else state = 'dying';
}
function endGame(kind) {
  state = 'ended';
  stats.time = elapsed;
  ui.hideBoss();
  ui.showScreen(kind, stats);
  audio.setMode('menu');
  if (document.pointerLockElement === canvas) document.exitPointerLock();
}

// ---------- 루프 ----------
const clock = new THREE.Clock();
const ctx = { player: null, stage: null, effects: null, enemies: [], projectiles: [], pickups: [], spawnProjectile: null, sfx: (n) => audio.sfx(n) };

function frame() {
  requestAnimationFrame(frame);
  let dt = Math.min(clock.getDelta(), 0.05);
  const playing = state === 'playing';
  if (hitstop > 0) { hitstop -= dt; dt *= 0.08; }

  ctx.player = player; ctx.stage = stage; ctx.effects = effects;
  ctx.onBossPhase = () => { ui.message('흑귀 · 격앙', '흑귀가 분노한다 — 귀화의 고리를 조심하라', 3); effects.addShake(0.5); };

  if (playing) {
    elapsed += dt;
    player.update(dt, input, ctx);
    enemies.update(dt, ctx);
    for (const ev of player.events) {
      switch (ev.type) {
        case 'damaged': ui.damageFlash(); audio.sfx('hurt'); break;
        case 'special': stats.specials++; ui.message(character.special.name, '', 1.4); audio.sfx('special'); break;
        case 'wave': audio.sfx('wave'); break;
        case 'swing': audio.sfx(ev.heavy ? 'swingHeavy' : ev.special ? 'wave' : 'swing'); break;
        case 'hit': audio.sfx(ev.killed ? 'kill' : ev.heavy || ev.special ? 'hitHeavy' : 'hit'); break;
        case 'parry': audio.sfx('parry'); break;
        case 'dash': audio.sfx('dash'); break;
        case 'potion': audio.sfx('bell'); ui.logLine(`<b>회복약</b> 사용 — 남은 ${progress.potions}개`, 'potion'); ui.setProgress(progress); break;
        case 'potionFail': ui.logLine(progress.potions <= 0 ? '회복약이 없습니다' : '체력이 이미 가득합니다', 'warn'); break;
        case 'dead': audio.sfx('dead'); setTimeout(() => endGame('defeat'), 1400); state = 'dying'; break;
        default: break;
      }
    }
    if (player.hitstop > 0) { hitstop = Math.max(hitstop, player.hitstop); player.hitstop = 0; }
    stats.kills = player.kills;
    stats.maxCombo = Math.max(stats.maxCombo, player.combo);

    if (stage.isDawn) {
      enemies.dissolveAll(effects);
      if (!endKind) { endKind = 'survived'; ui.message('새벽', '새벽이 온다 — 요괴들이 재가 되어 흩어진다', 4); ui.hideBoss(); audio.setMode('dawn'); audio.sfx('bell'); gainXp(XP_REWARD.night, '밤을 버팀'); }
      dawnEndTimer += dt;
      if (dawnEndTimer > 6.5) endGame(endKind);
    }
  } else if (state === 'dying') {
    player.update(dt, input, ctx);
    enemies.update(dt, ctx);
  }

  if (stage) {
    stage.update(dt, playing, player.pos);
    effects.update(dt);
    player.updateCamera(camera, dt, effects.shake);
  }
  input.mouseDX = 0; input.mouseDY = 0;
  input.light = input.heavy = input.special = input.dash = input.potion = false;

  if (touch) { touch.setActive(playing); touch.setSpecialReady(player.specialReady); touch.setPotions(progress.potions); }
  ui.setHP(player.hp, player.maxHp);
  ui.setGauge(player.gauge, player.gaugeMax);
  ui.setCombo(player.combo, player.comboPop);
  ui.setNight(stage.nightProgress, enemies.waveIndex, enemies.totalWaves, player.kills, stage.isDawn);
  ui.setDash(player.dashCooldown / Math.max(0.05, player.skill.dashCooldown));
  if (enemies.boss && enemies.boss.alive) ui.setBossHP(enemies.boss.hp, enemies.boss.maxHp);
  else if (enemies.boss && !enemies.boss.alive) ui.hideBoss();
  ui.update(dt);

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

buildWorld();
ui.showScreen('title');
frame();

// 디버그/테스트용 노출
window.__game = {
  get state() { return state; }, get time() { return stage.time; }, get player() { return player; }, get enemies() { return enemies; },
  get stage() { return stage; }, get progress() { return progress; }, get audio() { return audio; }, input, showSelect, openMenu, closeMenu,
};

})();

</script>
</body>
