  }
  _itemCard(it, action, extra = '') {
    const r = RARITIES[it.rarity];
    const label = { equip: '장착', unequip: '해제', buy: `구입 ${r.price}G`, sell: `판매 ${sellPrice(it)}G` }[action] || '';
    return `<div class="item ${it.rarity}" data-id="${it.id}" data-action="${action}" style="--rc:${r.color}">
      <div class="icon">${ICONS[it.slot]}</div>
      <div class="ibody">
        <div class="irow"><span class="irarity">${r.name}</span><span class="islot">${SLOTS[it.slot]}</span></div>
        <div class="iname">${it.name}</div>
        <div class="istats">${Object.entries(it.stats).map(([k, v]) => `<span>${STATS[k].name} ${STATS[k].fmt(v)}</span>`).join('')}</div>

  _renderGear() {
    const pr = this.progress;

      <div class="gear-wrap">

          <div class="legend">${Object.values(RARITIES).map((r) => `<span style="color:${r.color}">■ ${r.name}</span>`).join('')}</div>
        </div>
        <div class="gear-right">
          <div class="gear-title">가방 <span>${bag.length} / 30 · 우클릭(길게 누르기): 버리기</span></div>
          <div class="bag">${bag.length ? bag.map((it) => this._itemCard(it, 'equip')).join('') : '<div class="tip">요괴를 베면 아이템을 떨어뜨립니다. 가까이 가면 자동으로 줍습니다. 상점에서 살 수도 있습니다.</div>'}</div>
        </div>
      </div>`;
    for (const el of box.querySelectorAll('.item[data-action=equip]')) {
      el.addEventListener('click', () => { pr.equip(el.dataset.id); this.onEquip && this.onEquip(); this.renderMenu(); });
      el.addEventListener('contextmenu', (e) => { e.preventDefault(); if (confirm('이 아이템을 버릴까요?')) { pr.discard(el.dataset.id); this.renderMenu(); } });
      let pressT = null;
      el.addEventListener('touchstart', () => { pressT = setTimeout(() => { if (confirm('이 아이템을 버릴까요?')) { pr.discard(el.dataset.id); this.renderMenu(); } }, 700); }, { passive: true });
      el.addEventListener('touchend', () => clearTimeout(pressT)); el.addEventListener('touchmove', () => clearTimeout(pressT));
    }
    for (const el of box.querySelectorAll('.doll-slot:not(.empty)')) {
      el.addEventListener('click', () => { pr.unequip(el.dataset.slot); this.onUnequip && this.onUnequip(); this.renderMenu(); });
    }
  }
  _renderShop() {
    const pr = this.progress;
    const box = this.$('menu-shop');
    const stock = (pr.shop && pr.shop.stock) || [];
    const bag = [...pr.items].sort((a, b) => itemScore(b) - itemScore(a));
    box.innerHTML = `
      <div class="gear-wrap">
        <div class="gear-left shop-left">
          <div class="gear-title">떠돌이 상인 <span>금화 ${pr.gold}G</span></div>
          <div class="shop-potion"><div class="icon" style="color:#ff6080">${ICONS.potion}</div><div class="ibody"><div class="iname">회복약</div><div class="istats"><span>체력 45 회복 · 보유 ${pr.potions}/${POTION_MAX}</span></div></div><button id="buy-potion" class="shop-btn" ${pr.gold < POTION_PRICE || pr.potions >= POTION_MAX ? 'disabled' : ''}>${POTION_PRICE}G</button></div>
          <div class="gear-title">진열 장비 <span>장이 바뀌면 새 물건이 들어옵니다</span></div>
          <div class="bag shop-stock">${stock.length ? stock.map((it) => this._itemCard(it, 'buy', pr.gold < RARITIES[it.rarity].price ? '<em>금화 부족</em>' : '')).join('') : '<div class="tip">진열된 물건이 없습니다.</div>'}</div>
        </div>
        <div class="gear-right">
          <div class="gear-title">판매 <span>가방의 장비를 팔아 금화를 얻습니다</span></div>
          <div class="bag">${bag.length ? bag.map((it) => this._itemCard(it, 'sell')).join('') : '<div class="tip">팔 수 있는 장비가 없습니다.</div>'}</div>
        </div>
      </div>`;
    box.querySelector('#buy-potion').addEventListener('click', () => { if (this.onBuyPotion && this.onBuyPotion()) this.renderMenu(); });
    for (const el of box.querySelectorAll('.item[data-action=buy]')) {
      el.addEventListener('click', () => { const it = stock.find((i) => i.id === el.dataset.id); if (it && this.onBuy && this.onBuy(it)) this.renderMenu(); });

    for (const el of box.querySelectorAll('.item[data-action=sell]')) {
      el.addEventListener('click', () => { const it = pr.items.find((i) => i.id === el.dataset.id); if (it && this.onSell && this.onSell(it)) this.renderMenu(); });
    }

// ===== touch.js =====
const { isTouchDevice, setupTouch } = (() => {
// touch.js — 모바일/아이패드 터치 컨트롤: 가상 조이스틱(왼쪽), 시점 드래그·탭 공격(오른쪽), 액션 버튼
const isTouchDevice = () =>
  ('ontouchstart' in window) || (navigator.maxTouchPoints && navigator.maxTouchPoints > 0);

const STICK_RADIUS = 58;   // 조이스틱 최대 반경(px)
const LOOK_SENS = 2.4;     // 드래그 → 시점 회전 배율
const TAP_TIME = 220;      // 탭 판정 시간(ms)
const TAP_MOVE = 12;       // 탭 판정 이동 허용(px)

function setupTouch(input, { onPause, onMenu, onSound } = {}) {
  const layer = document.createElement('div');
  layer.id = 'touch';
  layer.innerHTML = `
    <div id="stick"><div id="stick-base"></div><div id="stick-knob"></div></div>
    <div id="btns">
      <button class="tb tb-heavy" data-act="heavy">강공</button>
      <button class="tb tb-dash" data-act="dash">대시</button>
      <button class="tb tb-light" data-act="light">베기</button>
      <button class="tb tb-potion" data-act="potion">약<span id="tb-potion-n">0</span></button>
    </div>
    <div id="tech-row">
      <button class="tb tech" data-act="tech1"><small>기술</small><span id="tech1-label">제1형</span></button>
      <button class="tb tech" data-act="tech2"><small>기술</small><span id="tech2-label">제3형</span></button>
      <button class="tb tech tb-special" data-act="special"><small>오의</small><span id="tech3-label">비검</span></button>
    </div>
    <div id="top-btns">
      <button id="tb-menu" aria-label="장비/스킬">장비·스킬</button>
      <button id="tb-sound" aria-label="소리">소리</button>
      <button id="tb-pause" aria-label="일시정지">❚❚</button>
    </div>
    <div id="touch-hint">왼쪽: 이동 · 오른쪽: 드래그 시점 / 탭 공격</div>
  `;
  document.body.appendChild(layer);

  const stick = layer.querySelector('#stick');
  const knob = layer.querySelector('#stick-knob');
  const hint = layer.querySelector('#touch-hint');
  let stickId = null, stickX = 0, stickY = 0;
  let lookId = null, lookX = 0, lookY = 0, lookStart = 0, lookMoved = 0;
  let hintTimer = null;

  const setAxis = (dx, dy) => {
    const len = Math.hypot(dx, dy);
    const k = len > STICK_RADIUS ? STICK_RADIUS / len : 1;
    const nx = (dx * k) / STICK_RADIUS, ny = (dy * k) / STICK_RADIUS;
    knob.style.transform = `translate(${dx * k}px, ${dy * k}px)`;
    const dead = 0.12;
    const mag = Math.hypot(nx, ny);
    if (mag < dead) { input.axisX = 0; input.axisY = 0; return; }
    const scale = Math.min(1, (mag - dead) / (1 - dead)) / mag;
    input.axisX = nx * scale;
    input.axisY = -ny * scale; // 화면 위쪽 = 전진
  };

  const onStart = (e) => {
    for (const t of e.changedTouches) {
      const target = t.target;
      if (target.closest && target.closest('.tb, #top-btns')) continue;
      const leftHalf = t.clientX < window.innerWidth * 0.5;
      if (leftHalf && stickId === null) {
        stickId = t.identifier; stickX = t.clientX; stickY = t.clientY;
        stick.style.left = `${stickX}px`; stick.style.top = `${stickY}px`;
        stick.style.display = 'block';
        setAxis(0, 0);
      } else if (lookId === null) {
        lookId = t.identifier; lookX = t.clientX; lookY = t.clientY;
        lookStart = performance.now(); lookMoved = 0;
      }
    }
    if (e.cancelable) e.preventDefault();
  };
  const onMove = (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) {
        setAxis(t.clientX - stickX, t.clientY - stickY);
      } else if (t.identifier === lookId) {
        const dx = t.clientX - lookX, dy = t.clientY - lookY;
        lookX = t.clientX; lookY = t.clientY;
        lookMoved += Math.hypot(dx, dy);
        input.mouseDX += dx * LOOK_SENS;
        input.mouseDY += dy * LOOK_SENS;
      }
    }
    if (e.cancelable) e.preventDefault();
  };
  const onEnd = (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) {
        stickId = null; input.axisX = 0; input.axisY = 0;
        stick.style.display = 'none';
      } else if (t.identifier === lookId) {
        if (performance.now() - lookStart < TAP_TIME && lookMoved < TAP_MOVE) input.light = true;
        lookId = null;
      }
    }
    if (e.cancelable) e.preventDefault();
  };
  const opts = { passive: false };
  layer.addEventListener('touchstart', onStart, opts);
  layer.addEventListener('touchmove', onMove, opts);
  layer.addEventListener('touchend', onEnd, opts);
  layer.addEventListener('touchcancel', onEnd, opts);

  // 액션 버튼
  for (const b of layer.querySelectorAll('.tb')) {
    const act = b.dataset.act;
    b.addEventListener('touchstart', (e) => { input[act] = true; b.classList.add('on'); if (e.cancelable) e.preventDefault(); e.stopPropagation(); }, opts);
    const off = (e) => { b.classList.remove('on'); if (e.cancelable) e.preventDefault(); e.stopPropagation(); };
    b.addEventListener('touchend', off, opts);
    b.addEventListener('touchcancel', off, opts);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  const bindTop = (id, fn) => {
    const b = layer.querySelector(id);
    b.addEventListener('touchstart', (e) => { if (e.cancelable) e.preventDefault(); e.stopPropagation(); fn && fn(); }, opts);
    b.addEventListener('click', (e) => { e.preventDefault(); fn && fn(); });
  };
  bindTop('#tb-pause', onPause);
  bindTop('#tb-menu', onMenu);
  bindTop('#tb-sound', onSound);

  const api = {
    layer,
    setActive(on) {
      layer.classList.toggle('active', !!on);
      if (!on) { stickId = null; lookId = null; input.axisX = 0; input.axisY = 0; stick.style.display = 'none'; }
      else if (!hintTimer) { hint.classList.add('show'); hintTimer = setTimeout(() => hint.classList.remove('show'), 5000); }
    },
    setSpecialReady(ready) { layer.querySelector('.tb-special').classList.toggle('ready', !!ready); },
    setMoves(moves) {
      const short = (s, d) => (s ? s.split('·').pop().trim() : d);
      layer.querySelector('#tech1-label').textContent = short(moves && moves.l3, '마무리');
      layer.querySelector('#tech2-label').textContent = short(moves && moves.heavy, '강공');
      layer.querySelector('#tech3-label').textContent = short(moves && moves.special, '비검');
    },
    setPotions(n) { layer.querySelector('#tb-potion-n').textContent = n; layer.querySelector('.tb-potion').classList.toggle('empty', n <= 0); },
    setSound(muted) { layer.querySelector('#tb-sound').textContent = muted ? '소리 꺼짐' : '소리 켜짐'; },
  };
  return api;
}

return { isTouchDevice, setupTouch };
})();

        case 'dash': audio.sfx('dash'); break;
        case 'potion': audio.sfx('bell'); ui.logLine(`<b>회복약</b> 사용 — 남은 ${progress.potions}개`, 'potion'); ui.setProgress(progress); break;
        case 'potionFail': ui.logLine(progress.potions <= 0 ? '회복약이 없습니다' : '체력이 이미 가득합니다', 'warn'); break;
        case 'dead': if (playing) { audio.sfx('dead'); setTimeout(() => endGame('defeat'), 1400); state = 'dying'; } break;
        default: break;
      }
    }
    if (player.hitstop > 0) { hitstop = Math.max(hitstop, player.hitstop); player.hitstop = 0; }
    stats.kills = player.kills + allies.reduce((s, a) => s + a.kills, 0);
    stats.maxCombo = Math.max(stats.maxCombo, player.combo);
    if (playing && stage.isDawn) {
      enemies.dissolveAll(effects);
      if (!endKind) { endKind = 'clear'; ui.message('새벽', '밤을 버텨냈다 — 요괴들이 재가 되어 흩어진다', 4); ui.hideBoss(); audio.setMode('dawn'); audio.sfx('bell'); gainXp(XP_REWARD.night, '밤을 버팀'); }
      dawnEndTimer += dt;
      if (dawnEndTimer > 6.5) { stats.time = elapsed; finishChapter(); }
    }
  }

  if (stage) {
    stage.update(dt, playing, player.pos);
    effects.update(dt);
    player.updateCamera(camera, dt, effects.shake);
  }
  input.mouseDX = 0; input.mouseDY = 0;
  input.light = input.heavy = input.special = input.dash = input.potion = input.tech1 = input.tech2 = false;

  if (touch) { touch.setActive(playing); touch.setSpecialReady(player.specialReady); touch.setPotions(progress ? progress.potions : 0); }
  ui.setHP(player.hp, player.maxHp);
  ui.setGauge(player.gauge, player.gaugeMax);
  ui.setCombo(player.combo, player.comboPop);
  ui.setNight(stage.nightProgress, enemies.waveIndex, enemies.totalWaves, stats.kills, stage.isDawn, chapter);
  ui.setDash(player.dashCooldown / Math.max(0.05, player.skill.dashCooldown));
  if (allies.length && Math.floor(elapsed * 4) !== Math.floor((elapsed - dt) * 4)) ui.setAllies(allies);
  if (enemies.boss && enemies.boss.alive) ui.setBossHP(enemies.boss.hp, enemies.boss.maxHp);
  else if (enemies.boss && !enemies.boss.alive) ui.hideBoss();
  ui.update(dt);
  renderer.render(scene, camera);
}

window.addEventListener('resize', () => { camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); renderer.setSize(window.innerWidth, window.innerHeight); });

progress = progressOf(character.id);
buildWorld();
showTitle();
frame();

window.__game = {
  get state() { return state; }, get time() { return stage.time; }, get player() { return player; }, get enemies() { return enemies; }, get allies() { return allies; },
  get stage() { return stage; }, get progress() { return progress; }, get chapter() { return chapter; }, get audio() { return audio; }, input, showSelect, openMenu, closeMenu, storyDone, finishChapter, showStory,
};

})();

</script>
