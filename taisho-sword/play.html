// 눈 깜빡임 (모델 공용)
function animateFace(parts, dt) {
  parts.blinkT -= dt;
  const closed = parts.blinkT < 0 && parts.blinkT > -0.12;
  for (const e of parts.eyes) e.scale.y = closed ? 0.08 : (e.geometry.parameters.radius > 0.09 ? 1.15 : e.geometry.parameters.radius > 0.06 ? 1.3 : 1);
  if (parts.blinkT < -0.12) parts.blinkT = rand(2.2, 5);
  if (parts.ponytail) parts.ponytail.rotation.x = 0.55 + Math.sin(performance.now() * 0.004) * 0.12;
}

class Player {
  constructor(scene, character = CHARACTERS[0], progress = null) {
    this.scene = scene;
    this.ch = character;
    this.progress = progress;
    this.parts = buildModel(character);
    this.group = new THREE.Group();
    this.group.add(this.parts.body);
    scene.add(this.group);

    this.pos = this.group.position;
    this.pos.set(0, 0, 4);
    this.yaw = Math.PI;
    this.camYaw = 0;
    this.camPitch = 0.3;
    this.radius = PLAYER_RADIUS;
    this.height = 1.9;

    this.applySkills();
    this.hp = this.maxHp;
    this.gauge = 0; this.gaugeMax = GAUGE_MAX;
    this.combo = 0; this.comboTimer = 0; this.comboPop = 0;
    this.invuln = 0;
    this.alive = true;

    this.attack = null;
    this.queued = null;
    this.comboResetTimer = 0;
    this.nextLight = 'light1';

    this.dashTime = 0; this.dashCooldown = 0; this.dashDir = new THREE.Vector3();
    this.moving = false; this.walkPhase = 0;
    this.knock = new THREE.Vector3();

    this.waves = [];
    this.events = [];
    this.hitstop = 0;
    this.fwd = new THREE.Vector3(0, 0, 1);
    this._tmp = new THREE.Vector3();
    this.blink = 0;
    this.kills = 0;
    this.lookIdle = 10;     // 마지막 수동 시점 조작 후 경과 시간
    this.camTarget = null;  // 소프트 록온 대상
    this._camPos = new THREE.Vector3();
    this._camLook = new THREE.Vector3();
  }

  // 스킬 트리 효과 적용 (선택 시/학습 시 호출)
  applySkills() {
    const s = this.ch.stats;
    const has = (id) => this.progress && this.progress.has(id);
    const eq = this.progress ? sumEquipment(this.progress.equipped) : {};
    const g = (k) => eq[k] || 0;
    this.skill = {
      dmgMul: s.dmg * (has('atk1') ? 1.15 : 1) * (1 + g('dmg')),
      comboBonus: has('atk2'),
      heavyPlus: has('atk3'),
      regen: (has('def3') ? 0.8 : 0) + g('regen'),
      dashCooldown: s.dashCooldown * (has('def2') ? 0.6 : 1) * Math.max(0.3, 1 - g('dash')),
      dashInvulnBonus: has('def2') ? 0.3 : 0,
      gaugeMul: s.gauge * (has('tec1') ? 1.5 : 1) * (1 + g('gauge')),
      specialMul: (has('tec2') ? 1.5 : 1) * (1 + g('special')),
      extraWave: has('tec2') ? 1 : 0,
      specialHeal: has('tec3') ? 25 : 0,
      reduce: Math.min(0.6, g('reduce')),
    };
    const prevMax = this.maxHp || 0;
    this.maxHp = Math.round(s.hp + (has('def1') ? 30 : 0) + g('hp'));
    if (prevMax && this.maxHp > prevMax) this.hp = Math.min(this.maxHp, (this.hp || 0) + (this.maxHp - prevMax));
    if (this.hp > this.maxHp) this.hp = this.maxHp;
    this.moveSpeed = s.speed * (1 + g('speed'));
  }

  get forward() { return this.fwd.set(Math.sin(this.yaw), 0, Math.cos(this.yaw)); }
  get center() { return this._tmp.set(this.pos.x, this.pos.y + 1.1, this.pos.z); }
  get busy() { return !!this.attack; }
  get specialReady() { return this.gauge >= this.gaugeMax; }

  // ---------- 입력/이동 ----------
  update(dt, input, ctx) {
    this.events.length = 0;
    if (!this.alive) { this._animateDead(dt); return; }

    // 카메라 회전 (수동)
    if (input.mouseDX !== 0 || input.mouseDY !== 0) this.lookIdle = 0; else this.lookIdle += dt;
    this.camYaw -= input.mouseDX * 0.0022;
    this.camPitch = clamp(this.camPitch + input.mouseDY * 0.0018, -0.35, 1.05);

    // 카메라 기준 이동 방향
    const cfx = -Math.sin(this.camYaw), cfz = -Math.cos(this.camYaw);
    const crx = -cfz, crz = cfx;
    let mx = 0, mz = 0;
    if (input.keys.KeyW) { mx += cfx; mz += cfz; }
    if (input.keys.KeyS) { mx -= cfx; mz -= cfz; }
    if (input.keys.KeyD) { mx += crx; mz += crz; }
    if (input.keys.KeyA) { mx -= crx; mz -= crz; }
    if (input.axisX || input.axisY) {
      mx += cfx * input.axisY + crx * input.axisX;
      mz += cfz * input.axisY + crz * input.axisX;
    }
    let ml = Math.hypot(mx, mz);
    if (ml > 1) { mx /= ml; mz /= ml; ml = 1; }
    this.moving = ml > 0.001;

    // 타이머
    this.invuln = Math.max(0, this.invuln - dt);
    this.dashCooldown = Math.max(0, this.dashCooldown - dt);
    this.blink = Math.max(0, this.blink - dt);
    if (this.comboTimer > 0) { this.comboTimer -= dt; if (this.comboTimer <= 0) this.combo = 0; }
    this.comboPop = Math.max(0, this.comboPop - dt * 4);
    if (this.comboResetTimer > 0 && !this.attack) {
      this.comboResetTimer -= dt;
      if (this.comboResetTimer <= 0) this.nextLight = 'light1';
    }
    if (this.skill.regen > 0 && this.hp < this.maxHp) this.hp = Math.min(this.maxHp, this.hp + this.skill.regen * dt);

    // 대시
    if (input.dash && this.dashCooldown <= 0 && this.dashTime <= 0 && !(this.attack && this.attack.def.special)) {
      this.dashTime = DASH_TIME;
      this.dashCooldown = this.skill.dashCooldown;
      if (ml > 0) this.dashDir.set(mx, 0, mz).normalize(); else this.dashDir.copy(this.forward);
      this.yaw = Math.atan2(this.dashDir.x, this.dashDir.z);
      this.attack = null; this.queued = null;
      this.invuln = Math.max(this.invuln, DASH_TIME + 0.05 + this.skill.dashInvulnBonus);
      ctx.effects.burst(this.center, { count: 14, colors: [this.ch.colors.glow, 0xe0f0ff], speed: 2, life: 0.4, size: 0.5, gravity: 0, drag: 2 });
      this.events.push({ type: 'dash' });
    }
    input.dash = false;

    // 공격 입력
    if (input.light) {
      if (!this.attack) this._startAttack(this.nextLight, ctx);
      else if (this.attack.def.next && this.attack.t >= this.attack.def.active[0]) this.queued = this.attack.def.next;
    }
    // 기술 버튼: 마무리 형(연타 3타)을 바로 사용
    if (input.tech1) { if (!this.attack) this._startAttack('light3', ctx); else if (this.attack.name !== 'light3' && !this.attack.def.special && this.attack.t >= this.attack.def.active[0]) this.queued = 'light3'; }
    if (input.tech2) input.heavy = true;
    if (input.heavy) {
      if (!this.attack) this._startAttack('heavy', ctx);
      else if (!this.attack.def.heavy && !this.attack.def.special && this.attack.t >= this.attack.def.active[0]) this.queued = 'heavy';
    }
    if (input.special && this.specialReady && !(this.attack && this.attack.def.special)) {
      this.gauge = 0;
      this._startAttack('special', ctx);
      this.invuln = Math.max(this.invuln, ATTACKS.special.dur);
      if (this.skill.specialHeal) {
        this.hp = Math.min(this.maxHp, this.hp + this.skill.specialHeal);
        for (const e of ctx.enemies) if (e.targetable && Math.hypot(e.pos.x - this.pos.x, e.pos.z - this.pos.z) < 8) e.stagger = Math.max(e.stagger, 1.2);
      }
      this.events.push({ type: 'special' });
    }
    // 회복약
    if (input.potion) {
      if (this.progress && this.hp < this.maxHp && this.progress.usePotion()) {
        this.heal(POTION_HEAL);
        ctx.effects.burst(this.center, { count: 24, colors: [0xff6080, 0xffb0c0, 0xffffff], speed: 2, life: 0.8, size: 0.4, gravity: 2, drag: 1, up: 2 });
        this.events.push({ type: 'potion' });
      } else this.events.push({ type: 'potionFail' });
    }
    input.light = input.heavy = input.special = input.potion = input.tech1 = input.tech2 = false;

    // 이동
    const move = new THREE.Vector3();
    if (this.dashTime > 0) {
      this.dashTime -= dt;
      move.copy(this.dashDir).multiplyScalar(DASH_SPEED * dt);
      ctx.effects.emit({ pos: this.center, vel: new THREE.Vector3(rand(-1, 1), rand(0, 1), rand(-1, 1)), life: 0.3, size: 0.6, color: this.ch.colors.glow, drag: 2 });
    } else if (this.attack) {
      const a = this.attack; const d = a.def; const w = d.active[0];
      if (a.t < w && ml > 0) this.yaw = angleLerp(this.yaw, Math.atan2(mx, mz), 1 - Math.exp(-14 * dt));
      if (a.t >= w * 0.6 && a.t < d.active[1] && d.lunge) move.copy(this.forward).multiplyScalar(d.lunge * dt);
    } else if (ml > 0) {
      move.set(mx, 0, mz).multiplyScalar(this.moveSpeed * dt);
      this.yaw = angleLerp(this.yaw, Math.atan2(mx, mz), 1 - Math.exp(-12 * dt));
    }
    move.addScaledVector(this.knock, dt);
    this.knock.multiplyScalar(Math.max(0, 1 - 7 * dt));
    this.pos.add(move);
    ctx.stage.resolveCollisions(this.pos, this.radius);
    this.pos.y = 0;

    if (this.attack) this._updateAttack(dt, ctx);
    this._updateWaves(dt, ctx);
    this._updateCamTarget(ctx);
    this._animate(dt);
    this.group.rotation.y = this.yaw;
  }

  // 소프트 록온 대상: 가까운 적 (10m 이내)
  _updateCamTarget(ctx) {
    let best = null, bestD = 10;
    for (const e of ctx.enemies) {
      if (!e.targetable) continue;
      const d = Math.hypot(e.pos.x - this.pos.x, e.pos.z - this.pos.z) - (e.isBoss ? 2 : 0);
      if (d < bestD) { bestD = d; best = e; }
    }
    this.camTarget = best;
  }

  // ---------- 공격 ----------
  _attackDamage(d) {
    let dmg = d.dmg * this.skill.dmgMul;
    if (d.special) dmg = this.ch.special.dmg * this.skill.dmgMul * this.skill.specialMul;
    if (this.skill.comboBonus && this.combo >= 8) dmg *= 1.25;
    return dmg;
  }

  _startAttack(name, ctx) {
    const def = ATTACKS[name];
    this.attack = { name, def, t: 0, hitSet: new Set(), fxDone: false, waveDone: false, waveCount: 0 };
    this.queued = null;
    if (name.startsWith('light')) { this.nextLight = def.next || 'light1'; this.comboResetTimer = 0.55; }
    else this.nextLight = 'light1';
    const wasMoving = this.moving;
    if (!this.moving || def.special) this.yaw = this.camYaw + Math.PI;
    // 조준 보정: 이동 중엔 정면 ±65°, 정지 시엔 전방향에서 가장 가까운 적 쪽으로
    if (!def.special && ctx.enemies) {
      let best = null, bestD = def.range + 1.8;
      const limit = wasMoving ? 1.15 : Math.PI;
      for (const e of ctx.enemies) {
        if (!e.targetable) continue;
        const dx = e.pos.x - this.pos.x, dz = e.pos.z - this.pos.z;
        const d = Math.hypot(dx, dz);
        if (d > bestD) continue;
        const ang = Math.atan2(dx, dz);
        if (Math.abs(angleDiff(this.yaw, ang)) > limit) continue;
        best = ang; bestD = d;
      }
      if (best !== null) this.yaw = best;
    }
    this.events.push({ type: 'swing', heavy: !!def.heavy, special: !!def.special });
    // 기술명 연출 (유파 형)
    const mv = this.ch.moves || {};
    if (name === 'light3' && mv.l3) this.events.push({ type: 'move', name: mv.l3, tier: 1 });
    if (name === 'heavy' && mv.heavy) this.events.push({ type: 'move', name: mv.heavy, tier: 2 });
    if (def.special) {
      const sp = this.ch.special;
      this.events.push({ type: 'move', name: mv.special || sp.name, tier: 3 });
      ctx.effects.shockwave(this.pos, { color: sp.c1, radius: 3, life: 0.5, y: 0.1 });
      ctx.effects.burst(this.center, { count: 40, colors: [sp.c1, sp.c2, sp.c3], speed: 3, life: 0.8, size: 0.45, gravity: 1.5, drag: 1, up: 2 });
    }
  }

  _updateAttack(dt, ctx) {
    const a = this.attack; const d = a.def;
    a.t += dt;
    const [as, ae] = d.active;
    const sp = this.ch.special;
    const heavyPlus = d.heavy && this.skill.heavyPlus;
    const range = d.special ? sp.range : d.range * (heavyPlus ? 1.4 : 1);

    if (!a.fxDone && a.t >= as) {
      a.fxDone = true;
      const fx = d.fx;
      const rOut = d.special ? sp.range - 0.2 : (fx.rOut || d.range) * (heavyPlus ? 1.4 : 1);
      // 겹 궤적: 테마 색 + 흰색 잔상
      ctx.effects.slashArc(this.pos, this.yaw, { rIn: 0.5, rOut, angle: Math.min(d.arc, Math.PI * 1.1), tilt: fx.tilt, roll: fx.roll, color: sp.c1, life: d.special ? 0.45 : 0.26, sweep: fx.sweep, y: fx.y });
      ctx.effects.slashArc(this.pos, this.yaw, { rIn: 0.5, rOut: rOut * 0.85, angle: Math.min(d.arc, Math.PI * 1.1) * 0.8, tilt: fx.tilt, roll: fx.roll, color: 0xffffff, life: d.special ? 0.35 : 0.18, sweep: fx.sweep, y: fx.y + 0.05, opacity: 0.5 });
      if (d.special) ctx.effects.slashArc(this.pos, this.yaw + Math.PI, { rIn: 0.5, rOut: sp.range - 0.2, angle: Math.PI * 1.1, tilt: 0.15, color: sp.c2, life: 0.45, sweep: 1, y: 0.9 });
      // 호흡 연출: 검격마다 테마 파티클
      this._themeBurst(ctx, d.special ? 3 : d.heavy || a.name === 'light3' ? 2 : 1, fx.sweep, rOut);
    }
    if (a.t >= as && a.t <= ae) {
      this._hitCheck(a, ctx, range, heavyPlus);
      if (d.special) this._specialParticles(ctx, a.t);
    }
    // 비검: 검기 파동 발사 (스킬로 추가 발사)
    if (d.special) {
      const total = sp.waves + this.skill.extraWave;
      if (a.waveCount < total && a.t >= 0.72 + a.waveCount * 0.22) {
        const spread = total > 1 ? (a.waveCount - (total - 1) / 2) * 0.35 : 0;
        this._launchWave(ctx, spread);
        a.waveCount++;
        this.events.push({ type: 'wave' });
      }
    }
    if (this.queued && a.t >= ae + (d.dur - ae) * 0.45) { this._startAttack(this.queued, ctx); return; }
    if (a.t >= d.dur) {
      this.attack = null;
      this.comboResetTimer = 0.55;
      if (d.special) this.parts.body.rotation.y = 0;
    }
  }

  // 검격 테마 연출 (물결/번개/지진/불꽃/바람) — 강도 1~3
  _themeBurst(ctx, strength, sweep = 1, radius = 2.5) {
    const sp = this.ch.special; const th = sp.theme;
    const c = this.center; const f = this.forward;
    const n = 10 * strength;
    const fx = f.x, fz = f.z;
    for (let i = 0; i < n; i++) {
      const ang = (i / n - 0.5) * 2.2 * (strength >= 3 ? 2.8 : 1);
      const ca = Math.cos(ang), sa = Math.sin(ang);
      const dx = fx * ca - fz * sa, dz = fx * sa + fz * ca;
      const r = rand(0.6, radius);
      const p = new THREE.Vector3(c.x + dx * r, rand(0.4, 1.6), c.z + dz * r);
      let v, color = i % 3 === 0 ? sp.c3 : i % 3 === 1 ? sp.c2 : sp.c1, life = 0.6, size = 0.4, gravity = 0, drag = 1.5;
      if (th === 'wave') { v = new THREE.Vector3(dx * 2, rand(2, 4), dz * 2); gravity = -7; drag = 0.5; size = 0.3; life = 0.7; }
      else if (th === 'lightning') { v = new THREE.Vector3(rand(-7, 7), rand(-2, 8), rand(-7, 7)); life = 0.22; size = 0.28; color = i % 2 ? 0xffffff : sp.c1; }
      else if (th === 'quake') { p.y = 0.2; v = new THREE.Vector3(dx * 1.5, rand(3, 7), dz * 1.5); gravity = -10; size = 0.45; color = i % 2 ? sp.c2 : 0x8a6a40; }
      else if (th === 'flame') { v = new THREE.Vector3(dx * 1.2 + rand(-0.5, 0.5), rand(2.5, 5.5), dz * 1.2 + rand(-0.5, 0.5)); gravity = 2.5; life = 0.8; size = 0.5; }
      else { v = new THREE.Vector3(-dz * 3 * sweep + dx, rand(1, 3), dx * 3 * sweep + dz); drag = 0.8; life = 0.8; size = 0.35; }
      ctx.effects.emit({ pos: p, vel: v, life, size, color, gravity, drag });
    }
    if (strength >= 2) {
      if (th === 'wave') ctx.effects.shockwave(this.pos, { color: sp.c1, radius: radius * 0.9, life: 0.45, y: 0.12, opacity: 0.6 });
      if (th === 'quake') ctx.effects.shockwave(this.pos, { color: sp.c2, radius: radius, life: 0.5, y: 0.08, opacity: 0.7, width: 0.35 });
      if (th === 'lightning') ctx.effects.burst(c, { count: 5, colors: [0xffffff], speed: 0.5, life: 0.12, size: 2.2, gravity: 0, drag: 0 });
      if (th === 'flame') ctx.effects.burst(c, { count: 14, colors: [sp.c1, sp.c2], speed: 2.5, life: 0.9, size: 0.7, gravity: 3, drag: 1, up: 3 });
      if (th === 'wind') ctx.effects.shockwave(this.pos, { color: sp.c1, radius: radius * 1.1, life: 0.5, y: 0.6, opacity: 0.4, width: 0.12 });
    }
  }

  // 캐릭터별 비검 파티클 테마
  _specialParticles(ctx, t) {
    const c = this.center;
    const sp = this.ch.special;
    const theme = sp.theme;
    for (let i = 0; i < 6; i++) {
      const a = rand(0, Math.PI * 2);
      const r = rand(0.6, sp.range - 0.8);
      const p = new THREE.Vector3(c.x + Math.cos(a) * r, 0.2 + rand(0, 0.6), c.z + Math.sin(a) * r);
      let v;
      if (theme === 'lightning') v = new THREE.Vector3(rand(-6, 6), rand(2, 9), rand(-6, 6));
      else if (theme === 'wind') v = new THREE.Vector3(-Math.sin(a), 1.2, Math.cos(a)).multiplyScalar(rand(3, 7));
      else if (theme === 'quake') v = new THREE.Vector3(Math.cos(a) * 0.5, rand(4, 8), Math.sin(a) * 0.5);
      else v = new THREE.Vector3(Math.cos(a), 0.3, Math.sin(a)).multiplyScalar(rand(2, 5));
      ctx.effects.emit({ pos: p, vel: v, life: theme === 'lightning' ? 0.25 : 0.7, size: theme === 'lightning' ? 0.3 : 0.45, color: i % 3 === 0 ? sp.c3 : sp.c1, drag: 1.5, gravity: theme === 'quake' ? -9 : 0 });
    }
    for (let i = 0; i < 5; i++) {
      const a = rand(0, Math.PI * 2);
      const r = rand(0.3, 2.5);
      const p = new THREE.Vector3(c.x + Math.cos(a) * r, rand(0, 1.2), c.z + Math.sin(a) * r);
      const v = theme === 'wind' ? new THREE.Vector3(-Math.sin(a) * 4, rand(2, 5), Math.cos(a) * 4) : new THREE.Vector3(rand(-0.6, 0.6), rand(2.5, 5), rand(-0.6, 0.6));
      ctx.effects.emit({ pos: p, vel: v, life: 0.9, size: 0.55, color: [sp.c2, sp.c3, sp.c1][i % 3], gravity: theme === 'flame' ? 2.5 : 1.5, drag: 1.2 });
    }
    if (theme === 'quake' && Math.random() < 0.15) ctx.effects.shockwave(this.pos, { color: sp.c1, radius: rand(3, 5.5), life: 0.5, y: 0.1, opacity: 0.5 });
    if (theme === 'lightning' && Math.random() < 0.2) ctx.effects.burst(c, { count: 6, colors: [0xffffff], speed: 1, life: 0.1, size: 1.6, gravity: 0, drag: 0 });
  }

  _launchWave(ctx, spread = 0) {
    const sp = this.ch.special;
    const geo = ctx.effects._arcGeo(0.9, 1.9, 2.3);
    const m = new THREE.MeshBasicMaterial({ color: sp.c1, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true });
    const mesh = new THREE.Mesh(geo, m);
    mesh.rotation.order = 'YXZ';
    mesh.rotation.y = this.yaw + spread;
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set(this.pos.x, 1.2, this.pos.z);
    this.scene.add(mesh);
    const dir = new THREE.Vector3(Math.sin(this.yaw + spread), 0, Math.cos(this.yaw + spread));
    this.waves.push({ mesh, mat: m, dir, life: 1.4, maxLife: 1.4, hitSet: new Set(), speed: sp.waveSpeed || 15 });
  }

  _updateWaves(dt, ctx) {
    const sp = this.ch.special;
    for (let i = this.waves.length - 1; i >= 0; i--) {
      const w = this.waves[i];
      w.life -= dt;
      w.mesh.position.addScaledVector(w.dir, w.speed * dt);
      const s = 1 + (1 - w.life / w.maxLife) * 1.2;
      w.mesh.scale.set(s, s, s);
      w.mat.opacity = 0.9 * Math.min(1, w.life / 0.4);
      for (let k = 0; k < 3; k++) {
        const side = rand(-1.6, 1.6) * s;
        const p = new THREE.Vector3(w.mesh.position.x - w.dir.z * side, rand(0.3, 2.0), w.mesh.position.z + w.dir.x * side);
        ctx.effects.emit({ pos: p, vel: new THREE.Vector3(rand(-1, 1), rand(1, 3), rand(-1, 1)), life: 0.6, size: 0.5, color: k === 0 ? sp.c2 : sp.c1, drag: 1 });
      }
      for (const e of ctx.enemies) {
        if (!e.targetable || w.hitSet.has(e)) continue;
        const dx = e.pos.x - w.mesh.position.x, dz = e.pos.z - w.mesh.position.z;
        const along = dx * w.dir.x + dz * w.dir.z;
        const lateral = Math.abs(-dx * w.dir.z + dz * w.dir.x);
        if (Math.abs(along) < 1.2 + e.radius && lateral < 1.9 * s + e.radius) {
          w.hitSet.add(e);
          const dir = new THREE.Vector3(dx, 0, dz).normalize();
          this._applyHit(e, { dmg: 45 * this.skill.dmgMul * this.skill.specialMul, knock: 10, stagger: 0.8, gauge: 0, hitstop: 0.06, shake: 0.3, special: true }, dir, ctx);
        }
      }
      for (const p of ctx.projectiles) {
        if (p.alive && p.pos.distanceTo(w.mesh.position) < 2.2 * s) p.destroy(ctx.effects);
      }
      if (w.life <= 0 || Math.hypot(w.mesh.position.x, w.mesh.position.z) > 40) {
        this.scene.remove(w.mesh); w.mat.dispose(); this.waves.splice(i, 1);
      }
    }
  }

  _hitCheck(a, ctx, range, heavyPlus) {
    const d = a.def;
    const f = this.forward;
    const dmg = this._attackDamage(d);
    const knock = d.knock * (heavyPlus ? 1.5 : 1);
    const stagger = heavyPlus ? 1.2 : d.stagger;
    for (const e of ctx.enemies) {
      if (!e.targetable || a.hitSet.has(e)) continue;
      const dx = e.pos.x - this.pos.x, dz = e.pos.z - this.pos.z;
      const dist = Math.hypot(dx, dz);
      if (dist > range + e.radius) continue;
      const cosA = clamp((dx * f.x + dz * f.z) / Math.max(dist, 1e-4), -1, 1);
      if (Math.acos(cosA) > d.arc / 2 && dist > e.radius + 0.5) continue;
      a.hitSet.add(e);
      const dir = new THREE.Vector3(dx, 0, dz).normalize();
      this._applyHit(e, { dmg, knock, stagger, gauge: d.gauge, hitstop: d.hitstop, shake: d.shake, heavy: d.heavy, special: d.special }, dir, ctx);
    }
    for (const p of ctx.projectiles) {
      if (!p.alive || a.hitSet.has(p)) continue;
      const dx = p.pos.x - this.pos.x, dz = p.pos.z - this.pos.z;
      const dist = Math.hypot(dx, dz);
      if (dist > range + 0.5) continue;
      const cosA = clamp((dx * f.x + dz * f.z) / Math.max(dist, 1e-4), -1, 1);
      if (Math.acos(cosA) > d.arc / 2 + 0.3) continue;
      a.hitSet.add(p);
      p.destroy(ctx.effects);
      this.gauge = Math.min(this.gaugeMax, this.gauge + 3 * this.skill.gaugeMul);
      this.events.push({ type: 'parry' });
    }
  }

  _applyHit(e, d, dir, ctx) {
    const killed = e.takeHit(d.dmg, dir, d.knock, d.stagger, ctx.effects);
    const hitPos = new THREE.Vector3(e.pos.x - dir.x * e.radius * 0.5, e.pos.y + e.height * 0.55, e.pos.z - dir.z * e.radius * 0.5);
    const sp = this.ch.special;
    ctx.effects.sparks(hitPos, dir, [sp.c1, sp.c2, 0xffffff]);
    ctx.effects.burst(hitPos, { count: 6, colors: [sp.c1, sp.c3], speed: 3, life: 0.4, size: 0.35, gravity: sp.theme === 'flame' ? 2 : -3, drag: 1.5 });
    this.gauge = Math.min(this.gaugeMax, this.gauge + (d.gauge || 0) * this.skill.gaugeMul);
    this.combo += 1;
    this.comboTimer = COMBO_WINDOW;
    this.comboPop = 1;
    this.hitstop = Math.max(this.hitstop, d.hitstop || 0.04);
    ctx.effects.addShake(d.shake || 0.1);
    this.events.push({ type: 'hit', enemy: e, dmg: d.dmg, killed, heavy: !!d.heavy });
    if (killed) { this.kills++; this.gauge = Math.min(this.gaugeMax, this.gauge + 6 * this.skill.gaugeMul); }
  }

  heal(v) { if (this.alive) this.hp = Math.min(this.maxHp, this.hp + v); }

  // ---------- 피격 ----------
  takeDamage(dmg, fromPos, effects) {

    this.hp = Math.max(0, this.hp - dmg);

    this.blink = 1.0;
    this.combo = 0; this.comboTimer = 0;

    this.knock.copy(dir).multiplyScalar(6);
    effects.burst(this.center, { count: 16, colors: [0xff3040, 0xff8080, 0xffffff], speed: 4, life: 0.5, size: 0.3, gravity: -5, drag: 2 });
    effects.addShake(0.5);

    if (this.attack && !this.attack.def.special) { this.attack = null; this.queued = null; }
    if (this.hp <= 0) { this.alive = false; this.deadT = 0; this.events.push({ type: 'dead' }); }

  }

  // ---------- 애니메이션 ----------
  _animate(dt) {
    const P = this.parts; const body = P.body; const ra = P.rightArm; const la = P.leftArm;
    const blinkOn = this.blink > 0 && Math.floor(this.blink * 20) % 2 === 0;
    body.visible = !blinkOn;
    const glow = this.specialReady ? 0.6 + 0.4 * Math.sin(performance.now() * 0.008) : 0.15;
    P.bladeMat.emissiveIntensity = damp(P.bladeMat.emissiveIntensity, glow, 8, dt);

    let tx = 0.15, ty = 0, tz = -0.25;
    let lz = 0.2, lx = 0;
    let bodyTilt = 0, bodyYawOff = 0, bob = 0;

    if (this.attack) {
      const a = this.attack; const d = a.def; const [as, ae] = d.active;
      let pose;

        const k = easeOutCubic(a.t / as);
        pose = { x: lerp(-0.6, d.windup.x, k), y: lerp(0, d.windup.y, k), z: lerp(-0.2, d.windup.z, k) };
        bodyYawOff = -0.35 * k * (d.fx.sweep || 0);
      } else if (a.t < ae) {
        const k = easeOutCubic((a.t - as) / (ae - as));
        pose = { x: lerp(d.windup.x, d.end.x, k), y: lerp(d.windup.y, d.end.y, k), z: lerp(d.windup.z, d.end.z, k) };
        bodyYawOff = lerp(-0.35, 0.3, k) * (d.fx.sweep || 0);
        bodyTilt = 0.12 * k;
      } else {
        const k = easeInCubic(clamp((a.t - ae) / (d.dur - ae), 0, 1));

      if (d.special) {

        bob = Math.abs(Math.sin(this.walkPhase)) * 0.06;
        bodyTilt = 0.08;
      } else {
        const t = performance.now() * 0.0015;
        tx = 0.15 + Math.sin(t) * 0.04;
        bob = Math.sin(t * 1.3) * 0.015;
      }
      ra.rotation.set(damp(ra.rotation.x, tx, 12, dt), damp(ra.rotation.y, ty, 12, dt), damp(ra.rotation.z, tz, 12, dt));
    }
    la.rotation.x = damp(la.rotation.x, lx, 12, dt);
    la.rotation.z = damp(la.rotation.z, lz, 12, dt);
    body.rotation.x = damp(body.rotation.x, bodyTilt, 12, dt);
    body.rotation.y = this.attack && this.attack.def.special ? bodyYawOff : damp(body.rotation.y, bodyYawOff, 20, dt);

    for (let i = 0; i < P.feet.length; i++) {

    }
    P.scarfTail.rotation.x = 0.35 + Math.sin(performance.now() * 0.004) * 0.15 + (this.moving ? 0.5 : 0);

  }

  _animateDead(dt) {
    this.deadT += dt;

  // ---------- 카메라: 팔로우 + 소프트 록온 + 지연/선행 ----------
  updateCamera(camera, dt, shake) {
    const auto = this.lookIdle > 0.7 && this.alive;
    if (auto) {
      // 1) 이동 방향으로 서서히 돌아감 (카메라 쪽으로 걸어올 때는 제외)
      if (this.moving && this.dashTime <= 0) {
        const behind = this.yaw + Math.PI;
        const diff = angleDiff(this.camYaw, behind);
        // 앞쪽(±70°)으로 걸을 때만 따라 돔. 옆걸음·뒷걸음은 유지 → 끝없이 도는 현상 방지
        if (Math.abs(diff) < 1.22) this.camYaw = angleLerp(this.camYaw, behind, 1 - Math.exp(-1.1 * dt));
      }
      // 2) 가까운 적을 화면에 담도록 살짝 회전 (소프트 록온)
      if (this.camTarget) {
        const e = this.camTarget;
        const toEnemy = Math.atan2(e.pos.x - this.pos.x, e.pos.z - this.pos.z);
        const want = toEnemy + Math.PI;
        const diff = angleDiff(this.camYaw, want);
        if (Math.abs(diff) < 2.6) this.camYaw = angleLerp(this.camYaw, want, 1 - Math.exp(-0.9 * dt));
      }
      // 3) 피치는 기본값으로 천천히 복귀
      this.camPitch = damp(this.camPitch, 0.3, 0.6, dt);
    }

    const dist = 5.8 + (this.dashTime > 0 ? 0.6 : 0);
    const cp = this.camPitch;
    // 시선 목표: 플레이어 + 이동 방향 선행 + 록온 대상 쪽 약간
    const look = this._camLook;
    look.set(this.pos.x, this.pos.y + 1.5, this.pos.z);
    if (this.moving) look.addScaledVector(this.forward, 0.8);
    if (this.camTarget) {
      const e = this.camTarget;
      look.x += (e.pos.x - this.pos.x) * 0.18; look.z += (e.pos.z - this.pos.z) * 0.18;
    }
    if (!this._lookSmooth) this._lookSmooth = look.clone();
    this._lookSmooth.x = damp(this._lookSmooth.x, look.x, 6, dt);
    this._lookSmooth.y = damp(this._lookSmooth.y, look.y, 6, dt);
    this._lookSmooth.z = damp(this._lookSmooth.z, look.z, 6, dt);

    const desired = this._camPos.set(
      this.pos.x + Math.sin(this.camYaw) * Math.cos(cp) * dist,
      this.pos.y + 1.5 + Math.sin(cp) * dist + 0.4,
      this.pos.z + Math.cos(this.camYaw) * Math.cos(cp) * dist,
    );
    desired.y = Math.max(desired.y, 0.6);
    if (!this._camInit) { camera.position.copy(desired); this._camInit = true; }
    const lam = this.lookIdle < 0.7 ? 22 : 9; // 수동 조작 중엔 즉각, 자동일 땐 부드럽게
    camera.position.x = damp(camera.position.x, desired.x, lam, dt);
    camera.position.y = damp(camera.position.y, desired.y, lam, dt);
    camera.position.z = damp(camera.position.z, desired.z, lam, dt);
    if (shake > 0) {
      const s = shake * shake * 0.35;
      camera.position.x += rand(-s, s); camera.position.y += rand(-s, s); camera.position.z += rand(-s, s);

// ===== ally.js =====
const { Ally } = (() => {
// ally.js — 동료 검사 AI: 플레이어를 따라다니며 근처 요괴를 베고, 쓰러지면 잠시 후 일어난다



class Ally {
  constructor(scene, character, index = 0) {
    this.scene = scene;
    this.ch = character;
    this.index = index;
    this.parts = buildModel(character);
    this.group = new THREE.Group();
    this.group.add(this.parts.body);
    scene.add(this.group);
    this.pos = this.group.position;
    this.pos.set(-1.5 + index * 3, 0, 5.5);
    this.yaw = Math.PI;
    this.radius = 0.42; this.height = 1.9;
    this.maxHp = Math.round(character.stats.hp * 0.9);
    this.hp = this.maxHp;
    this.alive = true;
    this.downT = 0;
    this.invuln = 0; this.blink = 0;
    this.attackT = 0; this.attackCd = rand(0.3, 0.9);
    this.walkPhase = 0; this.moving = false;
    this.knock = new THREE.Vector3();
    this.target = null;
    this.speed = character.stats.speed * 0.95;
    this.dmg = 14 * character.stats.dmg;
    this.kills = 0;
    this.isAlly = true;
  }

  get center() { return new THREE.Vector3(this.pos.x, this.pos.y + 1.1, this.pos.z); }
  get forward() { return new THREE.Vector3(Math.sin(this.yaw), 0, Math.cos(this.yaw)); }

  takeDamage(dmg, fromPos, effects) {
    if (!this.alive || this.invuln > 0) return false;
    this.hp = Math.max(0, this.hp - Math.round(dmg * 0.8));
    this.invuln = 1.0; this.blink = 1.0;
    const dir = new THREE.Vector3(this.pos.x - fromPos.x, 0, this.pos.z - fromPos.z).normalize();
    this.knock.copy(dir).multiplyScalar(5);
    effects.burst(this.center, { count: 12, colors: [0xff3040, 0xff8080], speed: 3, life: 0.4, size: 0.3, gravity: -5, drag: 2 });
    if (this.hp <= 0) { this.alive = false; this.downT = 12; this.attackT = 0; }
    return true;
  }

  update(dt, ctx) {
    const player = ctx.player;
    this.invuln = Math.max(0, this.invuln - dt);
    this.blink = Math.max(0, this.blink - dt);
    this.attackCd = Math.max(0, this.attackCd - dt);
    this.pos.addScaledVector(this.knock, dt);
    this.knock.multiplyScalar(Math.max(0, 1 - 7 * dt));

    if (!this.alive) {
      // 쓰러짐 → 일정 시간 후 기상
      this.downT -= dt;
      const P = this.parts.body;
      P.rotation.x = damp(P.rotation.x, -Math.PI / 2 + 0.2, 6, dt);
      P.position.y = damp(P.position.y, 0.25, 6, dt);
      P.visible = true;
      if (this.downT <= 0) {
        this.alive = true; this.hp = Math.round(this.maxHp * 0.5); this.invuln = 2;
        ctx.effects.burst(this.center, { count: 30, colors: [this.ch.colors.glow, 0xffffff], speed: 3, life: 0.8, size: 0.4, gravity: 1, drag: 1, up: 2 });
        ctx.sfx && ctx.sfx('bell');
      }
      return;
    }
    this.parts.body.rotation.x = damp(this.parts.body.rotation.x, 0, 8, dt);
    this.parts.body.position.y = damp(this.parts.body.position.y, 0, 8, dt);

    // 표적: 플레이어 주변 9m 안의 가장 가까운 적
    let best = null, bestD = 9;
    for (const e of ctx.enemies) {
      if (!e.targetable) continue;
      const dp = Math.hypot(e.pos.x - player.pos.x, e.pos.z - player.pos.z);
      const d = Math.hypot(e.pos.x - this.pos.x, e.pos.z - this.pos.z);
      if (dp > 12) continue;
      if (d < bestD) { bestD = d; best = e; }
    }
    this.target = best;

    const move = new THREE.Vector3();
    this.moving = false;
    if (this.attackT > 0) {
      // 공격 중
      const prev = this.attackT;
      this.attackT -= dt;
      if (prev > 0.18 && this.attackT <= 0.18 && this.target && this.target.targetable) {
        const e = this.target;
        const dx = e.pos.x - this.pos.x, dz = e.pos.z - this.pos.z;
        const d = Math.hypot(dx, dz);
        if (d < 2.6 + e.radius) {
          const dir = new THREE.Vector3(dx, 0, dz).normalize();
          const killed = e.takeHit(this.dmg, dir, 3, 0.25, ctx.effects);
          ctx.effects.sparks(new THREE.Vector3(e.pos.x, e.pos.y + e.height * 0.55, e.pos.z), dir, [this.ch.colors.glow, 0xffffff]);
          ctx.sfx && ctx.sfx(killed ? 'kill' : 'hit');
          if (killed) this.kills++;
        }
      }
      if (this.attackT <= 0) this.attackCd = rand(0.55, 1.0);
    } else if (this.target) {
      const e = this.target;
      const dx = e.pos.x - this.pos.x, dz = e.pos.z - this.pos.z;
      const d = Math.hypot(dx, dz);
      const ang = Math.atan2(dx, dz);
      this.yaw = angleLerp(this.yaw, ang, 1 - Math.exp(-10 * dt));
      if (d > 2.0 + e.radius) { move.set(dx / d, 0, dz / d).multiplyScalar(this.speed * dt); this.moving = true; }
      else if (this.attackCd <= 0) {
        this.attackT = 0.38; this.attackSide = (this.attackSide || 1) * -1;
        ctx.effects.slashArc(this.pos, this.yaw, { rIn: 0.5, rOut: 2.4, angle: 2.2, tilt: 0.2 * this.attackSide, roll: 0.2, color: this.ch.colors.glow, life: 0.2, sweep: this.attackSide, y: 1.1 });
        ctx.sfx && ctx.sfx('swing');
      }
    } else {
      // 플레이어 따라가기 (대형 위치)
      const a = this.index === 0 ? 2.3 : -2.3;
      const behind = player.yaw + Math.PI;
      const tx = player.pos.x + Math.sin(behind + a * 0.35) * 2.4, tz = player.pos.z + Math.cos(behind + a * 0.35) * 2.4;
      const dx = tx - this.pos.x, dz = tz - this.pos.z;
      const d = Math.hypot(dx, dz);
      if (d > 1.2) {
        const sp = d > 6 ? this.speed * 1.4 : this.speed;
        move.set(dx / d, 0, dz / d).multiplyScalar(Math.min(sp * dt, d));
        this.yaw = angleLerp(this.yaw, Math.atan2(dx, dz), 1 - Math.exp(-8 * dt));
        this.moving = true;
      } else {
        this.yaw = angleLerp(this.yaw, player.yaw, 1 - Math.exp(-3 * dt));
      }
      // 너무 멀면 순간이동 (안개 속에서 나타남)
      if (d > 18) { this.pos.set(tx, 0, tz); ctx.effects.mist(this.center, [0x8fc0ff, 0xffffff], 12); }
    }
    this.pos.add(move);
    ctx.stage.resolveCollisions(this.pos, this.radius);
    // 플레이어와 겹치지 않게
    const pdx = this.pos.x - player.pos.x, pdz = this.pos.z - player.pos.z, pd = Math.hypot(pdx, pdz);
    if (pd < 0.9 && pd > 1e-3) { this.pos.x += (pdx / pd) * (0.9 - pd); this.pos.z += (pdz / pd) * (0.9 - pd); }
    this.pos.y = 0;
    this.group.rotation.y = this.yaw;
    this._animate(dt);
  }

  _animate(dt) {
    const P = this.parts;
    const blinkOn = this.blink > 0 && Math.floor(this.blink * 20) % 2 === 0;
    P.body.visible = !blinkOn;
    let tx = 0.15, ty = 0, lean = 0, bob = 0, lx = 0;
    if (this.attackT > 0) {
      const k = 1 - clamp(this.attackT / 0.38, 0, 1);

      bob = Math.abs(Math.sin(this.walkPhase)) * 0.06; lean = 0.08;

      const t = performance.now() * 0.0015 + this.index;
      tx = 0.15 + Math.sin(t) * 0.04; bob = Math.sin(t * 1.3) * 0.015;
    }

    P.rightArm.rotation.y = damp(P.rightArm.rotation.y, ty, 22, dt);
    P.leftArm.rotation.x = damp(P.leftArm.rotation.x, lx, 12, dt);
    P.body.rotation.x = damp(P.body.rotation.x, lean, 12, dt);
    P.body.position.y = bob;
    for (let i = 0; i < P.feet.length; i++) {
      const f = P.feet[i]; const left = i < 3; const base = i % 3 === 2 ? 0.1 : 0.06;
      f.position.z = this.moving ? base + (left ? 1 : -1) * Math.sin(this.walkPhase) * 0.2 : damp(f.position.z, base, 10, dt);
    }
    P.scarfTail.rotation.x = 0.35 + Math.sin(performance.now() * 0.004 + this.index) * 0.15 + (this.moving ? 0.5 : 0);

  }

}

const { Projectile, Enemy, MeleeYokai, RangedYokai, BossOni, EnemyManager } = (() => {

function mat(color, extra = {}) {
  return new THREE.MeshLambertMaterial({ color, flatShading: true, transparent: true, ...extra });
}

// ---------- 투사체 (귀화) ----------
class Projectile {
  constructor(scene, pos, dir, { speed = 9, dmg = 10, life = 4.5, color = 0x60c0ff, size = 0.28 } = {}) {
    this.scene = scene;
    this.pos = pos.clone();
    this.vel = dir.clone().normalize().multiplyScalar(speed);
    this.dmg = dmg; this.life = life; this.alive = true; this.radius = size + 0.25;
    this.color = color;
    this.mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(size, 0), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    this.glow = new THREE.Mesh(new THREE.IcosahedronGeometry(size * 1.9, 0), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false }));
    this.mesh.add(this.glow);
    this.mesh.position.copy(this.pos);
    scene.add(this.mesh);
  }
  update(dt, ctx) {
    if (!this.alive) return;
    this.life -= dt;
    this.pos.addScaledVector(this.vel, dt);
    this.mesh.position.copy(this.pos);
    this.mesh.rotation.x += dt * 6; this.mesh.rotation.y += dt * 4;
    ctx.effects.emit({ pos: this.pos, vel: new THREE.Vector3(rand(-0.5, 0.5), rand(0.5, 1.5), rand(-0.5, 0.5)), life: 0.45, size: 0.45, color: this.color, drag: 2 });
    for (const p of [ctx.player, ...(ctx.allies || [])]) {
      if (!p.alive) continue;
      const dx = p.pos.x - this.pos.x, dz = p.pos.z - this.pos.z, dy = (p.pos.y + 1.0) - this.pos.y;
      if (Math.hypot(dx, dz) < this.radius + p.radius && Math.abs(dy) < 1.4) {
        p.takeDamage(this.dmg, this.pos, ctx.effects);
        this.destroy(ctx.effects, true);
        return;
      }
    }
    if (this.pos.y < 0.05 || this.life <= 0 || Math.hypot(this.pos.x, this.pos.z) > ARENA_RADIUS + 6) this.destroy(ctx.effects, this.pos.y < 0.05);
  }
  destroy(effects, impact = false) {
    if (!this.alive) return;
    this.alive = false;
    this.scene.remove(this.mesh);
    this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.glow.material.dispose();
    effects.burst(this.pos, { count: impact ? 18 : 12, colors: [this.color, 0xffffff, 0xa0e0ff], speed: impact ? 4 : 3, life: 0.45, size: 0.35, gravity: -3, drag: 2 });
  }

    this.mats = [];
    this.opacity = 1;
    this.scaleBase = 1;
    this.name = '요괴'; this.kind = 'melee';
    this.dissolving = false;
  }

  _collectMats() {
    this.group.traverse((o) => {
      if (o.isMesh) {
        o.castShadow = true; o.receiveShadow = true;
        const ms = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of ms) this.mats.push({ m, emissive: m.emissive ? m.emissive.getHex() : 0, ei: m.emissiveIntensity || 0 });
      }
    });
  }

  get targetable() { return this.alive && this.state !== 'spawn' && !this.dissolving; }
  get center() { return new THREE.Vector3(this.pos.x, this.pos.y + this.height * 0.55, this.pos.z); }

  setState(s) { this.state = s; this.stateT = 0; }

  takeHit(dmg, dir, knock, stagger, effects) {
    if (!this.targetable) return false;
    this.hp -= dmg;
    this.hitFlash = 1;
    const kMul = this.isBoss ? 0.12 : 1;
    this.knock.addScaledVector(dir, knock * kMul);
    // 보스는 경직에 강한 저항
    this.stagger = Math.max(this.stagger, this.isBoss ? stagger * 0.2 : stagger);
    if (this.hp <= 0) { this.die(effects); return true; }
    if (this.stagger > 0 && !this.isBoss) this.setState('hurt');
    return false;
  }

  die(effects) {
    this.alive = false;
    this.setState('dead');
    effects.burst(this.center, { count: 30, colors: [0x6a2a8a, 0x2a1040, 0xff6a3a, 0xffffff], speed: 4, life: 0.8, size: 0.5, gravity: -2, drag: 1.5 });
    effects.mist(this.center, undefined, 12);
  }

  // 새벽 소멸
  dissolve(effects) {
    if (this.dissolving || this.state === 'dead') return;
    this.dissolving = true;
    this.alive = false;
    this.setState('dissolve');
    effects.ashes(this.center, this.isBoss ? 80 : 30);
  }

  // 표적: 플레이어와 동료 중 가장 가까운 대상 (0.8초마다 갱신)
  _target(ctx) {
    this._retarget = (this._retarget || 0) - (ctx.dt || 0.016);
    if (!this.target || !this.target.alive || this._retarget <= 0) {
      this._retarget = 0.8;
      let best = ctx.player, bestD = Infinity;
      const cands = [ctx.player, ...(ctx.allies || [])];
      for (const c of cands) {
        if (!c.alive) continue;
        const d = Math.hypot(c.pos.x - this.pos.x, c.pos.z - this.pos.z) - (c === ctx.player ? 1.5 : 0); // 플레이어 약간 우선
        if (d < bestD) { bestD = d; best = c; }
      }
      this.target = best;
    }
    return this.target;
  }

  // 표적 방향/거리
  _toPlayer(player) {
    const dx = player.pos.x - this.pos.x, dz = player.pos.z - this.pos.z;
    const d = Math.hypot(dx, dz);
    return { dx, dz, d, ang: Math.atan2(dx, dz) };
  }

  _faceTo(ang, dt, rate = 8) { this.yaw = angleLerp(this.yaw, ang, 1 - Math.exp(-rate * dt)); }

  _moveTowards(dx, dz, d, dt, speed = this.speed) {
    if (d < 1e-3) return;
    this.pos.x += (dx / d) * speed * dt;
    this.pos.z += (dz / d) * speed * dt;
  }

  update(dt, ctx) {
    this.stateT += dt;
    this.hitFlash = Math.max(0, this.hitFlash - dt * 6);
    this.stagger = Math.max(0, this.stagger - dt);
    this.attackCooldown = Math.max(0, this.attackCooldown - dt);

    // 넉백
    this.pos.addScaledVector(this.knock, dt);
    this.knock.multiplyScalar(Math.max(0, 1 - 8 * dt));

    switch (this.state) {
      case 'spawn': {
        const k = clamp(this.stateT / 1.1, 0, 1);
        const s = easeOutCubic(k) * this.scaleBase;
        this.group.scale.set(s, s, s);
        this.pos.y = lerp(-this.height * 0.8, 0, easeOutCubic(k));
        if (Math.random() < 0.5) ctx.effects.mist(new THREE.Vector3(this.pos.x, 0.2, this.pos.z), undefined, 2);
        if (k >= 1) { this.pos.y = 0; this.setState('chase'); }
        break;
      }
      case 'dead': {
        const k = clamp(this.stateT / 0.9, 0, 1);
        this.opacity = 1 - k;
        this.group.rotation.x = -easeOutCubic(k) * 1.2;
        const s = this.scaleBase * (1 - k * 0.3);
        this.group.scale.set(s, s, s);
        if (k >= 1) this.remove();
        break;
      }
      case 'dissolve': {
        const k = clamp(this.stateT / 1.8, 0, 1);
        this.opacity = 1 - k;
        this.pos.y = k * 1.5;
        const s = this.scaleBase * (1 - k * 0.6);
        this.group.scale.set(s, s, s);
        this.group.rotation.y += dt * 2;
        if (Math.random() < 0.6) ctx.effects.emit({ pos: this.center, vel: new THREE.Vector3(rand(-1, 1), rand(1, 2.5), rand(-1, 1)), life: 1.2, size: 0.4, color: pick([0xffd9a0, 0xffffff, 0xb090ff]), drag: 0.5 });
        if (k >= 1) this.remove();
        break;
      }
      case 'hurt': {
        if (this.stagger <= 0) this.setState('chase');
        break;
      }
      default:
        if (this.alive) this.behave(dt, ctx);
    }

    if (this.alive && this.state !== 'spawn') {
      ctx.stage.resolveCollisions(this.pos, this.radius);
      // 적끼리 분리
      for (const o of ctx.enemies) {
        if (o === this || !o.alive) continue;
        const dx = this.pos.x - o.pos.x, dz = this.pos.z - o.pos.z;
        const d = Math.hypot(dx, dz);
        const min = this.radius + o.radius;
        if (d < min && d > 1e-3) {
          const push = (min - d) * 0.5;
          this.pos.x += (dx / d) * push; this.pos.z += (dz / d) * push;
        }
      }
      if (this.state !== 'dissolve') this.pos.y = 0;
    }

    this.group.rotation.y = this.yaw;
    // 피격 플래시 / 투명도
    for (const e of this.mats) {
      if (e.m.emissive) {
        e.m.emissive.setHex(e.emissive).lerp(new THREE.Color(0xffffff), this.hitFlash * 0.9);
        e.m.emissiveIntensity = lerp(e.ei, 1.2, this.hitFlash);
      }
      e.m.opacity = this.opacity * (this.baseOpacity || 1);
    }
    this.animate(dt);
  }

  behave() {}
  animate() {}

  remove() {
    if (this.removed) return;
    this.removed = true;
    this.scene.remove(this.group);
    this.group.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); } });
  }
}

// ---------- 근접형: 小鬼 (소귀) ----------
class MeleeYokai extends Enemy {
  constructor(scene, pos, mul) {
    super(scene, pos, mul);
    this.name = '소귀'; this.kind = 'melee';
    this.hp = this.maxHp = Math.round(40 * this.mul.hp);
    this.speed = 3.6;
    this.radius = 0.5; this.height = 1.7;
    this._build(0xb8322a, 0xffe08a);
    this.scaleBase = 1;
    this.group.scale.set(0.01, 0.01, 0.01);
    this.dmg = Math.round(8 * this.mul.dmg); this.attackRange = 2.0;
  }

  _build(bodyColor, eyeColor) {
    const g = this.group;
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.7, 2, 6), mat(bodyColor));
    body.position.y = 0.95;
    const belly = new THREE.Mesh(new THREE.SphereGeometry(0.36, 7, 5), mat(bodyColor));
    belly.position.set(0, 0.85, 0.15);
    const loin = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.5, 0.3, 7), mat(0xd9a640));
    loin.position.y = 0.55;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 8, 6), mat(bodyColor));
    head.position.y = 1.6;
    const hornGeo = new THREE.ConeGeometry(0.08, 0.32, 5);
    const hornL = new THREE.Mesh(hornGeo, mat(0xf0e6c8)); hornL.position.set(-0.18, 1.92, 0); hornL.rotation.z = 0.3;
    const hornR = new THREE.Mesh(hornGeo, mat(0xf0e6c8)); hornR.position.set(0.18, 1.92, 0); hornR.rotation.z = -0.3;
    const eyeMat = new THREE.MeshLambertMaterial({ color: eyeColor, emissive: eyeColor, emissiveIntensity: 0.9, transparent: true });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.06, 5, 4), eyeMat); eyeL.position.set(-0.13, 1.66, 0.3);
    const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.06, 5, 4), eyeMat); eyeR.position.set(0.13, 1.66, 0.3);
    const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.05, 0.05), mat(0x2a0a0a)); mouth.position.set(0, 1.48, 0.32);
    const legGeo = new THREE.CylinderGeometry(0.12, 0.1, 0.55, 5);
    const legL = new THREE.Mesh(legGeo, mat(bodyColor)); legL.position.set(-0.2, 0.28, 0);
    const legR = new THREE.Mesh(legGeo, mat(bodyColor)); legR.position.set(0.2, 0.28, 0);
    // 왼팔
    const armGeo = new THREE.CylinderGeometry(0.1, 0.09, 0.6, 5); armGeo.translate(0, -0.3, 0);
    const armL = new THREE.Group(); armL.position.set(-0.5, 1.3, 0);
    armL.add(new THREE.Mesh(armGeo, mat(bodyColor)));
    armL.rotation.z = 0.4;
    // 오른팔 + 몽둥이
    const armR = new THREE.Group(); armR.position.set(0.5, 1.3, 0);
    armR.add(new THREE.Mesh(armGeo, mat(bodyColor)));
    const club = new THREE.Group(); club.position.y = -0.6;
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.9, 5), mat(0x4a3320)); handle.rotation.x = Math.PI / 2; handle.position.z = 0.3;
    const headC = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 0.5, 6), mat(0x3a2a20)); headC.rotation.x = Math.PI / 2; headC.position.z = 0.85;
    club.add(handle, headC);
    club.rotation.x = -0.9;
    armR.add(club);
    armR.rotation.order = 'YXZ';
    armR.rotation.z = -0.4;
    this.armR = armR; this.armL = armL; this.legs = [legL, legR]; this.eyeMat = eyeMat;
    g.add(body, belly, loin, head, hornL, hornR, eyeL, eyeR, mouth, legL, legR, armL, armR);
    this._collectMats();
  }

  behave(dt, ctx) {
    const p = this._target(ctx);
    const { dx, dz, d, ang } = this._toPlayer(p);
    if (this.state === 'chase') {
      this._faceTo(ang, dt);
      if (!p.alive) return;
      if (d > this.attackRange) this._moveTowards(dx, dz, d, dt);
      else if (this.attackCooldown <= 0) { this.setState('attack'); this.hit = false; }
      // 살짝 주위를 도는 움직임
      if (d < 4 && this.attackCooldown > 0) {
        const side = (this.id % 2 === 0 ? 1 : -1);
        this.pos.x += (-dz / d) * side * 1.5 * dt; this.pos.z += (dx / d) * side * 1.5 * dt;
      }
    } else if (this.state === 'attack') {
      const t = this.stateT;
      if (t < 0.65) this._faceTo(ang, dt, 5);
      if (t >= 0.65 && !this.hit) {
        this.hit = true;
        ctx.effects.slashArc(this.pos, this.yaw, { rIn: 0.3, rOut: 2.2, angle: 1.6, tilt: -0.6, color: 0xff6a4a, life: 0.2, sweep: 1, y: 1.0, opacity: 0.6 });
        const fx = Math.sin(this.yaw), fz = Math.cos(this.yaw);
        const cosA = (dx * fx + dz * fz) / Math.max(d, 1e-4);
        if (d < this.attackRange + p.radius + 0.3 && cosA > 0.3) p.takeDamage(this.dmg, this.pos, ctx.effects);
      }
      if (t >= 1.05) { this.setState('chase'); this.attackCooldown = rand(1.4, 2.4); }
    }
  }

  animate(dt) {
    const t = this.stateT;
    let ax = 0.2, ay = 0;
    let lean = 0;
    if (this.state === 'attack') {
      if (t < 0.65) { const k = easeOutCubic(t / 0.65); ax = lerp(0.2, -2.6, k); ay = lerp(0, 0.6, k); lean = -0.15 * k; }
      else { const k = clamp((t - 0.65) / 0.25, 0, 1); ax = lerp(-2.6, -0.4, easeOutCubic(k)); ay = lerp(0.6, -0.4, k); lean = lerp(-0.15, 0.25, k); }
      if (t > 0.9) { const k = (t - 0.9) / 0.15; ax = lerp(-0.4, 0.2, k); ay = lerp(-0.4, 0, k); lean = lerp(0.25, 0, k); }
    } else if (this.state === 'chase') {
      const w = performance.now() * 0.012 + this.id;
      this.legs[0].rotation.x = Math.sin(w) * 0.6; this.legs[1].rotation.x = -Math.sin(w) * 0.6;
      this.armL.rotation.x = -Math.sin(w) * 0.5;
      ax = 0.2 + Math.sin(w) * 0.3;
      lean = 0.15;
    } else if (this.state === 'hurt') {
      lean = -0.3;
    }
    this.armR.rotation.x = damp(this.armR.rotation.x, ax, 25, dt);
    this.armR.rotation.y = damp(this.armR.rotation.y, ay, 25, dt);
    this.group.rotation.x = damp(this.group.rotation.x, this.state === 'dead' ? this.group.rotation.x : lean, 12, dt);
    // 공격 준비 시 눈 붉게
    this.eyeMat.emissive.setHex(this.state === 'attack' && t < 0.65 ? 0xff2020 : 0xffe08a);
  }
}

// ---------- 원거리형: 鬼火 (귀화) — 떠다니는 망령 ----------
class RangedYokai extends Enemy {
  constructor(scene, pos, mul) {
    super(scene, pos, mul);
    this.name = '귀화'; this.kind = 'ranged';
    this.hp = this.maxHp = Math.round(26 * this.mul.hp);
    this.speed = 2.8;
    this.radius = 0.5; this.height = 1.9;
    this.baseOpacity = 0.85;
    this._build();
    this.group.scale.set(0.01, 0.01, 0.01);
    this.fireCooldown = rand(1.8, 2.8);
    this.preferMin = 7; this.preferMax = 12;
    this.strafe = Math.random() < 0.5 ? 1 : -1;
    this.strafeT = rand(1, 3);
    this.bobY = 0.35;
  }

  _build() {
    const g = this.group;
    const ghost = 0x9ad8ff;
    const bodyMat = new THREE.MeshLambertMaterial({ color: ghost, emissive: 0x2050a0, emissiveIntensity: 0.5, transparent: true, opacity: 0.85, flatShading: true });
    const body = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.3, 7), bodyMat); body.position.y = 1.15;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 8, 6), bodyMat); head.position.y = 1.95;
    const hood = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.7, 7), new THREE.MeshLambertMaterial({ color: 0x2a3a6a, emissive: 0x101a40, emissiveIntensity: 0.5, transparent: true, flatShading: true })); hood.position.y = 2.25;
    const eyeMat = new THREE.MeshLambertMaterial({ color: 0x000000, emissive: 0x000000, transparent: true });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.07, 5, 4), eyeMat); eyeL.position.set(-0.12, 2.0, 0.27);
    const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.07, 5, 4), eyeMat); eyeR.position.set(0.12, 2.0, 0.27);
    const armGeo = new THREE.CylinderGeometry(0.06, 0.05, 0.7, 5); armGeo.translate(0, -0.35, 0);
    const armL = new THREE.Mesh(armGeo, bodyMat); armL.position.set(-0.4, 1.6, 0.1); armL.rotation.set(-0.9, 0, 0.5);
    const armR = new THREE.Mesh(armGeo, bodyMat); armR.position.set(0.4, 1.6, 0.1); armR.rotation.set(-0.9, 0, -0.5);
    // 궤도 도는 귀화 불꽃
    this.flames = [];
    const flameMat = new THREE.MeshBasicMaterial({ color: 0x70d0ff, transparent: true, opacity: 0.95 });
    for (let i = 0; i < 3; i++) {
      const f = new THREE.Mesh(new THREE.TetrahedronGeometry(0.16, 0), flameMat);
      g.add(f); this.flames.push(f);
    }
    this.armR = armR;
    g.add(body, head, hood, eyeL, eyeR, armL, armR);
    this._collectMats();
    // 불꽃은 항상 밝게 — 플래시 제외
    this.mats = this.mats.filter((e) => e.m !== flameMat);
    this.flameMat = flameMat;
  }

  behave(dt, ctx) {
    const p = this._target(ctx);
    const { dx, dz, d, ang } = this._toPlayer(p);
    this._faceTo(ang, dt, 6);
    if (!p.alive) return;
    this.fireCooldown -= dt;
    this.strafeT -= dt;
    if (this.strafeT <= 0) { this.strafe *= -1; this.strafeT = rand(1.5, 3.5); }

    if (this.state === 'chase') {
      // 거리 유지
      if (d < this.preferMin) this._moveTowards(-dx, -dz, d, dt, this.speed * 1.2);
      else if (d > this.preferMax) this._moveTowards(dx, dz, d, dt);
      // 측면 이동
      if (d > 1e-3) { this.pos.x += (-dz / d) * this.strafe * 1.6 * dt; this.pos.z += (dx / d) * this.strafe * 1.6 * dt; }
      if (this.fireCooldown <= 0 && d < 18) { this.setState('cast'); }
    } else if (this.state === 'cast') {
      const t = this.stateT;
      if (t < 0.6) {
        // 집중: 손끝에 불꽃 모임
        const src = this._handPos();
        ctx.effects.emit({ pos: new THREE.Vector3(src.x + rand(-0.6, 0.6), src.y + rand(-0.6, 0.6), src.z + rand(-0.6, 0.6)), vel: new THREE.Vector3(0, 0, 0), life: 0.3, size: 0.3, color: 0x70d0ff });
      }
      if (t >= 0.6 && !this.fired) {
        this.fired = true;
        const src = this._handPos();
        const target = new THREE.Vector3(p.pos.x, p.pos.y + 1.0, p.pos.z);
        // 약간의 리드
        const dir = target.sub(src).normalize();
        ctx.spawnProjectile(src, dir, { speed: 9, dmg: Math.round(7 * this.mul.dmg), color: 0x60c0ff });
        ctx.sfx && ctx.sfx('fire');
        ctx.effects.burst(src, { count: 8, colors: [0x70d0ff, 0xffffff], speed: 2, life: 0.3, size: 0.3, gravity: 0, drag: 2 });
      }
      if (t >= 1.0) { this.setState('chase'); this.fired = false; this.fireCooldown = rand(2.6, 4.0); }
    }
  }

  _handPos() {
    const fx = Math.sin(this.yaw), fz = Math.cos(this.yaw);
    return new THREE.Vector3(this.pos.x + fx * 0.7 + fz * 0.3, 1.5 + this.bobY, this.pos.z + fz * 0.7 - fx * 0.3);
  }

  animate(dt) {
    const t = performance.now() * 0.001 + this.id;
    this.bobY = Math.sin(t * 2.2) * 0.18 + 0.35;
    if (this.state !== 'dissolve' && this.state !== 'dead' && this.state !== 'spawn') this.pos.y = this.bobY;
    for (let i = 0; i < this.flames.length; i++) {
      const f = this.flames[i];
      const a = t * 2.5 + (i / 3) * Math.PI * 2;
      f.position.set(Math.cos(a) * 0.75, 1.3 + Math.sin(a * 1.7) * 0.3, Math.sin(a) * 0.75);
      f.rotation.set(t * 3, t * 2, 0);
      const s = 0.8 + 0.3 * Math.sin(t * 8 + i);
      f.scale.set(s, s * 1.6, s);
    }
    this.flameMat.opacity = this.opacity * 0.95;
    this.armR.rotation.x = damp(this.armR.rotation.x, this.state === 'cast' ? -1.6 : -0.9, 12, dt);
  }
}

// ---------- 보스: 黒鬼 (흑귀) ----------

  }

  behave(dt, ctx) {
    const p = this._target(ctx);
    const { dx, dz, d, ang } = this._toPlayer(p);
    // 귀왕: 주기적으로 소귀 소환
    if (this.cfg.summons && this.state === 'chase') {
      this.summonTimer -= dt;
      if (this.summonTimer <= 0) { this.summonTimer = 16; ctx.summon && ctx.summon(2); ctx.effects.shockwave(this.pos, { color: this.eyeColor, radius: 6, life: 0.6 }); }
    }
    if (this.hp < this.maxHp * 0.5 && this.phase === 1) {
      this.phase = 2;
      ctx.onBossPhase && ctx.onBossPhase(this);
      ctx.sfx && ctx.sfx('roar');
      ctx.effects.shockwave(this.pos, { color: 0xff3020, radius: 9, life: 0.9, y: 0.1 });
      ctx.effects.burst(this.center, { count: 60, colors: [0xff3020, 0x8a1030, 0xffffff], speed: 6, life: 1.0, size: 0.6, gravity: -2, drag: 1 });
    }
    if (this.state === 'chase') {
      this._faceTo(ang, dt, 4);
      if (!p.alive) return;
      if (this.attackCooldown <= 0) {
        // 공격 선택
        const r = Math.random();
        if (d > 7 && r < 0.65) { this.setState('charge'); this.hit = false; this.charge = null; }
        else if (this.phase >= this.cfg.fireFromPhase && d > 4 && r < 0.45) { this.setState('firering'); this.fired = false; }
        else if (d <= this.attackRange + 0.5) { this.setState('slam'); this.hit = false; }
        else this._moveTowards(dx, dz, d, dt);
      } else {
        if (d > this.attackRange) this._moveTowards(dx, dz, d, dt);
      }
    } else if (this.state === 'slam') {
      const t = this.stateT;
      if (t < 0.85) this._faceTo(ang, dt, 3);
      if (t >= 0.85 && !this.hit) {
        this.hit = true;
        const fx = Math.sin(this.yaw), fz = Math.cos(this.yaw);
        const impact = new THREE.Vector3(this.pos.x + fx * 2.4, 0, this.pos.z + fz * 2.4);
        ctx.effects.shockwave(impact, { color: 0xffa040, radius: 4.5, life: 0.55, y: 0.1 });
        ctx.effects.burst(impact, { count: 40, colors: [0x6a5a40, 0x9a8a60, 0xff8a30], speed: 6, life: 0.7, size: 0.5, gravity: -9, drag: 1, up: 2 });
        ctx.effects.addShake(0.8);
        ctx.sfx && ctx.sfx('slam');
        const dd = Math.hypot(p.pos.x - impact.x, p.pos.z - impact.z);
        if (dd < 4.2) p.takeDamage(this.dmg, impact, ctx.effects);
      }
      if (t >= 1.5) { this.setState('chase'); this.attackCooldown = rand(1.6, 2.4); }
    } else if (this.state === 'charge') {
      const t = this.stateT;
      if (t < 0.7) {
        if (t < 0.05 && !this.roared) { this.roared = true; ctx.sfx && ctx.sfx('roar'); }
        this._faceTo(ang, dt, 6);
        if (Math.random() < 0.6) ctx.effects.emit({ pos: new THREE.Vector3(this.pos.x + rand(-1, 1), 0.3, this.pos.z + rand(-1, 1)), vel: new THREE.Vector3(0, 2, 0), life: 0.4, size: 0.5, color: 0xff3020 });
      } else if (t < 1.5) {
        if (!this.charge) this.charge = new THREE.Vector3(Math.sin(this.yaw), 0, Math.cos(this.yaw));
        this.pos.addScaledVector(this.charge, this.cfg.chargeSpeed * dt);
        ctx.effects.emit({ pos: new THREE.Vector3(this.pos.x + rand(-1, 1), 0.3, this.pos.z + rand(-1, 1)), vel: new THREE.Vector3(0, 1.5, 0), life: 0.5, size: 0.7, color: 0x5a4a3a });
        if (!this.hit && d < this.radius + p.radius + 0.6) {
          this.hit = true;
          p.takeDamage(Math.round(12 * this.mul.dmg), this.pos, ctx.effects);
          ctx.effects.addShake(0.5);
        }
        // 벽에 부딪히면 정지
        if (Math.hypot(this.pos.x, this.pos.z) > ARENA_RADIUS - this.radius - 0.2) { this.stateT = 1.5; ctx.effects.addShake(0.6); ctx.effects.shockwave(this.pos, { color: 0xffffff, radius: 3, life: 0.4 }); }
      }
      if (t >= 2.1) { this.setState('chase'); this.roared = false; this.attackCooldown = rand(1.4, 2.2); }
    } else if (this.state === 'firering') {
      const t = this.stateT;
      if (t < 0.9) {
        ctx.effects.emit({ pos: this.center.add(new THREE.Vector3(rand(-1.5, 1.5), rand(-1, 1), rand(-1.5, 1.5))), vel: new THREE.Vector3(0, 0, 0), life: 0.3, size: 0.5, color: 0xff6030 });
      }
      if (t >= 0.9 && !this.fired) {
        this.fired = true;
        const n = 10;
        const src = this.center;
        for (let i = 0; i < n; i++) {
          const a = ang + (i / n) * Math.PI * 2;
          const dir = new THREE.Vector3(Math.sin(a), -0.08, Math.cos(a));
          ctx.spawnProjectile(src.clone(), dir, { speed: 7.5, dmg: Math.round(8 * this.mul.dmg), color: this.eyeColor, size: 0.32, life: 5 });
        }
        ctx.effects.shockwave(this.pos, { color: 0xff6030, radius: 5, life: 0.5 });
        ctx.sfx && ctx.sfx('fire');
      }
      if (t >= 1.6) { this.setState('chase'); this.attackCooldown = rand(1.5, 2.5); }
    }
  }

  animate(dt) {
    const t = this.stateT;
    let ax = 0.2, ay = 0, lean = 0;
    if (this.state === 'slam') {
      if (t < 0.85) { const k = easeOutCubic(t / 0.85); ax = lerp(0.2, -3.0, k); lean = -0.2 * k; }
      else { const k = clamp((t - 0.85) / 0.15, 0, 1); ax = lerp(-3.0, -0.3, easeOutCubic(k)); lean = lerp(-0.2, 0.3, k); }
      if (t > 1.1) { const k = clamp((t - 1.1) / 0.4, 0, 1); ax = lerp(-0.3, 0.2, k); lean = lerp(0.3, 0, k); }
    } else if (this.state === 'charge') {
      if (t < 0.7) { lean = -0.25; ax = -0.6; } else { lean = 0.35; ax = -1.2; ay = 0.8; }
    } else if (this.state === 'firering') {
      ax = -2.2; ay = 1.0; lean = -0.1;
    } else if (this.state === 'chase') {
      const w = performance.now() * 0.007 + this.id;
      this.legs[0].rotation.x = Math.sin(w) * 0.5; this.legs[1].rotation.x = -Math.sin(w) * 0.5;
      this.armL.rotation.x = -Math.sin(w) * 0.4;
      ax = 0.2 + Math.sin(w) * 0.2; lean = 0.1;
    }
    this.armR.rotation.x = damp(this.armR.rotation.x, ax, 18, dt);
    this.armR.rotation.y = damp(this.armR.rotation.y, ay, 18, dt);
    if (this.state !== 'dead') this.group.rotation.x = damp(this.group.rotation.x, lean, 10, dt);
    const telegraph = (this.state === 'slam' && t < 0.85) || (this.state === 'charge' && t < 0.7) || (this.state === 'firering' && t < 0.9);
    this.eyeMat.emissive.setHex(telegraph ? 0xffffff : this.eyeColor);
    this.eyeMat.emissiveIntensity = telegraph ? 2 : 0.9;
  }
}

// ---------- 웨이브/스폰 관리 ----------
const WAVES = [
  { melee: 2, ranged: 0, title: '첫 번째 파도', sub: '소귀들이 안개 속에서 기어 나온다' },
  { melee: 2, ranged: 2, title: '두 번째 파도', sub: '귀화가 대나무 사이를 떠돈다' },
  { melee: 3, ranged: 2, title: '세 번째 파도', sub: '숲 전체가 술렁인다' },
  { boss: true, title: '흑귀', sub: '대나무 숲의 주인이 눈을 뜬다' },
];

class EnemyManager {
  constructor(scene, chapter = null) {
    this.scene = scene;
    this.waves = (chapter && chapter.waves) || WAVES;
    this.scale = (chapter && chapter.scale) || { hp: 1, dmg: 1 };
    this.bossCfg = (chapter && chapter.boss) || DEFAULT_BOSS;
    this.list = [];
    this.projectiles = [];
    this.waveIndex = -1;
    this.waveDelay = 2.5;
    this.boss = null;
    this.bossDefeated = false;
    this.kills = 0;
    this.onMessage = null;
    this.onBossSpawn = null;
    this.onBossDefeated = null;
    this.dissolved = false;
    this.spawnQueue = [];
    this.pickups = [];
    this.onKill = null;
    this.onPickup = null;
    this.onWave = null;
  }

  get aliveCount() { return this.list.filter((e) => e.alive).length; }
  get totalWaves() { return this.waves.length; }
  get allWavesCleared() { return this.waveIndex >= this.waves.length - 1 && this.aliveCount === 0 && this.spawnQueue.length === 0; }

  _spawnPos(player, min = 10, max = 16) {
    for (let i = 0; i < 20; i++) {
      const a = rand(0, Math.PI * 2);
      const r = rand(min, max);
      const p = new THREE.Vector3(player.pos.x + Math.cos(a) * r, 0, player.pos.z + Math.sin(a) * r);
      const d = Math.hypot(p.x, p.z);
      if (d > ARENA_RADIUS - 2) { const k = (ARENA_RADIUS - 2) / d; p.x *= k; p.z *= k; }
      if (Math.hypot(p.x - player.pos.x, p.z - player.pos.z) > 6) return p;
    }
    return new THREE.Vector3(0, 0, -12);
  }

  startWave(index, player) {
    this.waveIndex = index;
    const w = this.waves[index];
    if (!w) return;
    this.onMessage && this.onMessage(w.title, w.sub);
    this.onWave && this.onWave(index, w);
    if (w.boss) {
      const pos = new THREE.Vector3(0, 0, -12);
      this.boss = new BossOni(this.scene, pos, this.bossCfg, this.scale);
      this.list.push(this.boss);
      this.onBossSpawn && this.onBossSpawn(this.boss);
      return;
    }
    let delay = 0;
    for (let i = 0; i < w.melee; i++) { this.spawnQueue.push({ t: delay, type: 'melee' }); delay += 0.35; }
    for (let i = 0; i < w.ranged; i++) { this.spawnQueue.push({ t: delay, type: 'ranged' }); delay += 0.35; }
  }

  spawnProjectile(pos, dir, opts) {
    this.projectiles.push(new Projectile(this.scene, pos, dir, opts));
  }

  dissolveAll(effects) {
    if (this.dissolved) return;
    this.dissolved = true;
    this.spawnQueue.length = 0;
    for (const e of this.list) e.dissolve(effects);
    for (const p of this.projectiles) p.destroy(effects);
  }

  update(dt, ctx) {
    const player = ctx.player;
    ctx.enemies = this.list;
    ctx.pickups = this.pickups;
    ctx.projectiles = this.projectiles;
    ctx.spawnProjectile = (p, d, o) => this.spawnProjectile(p, d, o);
    ctx.summon = (n) => { for (let i = 0; i < n; i++) this.spawnQueue.push({ t: i * 0.4, type: 'melee' }); };
    ctx.dt = dt;

    // 스폰 큐
    if (!this.dissolved) {
      for (let i = this.spawnQueue.length - 1; i >= 0; i--) {
        const s = this.spawnQueue[i];
        s.t -= dt;
        if (s.t <= 0) {
          const pos = this._spawnPos(player);
          const e = s.type === 'melee' ? new MeleeYokai(this.scene, pos, this.scale) : new RangedYokai(this.scene, pos, this.scale);
          this.list.push(e);
          ctx.effects.mist(new THREE.Vector3(pos.x, 0.5, pos.z), undefined, 25);
          ctx.sfx && ctx.sfx('spawn');
          this.spawnQueue.splice(i, 1);
        }
      }
      // 다음 웨이브
      if (this.aliveCount === 0 && this.spawnQueue.length === 0 && this.waveIndex < this.waves.length - 1 && player.alive) {
        this.waveDelay -= dt;
        if (this.waveDelay <= 0) { this.startWave(this.waveIndex + 1, player); this.waveDelay = 3.5; }
      }
      // 보스 2페이즈 시 추가 소환
      if (this.boss && this.boss.alive && this.boss.phase === 2 && !this.boss.addsSpawned) {
        this.boss.addsSpawned = true;
        this.spawnQueue.push({ t: 0.5, type: 'ranged' }, { t: 1.3, type: 'melee' });
      }
    }

    // 적 업데이트
    for (const e of this.list) e.update(dt, ctx);
    for (let i = this.list.length - 1; i >= 0; i--) {
      const e = this.list[i];
      if (!e.alive && !e.dissolving && !e.dropped) { e.dropped = true; this._onDeath(e, ctx); }
      if (e.removed) this.list.splice(i, 1);
    }
    this._updatePickups(dt, ctx);
    // 보스 사망 → 새벽
    if (this.boss && !this.boss.alive && !this.bossDefeated && !this.boss.dissolving) {
      this.bossDefeated = true;
      this.onBossDefeated && this.onBossDefeated(this.boss);
    }

    // 투사체
    for (const p of this.projectiles) p.update(dt, ctx);
    for (let i = this.projectiles.length - 1; i >= 0; i--) if (!this.projectiles[i].alive) this.projectiles.splice(i, 1);
  }

  // 사망: 경험치 콜백 + 아이템 드롭
  _onDeath(e, ctx) {
    this.kills++;
    this.onKill && this.onKill(e);
    const boss = e.isBoss;
    // 금화
    const gold = boss ? 120 + Math.round(rand(0, 60)) : Math.round(rand(4, 12) * (e.kind === 'ranged' ? 1.3 : 1));
    this._spawnPickup({ type: 'gold', amount: gold }, e.pos, ctx);
    const potionChance = boss ? 1 : 0.22;
    if (Math.random() < potionChance) this._spawnPickup({ type: 'potion' }, e.pos, ctx);
    const itemChance = boss ? 1 : e.kind === 'ranged' ? 0.3 : 0.24;
    if (Math.random() < itemChance) {
      const level = (ctx.player.progress && ctx.player.progress.level) || 1;
      this._spawnPickup({ type: 'item', item: generateItem(rollRarity(boss), null, level) }, e.pos, ctx);
      if (boss) this._spawnPickup({ type: 'item', item: generateItem(rollRarity(true), null, level) }, e.pos, ctx);
    }
  }

  _spawnPickup(data, pos, ctx) {
    const g = new THREE.Group();
    let color;
    if (data.type === 'gold') {
      color = 0xffd040;
      const coin = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 0.06, 10), new THREE.MeshLambertMaterial({ color: 0xffd040, emissive: 0xc08010, emissiveIntensity: 0.7 }));
      coin.rotation.x = Math.PI / 2;
      g.add(coin);
    } else if (data.type === 'potion') {
      color = 0xff5070;
      const bottle = new THREE.Mesh(new THREE.CylinderGeometry(0.16, 0.2, 0.36, 7), new THREE.MeshLambertMaterial({ color: 0xff4060, emissive: 0xff2040, emissiveIntensity: 0.8, transparent: true, opacity: 0.9 }));
      const neck = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.07, 0.14, 6), new THREE.MeshLambertMaterial({ color: 0x3a2a20 }));
      neck.position.y = 0.25;
      g.add(bottle, neck);
    } else {
      color = RARITIES[data.item.rarity].hex;
      const gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.28, 0), new THREE.MeshLambertMaterial({ color, emissive: color, emissiveIntensity: 0.9 }));
      const ring = new THREE.Mesh(new THREE.TorusGeometry(0.42, 0.03, 6, 20), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.7 }));
      ring.rotation.x = Math.PI / 2;
      g.add(gem, ring);
    }
    const a = rand(0, Math.PI * 2), r = rand(0.4, 1.4);
    g.position.set(pos.x + Math.cos(a) * r, 0.5, pos.z + Math.sin(a) * r);
    ctx.stage.resolveCollisions(g.position, 0.3);
    this.scene.add(g);
    this.pickups.push({ ...data, group: g, color, life: 45, t: rand(0, 6), vy: 3 });
    ctx.effects.burst(g.position, { count: 12, colors: [color, 0xffffff], speed: 2, life: 0.6, size: 0.35, gravity: 0, drag: 2 });
  }

  _updatePickups(dt, ctx) {
    const p = ctx.player;
    for (let i = this.pickups.length - 1; i >= 0; i--) {
      const k = this.pickups[i];
      k.t += dt; k.life -= dt;
      // 낙하 후 둥실
      if (k.vy > 0) { k.vy -= 8 * dt; k.group.position.y += k.vy * dt; if (k.group.position.y < 0.5) { k.group.position.y = 0.5; k.vy = 0; } }
      else k.group.position.y = 0.5 + Math.sin(k.t * 3) * 0.12;
      k.group.rotation.y += dt * 2;
      if (k.type === 'gold') k.group.rotation.y += dt * 4;
      if (Math.random() < (k.type === 'gold' ? 0.05 : 0.15)) ctx.effects.emit({ pos: k.group.position, vel: new THREE.Vector3(rand(-0.3, 0.3), rand(0.5, 1.2), rand(-0.3, 0.3)), life: 0.7, size: 0.25, color: k.color, drag: 1 });
      const d = Math.hypot(p.pos.x - k.group.position.x, p.pos.z - k.group.position.z);
      // 가까우면 끌려옴
      if (p.alive && d < 3.2) {
        const pull = Math.min(1, (3.2 - d) / 3.2) * 9 * dt;
        k.group.position.x += (p.pos.x - k.group.position.x) / Math.max(d, 0.01) * pull;
        k.group.position.z += (p.pos.z - k.group.position.z) / Math.max(d, 0.01) * pull;
      }
      const taken = p.alive && d < 0.9 && this.onPickup && this.onPickup(k);
      if (taken || k.life <= 0) {
        if (taken) ctx.effects.burst(k.group.position, { count: 16, colors: [k.color, 0xffffff], speed: 3, life: 0.5, size: 0.35, gravity: 1, drag: 1.5, up: 2 });
        this.scene.remove(k.group);
        k.group.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); o.material.dispose(); } });
        this.pickups.splice(i, 1);
      }
    }
  }
}

return { Projectile, Enemy, MeleeYokai, RangedYokai, BossOni, EnemyManager };
})();

    this.msgTimer = 0; this.vig = 0; this.moveTimer = 0;
    this.onSelect = null; this.onMenuClose = null; this.onLearn = null; this.onEquip = null; this.onUnequip = null; this.onResetSkills = null;
    this.onBuy = null; this.onBuyPotion = null; this.onSell = null; this.onContinue = null; this.onNew = null; this.onStoryDone = null;

  }

  // ---------- HUD ----------
  setHP(cur, max) {
    const p = clamp(cur / max, 0, 1);
    this.el['hp-fill'].style.width = `${p * 100}%`;
    this.el['hp-text'].textContent = `${Math.ceil(cur)} / ${max}`;
    this.el['hp-fill'].classList.toggle('low', p < 0.3);
  }
  setName(name) { this.el['hud-name'].textContent = name; }
  setGauge(v, max) {
    const p = clamp(v / max, 0, 1);
    this.el['gauge-fill'].style.width = `${p * 100}%`;
    this.el['gauge-text'].textContent = p >= 1 ? '준비 완료' : `${Math.floor(p * 100)}%`;
    this.el['gauge-fill'].classList.toggle('full', p >= 1);
    this.el['special-hint'].classList.toggle('show', p >= 1 && !this.touch);
  }
  setProgress(pr) {
    if (!pr) return;
    this.el['level-text'].textContent = `Lv.${pr.level}${pr.points > 0 ? ` · 포인트 ${pr.points}` : ''}`;
    this.el['xp-text'].textContent = `${Math.floor(pr.xp)} / ${xpToNext(pr.level)}`;
    this.el['xp-fill'].style.width = `${clamp(pr.xp / xpToNext(pr.level), 0, 1) * 100}%`;
    this.el['potion-text'].textContent = `×${pr.potions}`;
    this.el['potion-hud'].classList.toggle('empty', pr.potions <= 0);
    this.el['gold-text'].textContent = pr.gold;
    this.el['level-text'].classList.toggle('has-points', pr.points > 0);
  }
  setAllies(allies) {
    if (!allies.length) { this.el.allies.innerHTML = ''; return; }
    this.el.allies.innerHTML = allies.map((a) => `<div class="ally ${a.alive ? '' : 'down'}"><span class="aname" style="color:#${a.ch.colors.glow.toString(16).padStart(6, '0')}">${a.ch.name}</span><span class="abar"><span style="width:${clamp(a.hp / a.maxHp, 0, 1) * 100}%"></span></span>${a.alive ? '' : `<span class="adown">기상까지 ${Math.ceil(a.downT)}</span>`}</div>`).join('');
  }
  setCombo(n, pop) {
    if (n > 0) {
      this.el['combo-num'].textContent = n;
      this.el['combo-num'].style.transform = `scale(${1 + pop * 0.5})`;
      const tier = n >= 30 ? 'tier3' : n >= 15 ? 'tier2' : n >= 6 ? 'tier1' : '';

    } else this.el.combo.classList.remove('show');
  }
  // 기술명 연출
  callout(name, tier = 1, color = '#cfe8ff') {
    const m = this.el.move;
    this.el['move-text'].textContent = name;
    m.style.setProperty('--mc', color);
    m.className = '';
    void m.offsetWidth;
    m.className = `show t${tier}`;
    this.moveTimer = tier >= 3 ? 2.2 : 1.3;
  }
  showBoss(name) { this.el['boss-name'].textContent = name; this.el.boss.classList.add('show'); }
  setBossHP(cur, max) { this.el['boss-fill'].style.width = `${clamp(cur / max, 0, 1) * 100}%`; }
  hideBoss() { this.el.boss.classList.remove('show'); }
  setNight(progress, waveIndex, totalWaves, kills, dawn, chapter) {
    this.el['night-fill'].style.width = `${progress * 100}%`;
    this.el['night-moon'].style.left = `${progress * 100}%`;
    this.el['night-moon'].textContent = dawn ? '☀' : '☾';
    this.el['wave-text'].textContent = waveIndex < 0 ? '밤이 내린다' : waveIndex >= totalWaves - 1 ? '보스' : `${waveIndex + 1}번째 파도`;
    this.el['chapter-text'].textContent = chapter ? `${chapter.title} · ${chapter.name}` : '';
    this.el['kill-text'].textContent = `토벌 ${kills}`;
  }
  setDash(cdFrac) { this.el['dash-cd'].style.opacity = cdFrac > 0 ? 0.8 : 0.25; this.el['dash-cd'].style.setProperty('--cd', `${(1 - cdFrac) * 100}%`); }
  message(title, sub = '', duration = 3.2) {
    this.el['msg-title'].textContent = title; this.el['msg-sub'].textContent = sub;
    this.el.message.classList.remove('show'); void this.el.message.offsetWidth; this.el.message.classList.add('show');
    this.msgTimer = duration;
  }
  logLine(html, cls = '') {
    const el = document.createElement('div');
    el.className = `log-line ${cls}`; el.innerHTML = html;
    this.el.log.appendChild(el);
    while (this.el.log.children.length > 4) this.el.log.removeChild(this.el.log.firstChild);
    setTimeout(() => { el.classList.add('fade'); setTimeout(() => el.remove(), 600); }, 3200);
  }
  damageFlash() { this.vig = 1; }

  // ---------- 화면 ----------
  showScreen(kind, stats = {}) {
    const t = this.$('screen-title'), s = this.$('screen-sub'), b = this.$('screen-body'), c = this.$('screen-cta');
    this.screen.className = `screen show ${kind}`;

    if (kind === 'title') {

        <div class="title-btns">
          ${cont ? `<button id="btn-continue" class="big">이어하기<span>${cont}</span></button>` : ''}
          <button id="btn-new" class="big ${cont ? '' : 'primary'}">새로 시작<span>검사 선택</span></button>
        </div>
        ${this.touch ? `<table class="controls compact">
          <tr><td>왼쪽 화면</td><td>드래그로 이동</td></tr>
          <tr><td>오른쪽 화면</td><td>드래그로 시점 · 탭으로 베기</td></tr>
          <tr><td>베기 / 강공 / 대시 / 비검 / 약</td><td>우하단 버튼</td></tr>
        </table><p class="tip">가로 화면을 권장합니다</p>` : `<table class="controls compact">
          <tr><td>W A S D · 마우스</td><td>이동 · 시점</td></tr>
          <tr><td>좌클릭 / 우클릭 / Shift</td><td>3연타 / 강공격 / 대시</td></tr>
          <tr><td>F · Q · Tab · M</td><td>비검 · 회복약 · 장비/스킬/상점 · 소리</td></tr>
        </table>`}`;
      c.textContent = '';
      const bc = this.$('btn-continue'); if (bc) bc.addEventListener('click', (e) => { e.stopPropagation(); this.onContinue && this.onContinue(); });
      this.$('btn-new').addEventListener('click', (e) => { e.stopPropagation(); this.onNew && this.onNew(); });
    } else if (kind === 'pause') {
      t.textContent = '일시정지'; s.textContent = '숨을 고른다';
      b.innerHTML = this.touch ? '' : '<p class="tip">Tab — 장비·스킬·상점 · M — 소리</p>';
      c.textContent = `${act} 계속`;
    } else if (kind === 'defeat') {
      t.textContent = '산화'; s.textContent = '검사는 쓰러졌다… 얻은 경험과 장비, 금화는 남는다.';
      b.innerHTML = this._stats(stats); c.textContent = `${act} 다시 도전`;
    } else if (kind === 'ending') {
      t.textContent = '새벽'; s.textContent = '요괴의 시대가 끝났다. 다섯 밤을 모두 넘긴 검사에게 경의를.';

  }
  _stats(s) {
    return `<div class="stats">
      <div><span>토벌</span><b>${s.kills ?? 0}</b></div><div><span>최대 연타</span><b>${s.maxCombo ?? 0}</b></div>
      <div><span>비검 발동</span><b>${s.specials ?? 0}</b></div><div><span>경과</span><b>${Math.floor((s.time ?? 0) / 60)}:${String(Math.floor((s.time ?? 0) % 60)).padStart(2, '0')}</b></div>

    </div>`;
  }
  hideScreen() { this.screen.className = 'screen'; }

  // ---------- 이야기 화면 ----------
  showStory(chapter, kind, ctaText) {
    this.$('story-chapter').textContent = `${chapter.title} · ${chapter.place}`;
    this.$('story-title').textContent = kind === 'intro' ? chapter.name : (chapter.final ? '새벽 — 끝' : '새벽');
    this.$('story-place').textContent = kind === 'intro' ? '' : `${chapter.name} — 클리어`;
    const lines = kind === 'intro' ? chapter.story : chapter.clear;
    const box = this.$('story-lines');
    box.innerHTML = lines.map((l, i) => `<p style="animation-delay:${0.3 + i * 0.9}s">${l}</p>`).join('');
    this.$('story-cta').textContent = ctaText;
    this.$('story-cta').style.animationDelay = `${0.3 + lines.length * 0.9}s`;
    this.el.story.className = `screen show ${kind}`;
  }
  hideStory() { this.el.story.className = 'screen'; }

  // ---------- 캐릭터 선택 ----------
  showSelect(progressOf) {
    const wrap = this.$('select-cards');
    wrap.innerHTML = '';
    for (const ch of CHARACTERS) {
      const pr = progressOf(ch.id);
      const card = document.createElement('div');
      card.className = 'card';
      card.style.setProperty('--c1', `#${ch.colors.kimono.toString(16).padStart(6, '0')}`);
      card.style.setProperty('--c2', `#${ch.colors.glow.toString(16).padStart(6, '0')}`);
      card.style.setProperty('--c3', `#${ch.colors.scarf.toString(16).padStart(6, '0')}`);
      card.style.setProperty('--c4', `#${ch.colors.hair.toString(16).padStart(6, '0')}`);
      const bar = (n) => '●'.repeat(n) + '○'.repeat(5 - n);
      card.innerHTML = `
        <div class="figure"><div class="hat ${ch.look.kasa ? 'kasa' : ch.look.cap ? 'cap' : ch.look.headband ? 'band' : 'hair'}"></div><div class="head"><span class="eye l"></span><span class="eye r"></span></div><div class="scarf"></div><div class="body"></div><div class="blade"></div></div>

        <div class="style">${ch.style} · ${ch.role}</div>
        <div class="desc">${ch.desc}</div>
        <table class="statbars"><tr><td>공격</td><td>${bar(ch.bars.atk)}</td></tr><tr><td>속도</td><td>${bar(ch.bars.spd)}</td></tr><tr><td>체력</td><td>${bar(ch.bars.hp)}</td></tr><tr><td>기술</td><td>${bar(ch.bars.tec)}</td></tr></table>
        <div class="special">${ch.special.name}</div>

      card.addEventListener('click', () => this.onSelect && this.onSelect(ch));

  hideSelect() { this.el.select.className = 'screen'; }

  // ---------- 메뉴 ----------
  showMenu(character, progress, tab = null) {
    this.character = character; this.progress = progress;
    if (tab) this.menuTab = tab;
    this.menu.className = 'screen show';
    this.renderMenu();
  }
  hideMenu() { this.menu.className = 'screen'; }
  setMenuTab(tab) { this.menuTab = tab; this.renderMenu(); }
  renderMenu() {
    const pr = this.progress, ch = this.character;
    if (!pr) return;
    for (const b of this.menu.querySelectorAll('.tab')) b.classList.toggle('on', b.dataset.tab === this.menuTab);
    for (const k of ['skills', 'gear', 'shop']) this.$(`menu-${k}`).hidden = this.menuTab !== k;
    this.$('menu-info').innerHTML = `<b>${ch.name}</b> · Lv.${pr.level} · 경험치 ${Math.floor(pr.xp)}/${xpToNext(pr.level)} · <span class="pts ${pr.points ? 'on' : ''}">스킬 포인트 ${pr.points}</span> · 회복약 ${pr.potions} · <span class="gold">${ICONS.gold} ${pr.gold}</span>`;
    if (this.menuTab === 'skills') this._renderSkills(); else if (this.menuTab === 'gear') this._renderGear(); else this._renderShop();
  }
  _renderSkills() {
    const pr = this.progress;
    const box = this.$('menu-skills');
    box.innerHTML = `<div class="skill-cols">${SKILL_BRANCHES.map((br) => `
      <div class="skill-col"><div class="branch"><b>${br.name}</b><span>${br.desc}</span></div>
        ${SKILLS.filter((s) => s.branch === br.id).map((s) => {
          const state = pr.has(s.id) ? 'learned' : pr.canLearn(s.id) ? 'can' : (!s.req || pr.has(s.req)) ? 'open' : 'locked';
          return `<div class="node-link ${pr.has(s.id) ? 'lit' : ''}"></div>
          <button class="node ${state}" data-skill="${s.id}"><div class="tier">${s.tier}단</div><div class="nname">${s.name}</div><div class="ndesc">${s.desc}</div>
            <div class="nstate">${state === 'learned' ? '습득' : state === 'can' ? '배우기 (1포인트)' : state === 'open' ? '포인트 필요' : '이전 단계 필요'}</div></button>`; }).join('')}
      </div>`).join('')}</div>
      <div class="menu-foot"><span>요괴를 베어 경험치를 얻고, 레벨이 오를 때마다 스킬 포인트 1을 받습니다.</span><button id="skill-reset">스킬 초기화</button></div>`;
    for (const n of box.querySelectorAll('.node.can')) n.addEventListener('click', () => { if (pr.learn(n.dataset.skill)) { this.onLearn && this.onLearn(n.dataset.skill); this.renderMenu(); } });
