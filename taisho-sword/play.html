class Player {
  constructor(scene) {
    this.scene = scene;
    this.parts = buildModel();
    this.group = new THREE.Group();
    this.group.add(this.parts.body);
    scene.add(this.group);

    this.pos = this.group.position;
    this.pos.set(0, 0, 4);
    this.vel = new THREE.Vector3();
    this.yaw = Math.PI;         // 모델 정면 각도 (+Z 기준)
    this.camYaw = 0;
    this.camPitch = 0.28;
    this.radius = PLAYER_RADIUS;
    this.height = 1.9;

    this.hp = 100; this.maxHp = 100;
    this.gauge = 0; this.gaugeMax = GAUGE_MAX;
    this.combo = 0; this.comboTimer = 0; this.comboPop = 0;
    this.invuln = 0;
    this.alive = true;

    this.attack = null;          // {def, t, hitSet, name}
    this.queued = null;          // 다음 공격 예약
    this.comboResetTimer = 0;    // 연타 단계 초기화 타이머
    this.nextLight = 'light1';

    this.dashTime = 0; this.dashCooldown = 0; this.dashDir = new THREE.Vector3();
    this.moving = false; this.walkPhase = 0;
    this.knock = new THREE.Vector3();

    this.waves = [];             // 특수기 검기 파동
    this.events = [];            // 이번 프레임 이벤트 (hit, damaged, special...)
    this.hitstop = 0;
    this.fwd = new THREE.Vector3(0, 0, 1);
    this._tmp = new THREE.Vector3();
    this.blink = 0;
    this.kills = 0;
  }

  get forward() {
    return this.fwd.set(Math.sin(this.yaw), 0, Math.cos(this.yaw));
  }
  get center() { return this._tmp.set(this.pos.x, this.pos.y + 1.1, this.pos.z); }
  get busy() { return !!this.attack; }
  get specialReady() { return this.gauge >= this.gaugeMax; }

  // ---------- 입력/이동 ----------
  update(dt, input, ctx) {
    this.events.length = 0;
    if (!this.alive) { this._animateDead(dt); return; }

    // 카메라 회전
    this.camYaw -= input.mouseDX * 0.0022;
    this.camPitch = clamp(this.camPitch + input.mouseDY * 0.0018, -0.35, 1.05);

    // 카메라 기준 방향
    const cfx = -Math.sin(this.camYaw), cfz = -Math.cos(this.camYaw);
    const crx = -cfz, crz = cfx;
    let mx = 0, mz = 0;
    if (input.keys.KeyW) { mx += cfx; mz += cfz; }
    if (input.keys.KeyS) { mx -= cfx; mz -= cfz; }
    if (input.keys.KeyD) { mx += crx; mz += crz; }
    if (input.keys.KeyA) { mx -= crx; mz -= crz; }
    // 터치 조이스틱(아날로그)
    if (input.axisX || input.axisY) {
      mx += cfx * input.axisY + crx * input.axisX;
      mz += cfz * input.axisY + crz * input.axisX;
    }
    let ml = Math.hypot(mx, mz);
    if (ml > 1) { mx /= ml; mz /= ml; ml = 1; }
    this.moving = ml > 0.001;

    // 타이머
    this.invuln = Math.max(0, this.invuln - dt);
    this.dashCooldown = Math.max(0, this.dashCooldown - dt);
    this.blink = Math.max(0, this.blink - dt);
    if (this.comboTimer > 0) { this.comboTimer -= dt; if (this.comboTimer <= 0) this.combo = 0; }
    this.comboPop = Math.max(0, this.comboPop - dt * 4);
    if (this.comboResetTimer > 0 && !this.attack) {
      this.comboResetTimer -= dt;
      if (this.comboResetTimer <= 0) this.nextLight = 'light1';
    }

    // 대시
    if (input.dash && this.dashCooldown <= 0 && this.dashTime <= 0 && !(this.attack && this.attack.def.special)) {
      this.dashTime = DASH_TIME;
      this.dashCooldown = DASH_COOLDOWN;
      if (ml > 0) this.dashDir.set(mx, 0, mz); else this.dashDir.copy(this.forward);
      this.yaw = Math.atan2(this.dashDir.x, this.dashDir.z);
      this.attack = null; this.queued = null;
      this.invuln = Math.max(this.invuln, DASH_TIME + 0.05);
      ctx.effects.burst(this.center, { count: 14, colors: [0x9cc8ff, 0xe0f0ff], speed: 2, life: 0.4, size: 0.5, gravity: 0, drag: 2 });
      this.events.push({ type: 'dash' });
    }
    input.dash = false;

    // 공격 입력
    if (input.light) {
      if (!this.attack) this._startAttack(this.nextLight, ctx);
      else if (this.attack.def.next && this.attack.t >= this.attack.def.active[0]) this.queued = this.attack.def.next;
    }
    if (input.heavy) {
      if (!this.attack) this._startAttack('heavy', ctx);
      else if (!this.attack.def.heavy && !this.attack.def.special && this.attack.t >= this.attack.def.active[0]) this.queued = 'heavy';
    }
    if (input.special && this.specialReady && !(this.attack && this.attack.def.special)) {
      this.gauge = 0;
      this._startAttack('special', ctx);
      this.invuln = Math.max(this.invuln, ATTACKS.special.dur);
      this.events.push({ type: 'special' });
    }
    input.light = input.heavy = input.special = false;

    // 이동 처리
    const move = new THREE.Vector3();
    if (this.dashTime > 0) {
      this.dashTime -= dt;
      move.copy(this.dashDir).multiplyScalar(DASH_SPEED * dt);
      // 잔상 파티클
      ctx.effects.emit({ pos: this.center, vel: new THREE.Vector3(rand(-1, 1), rand(0, 1), rand(-1, 1)), life: 0.3, size: 0.6, color: 0x8ab8ff, drag: 2 });
    } else if (this.attack) {
      // 공격 중엔 정면 유지 + 런지
      const a = this.attack;
      const d = a.def;
      const w = d.active[0];
      if (a.t < w) {
        // 준비 단계에서 이동 입력 방향으로 살짝 조준 회전 허용
        if (ml > 0) this.yaw = angleLerp(this.yaw, Math.atan2(mx, mz), 1 - Math.exp(-14 * dt));
      }
      if (a.t >= w * 0.6 && a.t < d.active[1] && d.lunge) {
        const f = this.forward;
        move.copy(f).multiplyScalar(d.lunge * dt);
      }
    } else if (ml > 0) {
      move.set(mx, 0, mz).multiplyScalar(MOVE_SPEED * dt); // 아날로그 입력은 크기에 비례
      this.yaw = angleLerp(this.yaw, Math.atan2(mx, mz), 1 - Math.exp(-12 * dt));
    }
    // 넉백
    move.addScaledVector(this.knock, dt);
    this.knock.multiplyScalar(Math.max(0, 1 - 7 * dt));
    this.pos.add(move);
    ctx.stage.resolveCollisions(this.pos, this.radius);
    this.pos.y = 0;

    // 공격 진행
    if (this.attack) this._updateAttack(dt, ctx);

    // 검기 파동
    this._updateWaves(dt, ctx);

    // 애니메이션
    this._animate(dt);
    this.group.rotation.y = this.yaw;
  }

  // ---------- 공격 ----------
  _startAttack(name, ctx) {
    const def = ATTACKS[name];
    this.attack = { name, def, t: 0, hitSet: new Set(), fxDone: false, dmgDone: false, waveDone: false };
    this.queued = null;
    if (name.startsWith('light')) {
      this.nextLight = def.next || 'light1';
      this.comboResetTimer = 0.55;
    } else {
      this.nextLight = 'light1';
    }
    // 공격 시작 시 카메라 정면으로 조준 (이동 입력 없으면)
    if (!this.moving || def.special) this.yaw = this.camYaw + Math.PI;
    // 조준 보정: 정면 ±65° 안의 가까운 적 쪽으로 살짝 돌림 (터치 조작 배려)
    if (!def.special && ctx.enemies) {
      let best = null, bestD = def.range + 1.8;
      for (const e of ctx.enemies) {
        if (!e.targetable) continue;
        const dx = e.pos.x - this.pos.x, dz = e.pos.z - this.pos.z;
        const d = Math.hypot(dx, dz);
        if (d > bestD) continue;
        const ang = Math.atan2(dx, dz);
        let diff = ((ang - this.yaw + Math.PI) % (Math.PI * 2)) - Math.PI;
        if (diff < -Math.PI) diff += Math.PI * 2;
        if (Math.abs(diff) > 1.15) continue;
        best = ang; bestD = d;
      }
      if (best !== null) this.yaw = best;
    }
    if (def.special) {
      ctx.effects.shockwave(this.pos, { color: 0x6aa8ff, radius: 3, life: 0.5, y: 0.1 });
      ctx.effects.burst(this.center, { count: 40, colors: [0x7fb8ff, 0xffffff, 0xffa040], speed: 3, life: 0.8, size: 0.45, gravity: 1.5, drag: 1, up: 2 });
    }
  }

  _updateAttack(dt, ctx) {
    const a = this.attack;
    const d = a.def;
    a.t += dt;
    const [as, ae] = d.active;

    // 궤적 이펙트
    if (!a.fxDone && a.t >= as) {
      a.fxDone = true;
      const fx = d.fx;
      ctx.effects.slashArc(this.pos, this.yaw, {
        rIn: 0.5, rOut: fx.rOut || d.range, angle: Math.min(d.arc, Math.PI * 1.1), tilt: fx.tilt, roll: fx.roll,
        color: fx.color, life: d.special ? 0.45 : 0.22, sweep: fx.sweep, y: fx.y,
      });
      if (d.special) {
        ctx.effects.slashArc(this.pos, this.yaw + Math.PI, { rIn: 0.5, rOut: fx.rOut, angle: Math.PI * 1.1, tilt: 0.15, color: 0xffb060, life: 0.45, sweep: 1, y: 0.9 });
      }
    }

    // 판정
    if (a.t >= as && a.t <= ae) {
      this._hitCheck(a, ctx);
      if (d.special) this._specialParticles(ctx, a.t);
    }

    // 특수기: 검기 파동 발사
    if (d.special && !a.waveDone && a.t >= 0.72) {
      a.waveDone = true;
      this._launchWave(ctx);
    }

    // 연타 캔슬 (회복 단계 일부 생략)
    if (this.queued && a.t >= ae + (d.dur - ae) * 0.45) {
      const n = this.queued;
      this._startAttack(n, ctx);
      return;
    }
    if (a.t >= d.dur) {
      this.attack = null;
      this.comboResetTimer = 0.55;
      if (d.special) this.parts.body.rotation.y = 0;
    }
  }

  _specialParticles(ctx, t) {
    // 물결(푸른 링 파동) + 불꽃(주황 상승)
    const c = this.center;
    for (let i = 0; i < 6; i++) {
      const a = rand(0, Math.PI * 2);
      const r = rand(0.6, 3.8);
      const p = new THREE.Vector3(c.x + Math.cos(a) * r, 0.2 + rand(0, 0.6), c.z + Math.sin(a) * r);
      const v = new THREE.Vector3(Math.cos(a), 0.3, Math.sin(a)).multiplyScalar(rand(2, 5));
      ctx.effects.emit({ pos: p, vel: v, life: 0.7, size: 0.45, color: i % 3 === 0 ? 0xffffff : 0x6fb6ff, drag: 1.5 });
    }
    for (let i = 0; i < 5; i++) {
      const a = rand(0, Math.PI * 2);
      const r = rand(0.3, 2.5);
      const p = new THREE.Vector3(c.x + Math.cos(a) * r, rand(0, 1.2), c.z + Math.sin(a) * r);
      const v = new THREE.Vector3(rand(-0.6, 0.6), rand(2.5, 5), rand(-0.6, 0.6));
      ctx.effects.emit({ pos: p, vel: v, life: 0.9, size: 0.55, color: [0xff8a2a, 0xffc050, 0xff4a20][i % 3], gravity: 1.5, drag: 1.2 });
    }
  }

  _launchWave(ctx) {
    const geo = ctx.effects._arcGeo(0.9, 1.9, 2.3);
    const m = new THREE.MeshBasicMaterial({ color: 0x9fd4ff, transparent: true, opacity: 0.95, side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending, vertexColors: true });
    const mesh = new THREE.Mesh(geo, m);
    mesh.rotation.order = 'YXZ';
    mesh.rotation.y = this.yaw;
    mesh.rotation.x = -Math.PI / 2;
    mesh.position.set(this.pos.x, 1.2, this.pos.z);
    this.scene.add(mesh);
    const dir = this.forward.clone();
    this.waves.push({ mesh, mat: m, dir, life: 1.4, maxLife: 1.4, hitSet: new Set(), speed: 15 });
  }

  _updateWaves(dt, ctx) {
    for (let i = this.waves.length - 1; i >= 0; i--) {
      const w = this.waves[i];
      w.life -= dt;
      w.mesh.position.addScaledVector(w.dir, w.speed * dt);
      const s = 1 + (1 - w.life / w.maxLife) * 1.2;
      w.mesh.scale.set(s, s, s);
      w.mat.opacity = 0.9 * Math.min(1, w.life / 0.4);
      // 궤적 파티클: 푸른 물결 + 불꽃
      for (let k = 0; k < 3; k++) {
        const side = rand(-1.6, 1.6) * s;
        const p = new THREE.Vector3(w.mesh.position.x - w.dir.z * side, rand(0.3, 2.0), w.mesh.position.z + w.dir.x * side);
        ctx.effects.emit({ pos: p, vel: new THREE.Vector3(rand(-1, 1), rand(1, 3), rand(-1, 1)), life: 0.6, size: 0.5, color: k === 0 ? 0xff8a30 : 0x8cc8ff, drag: 1 });
      }
      // 판정
      for (const e of ctx.enemies) {
        if (!e.targetable || w.hitSet.has(e)) continue;
        const dx = e.pos.x - w.mesh.position.x, dz = e.pos.z - w.mesh.position.z;
        const along = dx * w.dir.x + dz * w.dir.z;
        const lateral = Math.abs(-dx * w.dir.z + dz * w.dir.x);
        if (Math.abs(along) < 1.2 + e.radius && lateral < 1.9 * s + e.radius) {
          w.hitSet.add(e);
          const dir = new THREE.Vector3(dx, 0, dz).normalize();
          this._applyHit(e, { dmg: 45, knock: 10, stagger: 0.8, gauge: 0, hitstop: 0.06, shake: 0.3 }, dir, ctx);
        }
      }
      for (const p of ctx.projectiles) {
        if (!p.alive) continue;
        if (p.pos.distanceTo(w.mesh.position) < 2.2 * s) p.destroy(ctx.effects);
      }
      if (w.life <= 0 || Math.hypot(w.mesh.position.x, w.mesh.position.z) > 40) {
        this.scene.remove(w.mesh);
        w.mat.dispose();
        this.waves.splice(i, 1);
      }
    }
  }

  _hitCheck(a, ctx) {
    const d = a.def;
    const f = this.forward;
    for (const e of ctx.enemies) {
      if (!e.targetable || a.hitSet.has(e)) continue;
      const dx = e.pos.x - this.pos.x, dz = e.pos.z - this.pos.z;
      const dist = Math.hypot(dx, dz);
      if (dist > d.range + e.radius) continue;
      const cosA = clamp((dx * f.x + dz * f.z) / Math.max(dist, 1e-4), -1, 1);
      const ang = Math.acos(cosA);
      if (ang > d.arc / 2 && dist > e.radius + 0.5) continue;
      a.hitSet.add(e);
      const dir = new THREE.Vector3(dx, 0, dz).normalize();
      this._applyHit(e, d, dir, ctx);
    }
    // 투사체 베어내기
    for (const p of ctx.projectiles) {
      if (!p.alive || a.hitSet.has(p)) continue;
      const dx = p.pos.x - this.pos.x, dz = p.pos.z - this.pos.z;
      const dist = Math.hypot(dx, dz);
      if (dist > d.range + 0.5) continue;
      const cosA = clamp((dx * f.x + dz * f.z) / Math.max(dist, 1e-4), -1, 1);
      if (Math.acos(cosA) > d.arc / 2 + 0.3) continue;
      a.hitSet.add(p);
      p.destroy(ctx.effects);
      this.gauge = Math.min(this.gaugeMax, this.gauge + 3);
      this.events.push({ type: 'parry' });
    }
  }

  _applyHit(e, d, dir, ctx) {
    const killed = e.takeHit(d.dmg, dir, d.knock, d.stagger, ctx.effects);
    const hitPos = new THREE.Vector3(e.pos.x - dir.x * e.radius * 0.5, e.pos.y + e.height * 0.55, e.pos.z - dir.z * e.radius * 0.5);
    ctx.effects.sparks(hitPos, dir, d.special ? [0x9cd0ff, 0xffffff, 0xff9a40] : undefined);
    this.gauge = Math.min(this.gaugeMax, this.gauge + (d.gauge || 0));
    this.combo += 1;
    this.comboTimer = COMBO_WINDOW;
    this.comboPop = 1;
    this.hitstop = Math.max(this.hitstop, d.hitstop || 0.04);
    ctx.effects.addShake(d.shake || 0.1);
    this.events.push({ type: 'hit', enemy: e, dmg: d.dmg, killed });
    if (killed) { this.kills++; this.gauge = Math.min(this.gaugeMax, this.gauge + 6); }
  }

  // ---------- 피격 ----------
  takeDamage(dmg, fromPos, effects) {
    if (!this.alive || this.invuln > 0) return false;
    this.hp = Math.max(0, this.hp - dmg);
    this.invuln = 0.75;
    this.blink = 0.75;
    this.combo = 0; this.comboTimer = 0;
    const dir = new THREE.Vector3(this.pos.x - fromPos.x, 0, this.pos.z - fromPos.z).normalize();
    this.knock.copy(dir).multiplyScalar(6);
    effects.burst(this.center, { count: 16, colors: [0xff3040, 0xff8080, 0xffffff], speed: 4, life: 0.5, size: 0.3, gravity: -5, drag: 2 });
    effects.addShake(0.5);
    this.events.push({ type: 'damaged', dmg });
    if (this.attack && !this.attack.def.special) { this.attack = null; this.queued = null; }
    if (this.hp <= 0) {
      this.alive = false;
      this.deadT = 0;
      this.events.push({ type: 'dead' });
    }
    return true;
  }

  // ---------- 애니메이션 ----------
  _animate(dt) {
    const P = this.parts;
    const body = P.body;
    const ra = P.rightArm;
    const la = P.leftArm;

    // 피격 점멸
    const blinkOn = this.blink > 0 && Math.floor(this.blink * 20) % 2 === 0;
    body.visible = !blinkOn;

    // 게이지 충전 시 검신 발광
    const glow = this.specialReady ? 0.6 + 0.4 * Math.sin(performance.now() * 0.008) : 0.15;
    P.bladeMat.emissiveIntensity = damp(P.bladeMat.emissiveIntensity, glow, 8, dt);
    P.bladeMat.emissive.setHex(this.specialReady ? 0x40a0ff : 0x3060a0);

    let tx = 0.15, ty = 0, tz = -0.25;  // 오른팔 목표
    let lz = 0.2, lx = 0;
    let bodyTilt = 0, bodyYawOff = 0, bob = 0;

    if (this.attack) {
      const a = this.attack; const d = a.def; const [as, ae] = d.active;
      let pose;
      if (a.t < as) {
        const k = easeOutCubic(a.t / as);
        pose = { x: lerp(-0.6, d.windup.x, k), y: lerp(0, d.windup.y, k), z: lerp(-0.2, d.windup.z, k) };
        bodyYawOff = -0.35 * k * (d.fx.sweep || 0);
      } else if (a.t < ae) {
        const k = easeOutCubic((a.t - as) / (ae - as));
        pose = { x: lerp(d.windup.x, d.end.x, k), y: lerp(d.windup.y, d.end.y, k), z: lerp(d.windup.z, d.end.z, k) };
        bodyYawOff = lerp(-0.35, 0.3, k) * (d.fx.sweep || 0);
        bodyTilt = 0.12 * k;
      } else {
        const k = easeInCubic(clamp((a.t - ae) / (d.dur - ae), 0, 1));
        pose = { x: lerp(d.end.x, 0.15, k), y: lerp(d.end.y, 0, k), z: lerp(d.end.z, -0.25, k) };
        bodyYawOff = lerp(0.3, 0, k) * (d.fx.sweep || 0);
        bodyTilt = 0.12 * (1 - k);
      }
      if (d.special) {
        // 회전 베기
        const spinT = clamp((a.t - as * 0.5) / (ae - as * 0.5), 0, 1);
        bodyYawOff = easeOutCubic(spinT) * Math.PI * 4;
        pose = { x: -1.45, y: -1.3, z: 0 };
        bodyTilt = 0.18 * Math.sin(spinT * Math.PI);
        if (a.t > ae) { const k = clamp((a.t - ae) / (d.dur - ae), 0, 1); pose = { x: lerp(-1.45, -2.4, easeOutBack(Math.min(1, k * 2))), y: lerp(-1.3, 0, k), z: 0 }; if (k > 0.6) pose.x = lerp(-2.4, 0.15, (k - 0.6) / 0.4); }
      }
      tx = pose.x; ty = pose.y; tz = pose.z;
      lx = -0.5; lz = 0.6;
      ra.rotation.set(damp(ra.rotation.x, tx, 30, dt), damp(ra.rotation.y, ty, 30, dt), damp(ra.rotation.z, tz, 30, dt));
    } else {
      if (this.dashTime > 0) { tx = -0.8; tz = -0.6; bodyTilt = 0.4; lx = -0.9; }
      else if (this.moving) {
        this.walkPhase += dt * 11;
        lx = Math.sin(this.walkPhase) * 0.55;
        tx = -Math.sin(this.walkPhase) * 0.4 + 0.1;
        bob = Math.abs(Math.sin(this.walkPhase)) * 0.06;
        bodyTilt = 0.08;
      } else {
        const t = performance.now() * 0.0015;
        tx = 0.15 + Math.sin(t) * 0.04;
        bob = Math.sin(t * 1.3) * 0.015;
      }
      ra.rotation.set(damp(ra.rotation.x, tx, 12, dt), damp(ra.rotation.y, ty, 12, dt), damp(ra.rotation.z, tz, 12, dt));
    }
    la.rotation.x = damp(la.rotation.x, lx, 12, dt);
    la.rotation.z = damp(la.rotation.z, lz, 12, dt);
    body.rotation.x = damp(body.rotation.x, bodyTilt, 12, dt);
    body.rotation.y = this.attack && this.attack.def.special ? bodyYawOff : damp(body.rotation.y, bodyYawOff, 20, dt);
    body.position.y = bob;
    // 걷기 발 애니메이션
    const [fl, fr] = P.feet;
    if (this.moving && !this.attack) {
      fl.position.z = 0.05 + Math.sin(this.walkPhase) * 0.2;
      fr.position.z = 0.05 - Math.sin(this.walkPhase) * 0.2;
    } else {
      fl.position.z = damp(fl.position.z, 0.05, 10, dt);
      fr.position.z = damp(fr.position.z, 0.05, 10, dt);
    }
    // 머플러 흔들림
    P.scarfTail.rotation.x = 0.35 + Math.sin(performance.now() * 0.004) * 0.15 + (this.moving ? 0.5 : 0);
  }

  _animateDead(dt) {
    this.deadT += dt;
    const k = clamp(this.deadT / 0.8, 0, 1);
    this.parts.body.rotation.x = lerp(0, -Math.PI / 2 + 0.2, easeOutCubic(k));
    this.parts.body.position.y = lerp(0, 0.25, k);
    this.parts.body.visible = true;
  }

  // 카메라 위치 계산 (main에서 호출)
  updateCamera(camera, dt, shake) {
    const dist = 5.6;
    const cp = this.camPitch;
    const target = new THREE.Vector3(this.pos.x, this.pos.y + 1.5, this.pos.z);
    const off = new THREE.Vector3(
      Math.sin(this.camYaw) * Math.cos(cp) * dist,
      Math.sin(cp) * dist + 0.4,
      Math.cos(this.camYaw) * Math.cos(cp) * dist,
    );
    const desired = target.clone().add(off);
    desired.y = Math.max(desired.y, 0.5);
    if (!this._camInit) { camera.position.copy(desired); this._camInit = true; }
    camera.position.x = damp(camera.position.x, desired.x, 22, dt);
    camera.position.y = damp(camera.position.y, desired.y, 22, dt);
    camera.position.z = damp(camera.position.z, desired.z, 22, dt);
    if (shake > 0) {
      const s = shake * shake * 0.35;
      camera.position.x += rand(-s, s); camera.position.y += rand(-s, s); camera.position.z += rand(-s, s);
    }
    camera.lookAt(target);
  }
}

return { Player };
})();

// ===== enemy.js =====
const { Projectile, Enemy, MeleeYokai, RangedYokai, BossOni, EnemyManager } = (() => {
// enemy.js — 요괴: 근접형(小鬼), 원거리형(鬼火), 보스(黒鬼), 투사체, 웨이브/새벽 소멸 관리



function mat(color, extra = {}) {
  return new THREE.MeshLambertMaterial({ color, flatShading: true, transparent: true, ...extra });
}

// ---------- 투사체 (귀화) ----------
class Projectile {
  constructor(scene, pos, dir, { speed = 9, dmg = 10, life = 4.5, color = 0x60c0ff, size = 0.28 } = {}) {
    this.scene = scene;
    this.pos = pos.clone();
    this.vel = dir.clone().normalize().multiplyScalar(speed);
    this.dmg = dmg; this.life = life; this.alive = true; this.radius = size + 0.25;
    this.color = color;
    this.mesh = new THREE.Mesh(new THREE.IcosahedronGeometry(size, 0), new THREE.MeshBasicMaterial({ color: 0xffffff }));
    this.glow = new THREE.Mesh(new THREE.IcosahedronGeometry(size * 1.9, 0), new THREE.MeshBasicMaterial({ color, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false }));
    this.mesh.add(this.glow);
    this.mesh.position.copy(this.pos);
    scene.add(this.mesh);
  }
  update(dt, ctx) {
    if (!this.alive) return;
    this.life -= dt;
    this.pos.addScaledVector(this.vel, dt);
    this.mesh.position.copy(this.pos);
    this.mesh.rotation.x += dt * 6; this.mesh.rotation.y += dt * 4;
    ctx.effects.emit({ pos: this.pos, vel: new THREE.Vector3(rand(-0.5, 0.5), rand(0.5, 1.5), rand(-0.5, 0.5)), life: 0.45, size: 0.45, color: this.color, drag: 2 });
    const p = ctx.player;
    if (p.alive) {
      const dx = p.pos.x - this.pos.x, dz = p.pos.z - this.pos.z, dy = (p.pos.y + 1.0) - this.pos.y;
      if (Math.hypot(dx, dz) < this.radius + p.radius && Math.abs(dy) < 1.4) {
        p.takeDamage(this.dmg, this.pos, ctx.effects);
        this.destroy(ctx.effects, true);
        return;
      }
    }
    if (this.pos.y < 0.05 || this.life <= 0 || Math.hypot(this.pos.x, this.pos.z) > ARENA_RADIUS + 6) this.destroy(ctx.effects, this.pos.y < 0.05);
  }
  destroy(effects, impact = false) {
    if (!this.alive) return;
    this.alive = false;
    this.scene.remove(this.mesh);
    this.mesh.geometry.dispose(); this.mesh.material.dispose(); this.glow.material.dispose();
    effects.burst(this.pos, { count: impact ? 18 : 12, colors: [this.color, 0xffffff, 0xa0e0ff], speed: impact ? 4 : 3, life: 0.45, size: 0.35, gravity: -3, drag: 2 });
  }
}

// ---------- 적 기본 ----------
let ENEMY_ID = 0;
class Enemy {
  constructor(scene, pos) {
    this.id = ENEMY_ID++;
    this.scene = scene;
    this.group = new THREE.Group();
    this.pos = this.group.position;
    this.pos.copy(pos); this.pos.y = 0;
    this.yaw = rand(0, Math.PI * 2);
    scene.add(this.group);

    this.hp = 40; this.maxHp = 40;
    this.speed = 3.2;
    this.radius = 0.5;
    this.height = 1.6;
    this.state = 'spawn'; this.stateT = 0;
    this.alive = true;
    this.removed = false;
    this.hitFlash = 0;
    this.stagger = 0;
    this.knock = new THREE.Vector3();
    this.isBoss = false;
    this.attackCooldown = rand(0.5, 1.5);
    this.mats = [];
    this.opacity = 1;
    this.scaleBase = 1;
    this.name = '요괴';
    this.dissolving = false;
  }

  _collectMats() {
    this.group.traverse((o) => {
      if (o.isMesh) {
        o.castShadow = true; o.receiveShadow = true;
        const ms = Array.isArray(o.material) ? o.material : [o.material];
        for (const m of ms) this.mats.push({ m, emissive: m.emissive ? m.emissive.getHex() : 0, ei: m.emissiveIntensity || 0 });
      }
    });
  }

  get targetable() { return this.alive && this.state !== 'spawn' && !this.dissolving; }
  get center() { return new THREE.Vector3(this.pos.x, this.pos.y + this.height * 0.55, this.pos.z); }

  setState(s) { this.state = s; this.stateT = 0; }

  takeHit(dmg, dir, knock, stagger, effects) {
    if (!this.targetable) return false;
    this.hp -= dmg;
    this.hitFlash = 1;
    const kMul = this.isBoss ? 0.12 : 1;
    this.knock.addScaledVector(dir, knock * kMul);
    // 보스는 경직에 강한 저항
    this.stagger = Math.max(this.stagger, this.isBoss ? stagger * 0.2 : stagger);
    if (this.hp <= 0) { this.die(effects); return true; }
    if (this.stagger > 0 && !this.isBoss) this.setState('hurt');
    return false;
  }

  die(effects) {
    this.alive = false;
    this.setState('dead');
    effects.burst(this.center, { count: 30, colors: [0x6a2a8a, 0x2a1040, 0xff6a3a, 0xffffff], speed: 4, life: 0.8, size: 0.5, gravity: -2, drag: 1.5 });
    effects.mist(this.center, undefined, 12);
  }

  // 새벽 소멸
  dissolve(effects) {
    if (this.dissolving || this.state === 'dead') return;
    this.dissolving = true;
    this.alive = false;
    this.setState('dissolve');
    effects.ashes(this.center, this.isBoss ? 80 : 30);
  }

  // 플레이어 방향/거리
  _toPlayer(player) {
    const dx = player.pos.x - this.pos.x, dz = player.pos.z - this.pos.z;
    const d = Math.hypot(dx, dz);
    return { dx, dz, d, ang: Math.atan2(dx, dz) };
  }

  _faceTo(ang, dt, rate = 8) { this.yaw = angleLerp(this.yaw, ang, 1 - Math.exp(-rate * dt)); }

  _moveTowards(dx, dz, d, dt, speed = this.speed) {
    if (d < 1e-3) return;
    this.pos.x += (dx / d) * speed * dt;
    this.pos.z += (dz / d) * speed * dt;
  }

  update(dt, ctx) {
    this.stateT += dt;
    this.hitFlash = Math.max(0, this.hitFlash - dt * 6);
    this.stagger = Math.max(0, this.stagger - dt);
    this.attackCooldown = Math.max(0, this.attackCooldown - dt);

    // 넉백
    this.pos.addScaledVector(this.knock, dt);
    this.knock.multiplyScalar(Math.max(0, 1 - 8 * dt));

    switch (this.state) {
      case 'spawn': {
        const k = clamp(this.stateT / 1.1, 0, 1);
        const s = easeOutCubic(k) * this.scaleBase;
        this.group.scale.set(s, s, s);
        this.pos.y = lerp(-this.height * 0.8, 0, easeOutCubic(k));
        if (Math.random() < 0.5) ctx.effects.mist(new THREE.Vector3(this.pos.x, 0.2, this.pos.z), undefined, 2);
        if (k >= 1) { this.pos.y = 0; this.setState('chase'); }
        break;
      }
      case 'dead': {
        const k = clamp(this.stateT / 0.9, 0, 1);
        this.opacity = 1 - k;
        this.group.rotation.x = -easeOutCubic(k) * 1.2;
        const s = this.scaleBase * (1 - k * 0.3);
        this.group.scale.set(s, s, s);
        if (k >= 1) this.remove();
        break;
      }
      case 'dissolve': {
        const k = clamp(this.stateT / 1.8, 0, 1);
        this.opacity = 1 - k;
        this.pos.y = k * 1.5;
        const s = this.scaleBase * (1 - k * 0.6);
        this.group.scale.set(s, s, s);
        this.group.rotation.y += dt * 2;
        if (Math.random() < 0.6) ctx.effects.emit({ pos: this.center, vel: new THREE.Vector3(rand(-1, 1), rand(1, 2.5), rand(-1, 1)), life: 1.2, size: 0.4, color: pick([0xffd9a0, 0xffffff, 0xb090ff]), drag: 0.5 });
        if (k >= 1) this.remove();
        break;
      }
      case 'hurt': {
        if (this.stagger <= 0) this.setState('chase');
        break;
      }
      default:
        if (this.alive) this.behave(dt, ctx);
    }

    if (this.alive && this.state !== 'spawn') {
      ctx.stage.resolveCollisions(this.pos, this.radius);
      // 적끼리 분리
      for (const o of ctx.enemies) {
        if (o === this || !o.alive) continue;
        const dx = this.pos.x - o.pos.x, dz = this.pos.z - o.pos.z;
        const d = Math.hypot(dx, dz);
        const min = this.radius + o.radius;
        if (d < min && d > 1e-3) {
          const push = (min - d) * 0.5;
          this.pos.x += (dx / d) * push; this.pos.z += (dz / d) * push;
        }
      }
      if (this.state !== 'dissolve') this.pos.y = 0;
    }

    this.group.rotation.y = this.yaw;
    // 피격 플래시 / 투명도
    for (const e of this.mats) {
      if (e.m.emissive) {
        e.m.emissive.setHex(e.emissive).lerp(new THREE.Color(0xffffff), this.hitFlash * 0.9);
        e.m.emissiveIntensity = lerp(e.ei, 1.2, this.hitFlash);
      }
      e.m.opacity = this.opacity * (this.baseOpacity || 1);
    }
    this.animate(dt);
  }

  behave() {}
  animate() {}

  remove() {
    if (this.removed) return;
    this.removed = true;
    this.scene.remove(this.group);
    this.group.traverse((o) => { if (o.isMesh) { o.geometry.dispose(); } });
  }
}

// ---------- 근접형: 小鬼 (소귀) ----------
class MeleeYokai extends Enemy {
  constructor(scene, pos) {
    super(scene, pos);
    this.name = '小鬼';
    this.hp = this.maxHp = 45;
    this.speed = 3.6;
    this.radius = 0.5; this.height = 1.7;
    this._build(0xb8322a, 0xffe08a);
    this.scaleBase = 1;
    this.group.scale.set(0.01, 0.01, 0.01);
    this.dmg = 12; this.attackRange = 2.0;
  }

  _build(bodyColor, eyeColor) {
    const g = this.group;
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.42, 0.7, 2, 6), mat(bodyColor));
    body.position.y = 0.95;
    const belly = new THREE.Mesh(new THREE.SphereGeometry(0.36, 7, 5), mat(bodyColor));
    belly.position.set(0, 0.85, 0.15);
    const loin = new THREE.Mesh(new THREE.CylinderGeometry(0.44, 0.5, 0.3, 7), mat(0xd9a640));
    loin.position.y = 0.55;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.34, 8, 6), mat(bodyColor));
    head.position.y = 1.6;
    const hornGeo = new THREE.ConeGeometry(0.08, 0.32, 5);
    const hornL = new THREE.Mesh(hornGeo, mat(0xf0e6c8)); hornL.position.set(-0.18, 1.92, 0); hornL.rotation.z = 0.3;
    const hornR = new THREE.Mesh(hornGeo, mat(0xf0e6c8)); hornR.position.set(0.18, 1.92, 0); hornR.rotation.z = -0.3;
    const eyeMat = new THREE.MeshLambertMaterial({ color: eyeColor, emissive: eyeColor, emissiveIntensity: 0.9, transparent: true });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.06, 5, 4), eyeMat); eyeL.position.set(-0.13, 1.66, 0.3);
    const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.06, 5, 4), eyeMat); eyeR.position.set(0.13, 1.66, 0.3);
    const mouth = new THREE.Mesh(new THREE.BoxGeometry(0.22, 0.05, 0.05), mat(0x2a0a0a)); mouth.position.set(0, 1.48, 0.32);
    const legGeo = new THREE.CylinderGeometry(0.12, 0.1, 0.55, 5);
    const legL = new THREE.Mesh(legGeo, mat(bodyColor)); legL.position.set(-0.2, 0.28, 0);
    const legR = new THREE.Mesh(legGeo, mat(bodyColor)); legR.position.set(0.2, 0.28, 0);
    // 왼팔
    const armGeo = new THREE.CylinderGeometry(0.1, 0.09, 0.6, 5); armGeo.translate(0, -0.3, 0);
    const armL = new THREE.Group(); armL.position.set(-0.5, 1.3, 0);
    armL.add(new THREE.Mesh(armGeo, mat(bodyColor)));
    armL.rotation.z = 0.4;
    // 오른팔 + 몽둥이
    const armR = new THREE.Group(); armR.position.set(0.5, 1.3, 0);
    armR.add(new THREE.Mesh(armGeo, mat(bodyColor)));
    const club = new THREE.Group(); club.position.y = -0.6;
    const handle = new THREE.Mesh(new THREE.CylinderGeometry(0.05, 0.06, 0.9, 5), mat(0x4a3320)); handle.rotation.x = Math.PI / 2; handle.position.z = 0.3;
    const headC = new THREE.Mesh(new THREE.CylinderGeometry(0.12, 0.16, 0.5, 6), mat(0x3a2a20)); headC.rotation.x = Math.PI / 2; headC.position.z = 0.85;
    club.add(handle, headC);
    club.rotation.x = -0.9;
    armR.add(club);
    armR.rotation.order = 'YXZ';
    armR.rotation.z = -0.4;
    this.armR = armR; this.armL = armL; this.legs = [legL, legR]; this.eyeMat = eyeMat;
    g.add(body, belly, loin, head, hornL, hornR, eyeL, eyeR, mouth, legL, legR, armL, armR);
    this._collectMats();
  }

  behave(dt, ctx) {
    const p = ctx.player;
    const { dx, dz, d, ang } = this._toPlayer(p);
    if (this.state === 'chase') {
      this._faceTo(ang, dt);
      if (!p.alive) return;
      if (d > this.attackRange) this._moveTowards(dx, dz, d, dt);
      else if (this.attackCooldown <= 0) { this.setState('attack'); this.hit = false; }
      // 살짝 주위를 도는 움직임
      if (d < 4 && this.attackCooldown > 0) {
        const side = (this.id % 2 === 0 ? 1 : -1);
        this.pos.x += (-dz / d) * side * 1.5 * dt; this.pos.z += (dx / d) * side * 1.5 * dt;
      }
    } else if (this.state === 'attack') {
      const t = this.stateT;
      if (t < 0.5) this._faceTo(ang, dt, 5);
      if (t >= 0.5 && !this.hit) {
        this.hit = true;
        ctx.effects.slashArc(this.pos, this.yaw, { rIn: 0.3, rOut: 2.2, angle: 1.6, tilt: -0.6, color: 0xff6a4a, life: 0.2, sweep: 1, y: 1.0, opacity: 0.6 });
        const fx = Math.sin(this.yaw), fz = Math.cos(this.yaw);
        const cosA = (dx * fx + dz * fz) / Math.max(d, 1e-4);
        if (d < this.attackRange + p.radius + 0.3 && cosA > 0.3) p.takeDamage(this.dmg, this.pos, ctx.effects);
      }
      if (t >= 0.95) { this.setState('chase'); this.attackCooldown = rand(1.0, 1.8); }
    }
  }

  animate(dt) {
    const t = this.stateT;
    let ax = 0.2, ay = 0;
    let lean = 0;
    if (this.state === 'attack') {
      if (t < 0.5) { const k = easeOutCubic(t / 0.5); ax = lerp(0.2, -2.6, k); ay = lerp(0, 0.6, k); lean = -0.15 * k; }
      else { const k = clamp((t - 0.5) / 0.25, 0, 1); ax = lerp(-2.6, -0.4, easeOutCubic(k)); ay = lerp(0.6, -0.4, k); lean = lerp(-0.15, 0.25, k); }
      if (t > 0.75) { const k = (t - 0.75) / 0.2; ax = lerp(-0.4, 0.2, k); ay = lerp(-0.4, 0, k); lean = lerp(0.25, 0, k); }
    } else if (this.state === 'chase') {
      const w = performance.now() * 0.012 + this.id;
      this.legs[0].rotation.x = Math.sin(w) * 0.6; this.legs[1].rotation.x = -Math.sin(w) * 0.6;
      this.armL.rotation.x = -Math.sin(w) * 0.5;
      ax = 0.2 + Math.sin(w) * 0.3;
      lean = 0.15;
    } else if (this.state === 'hurt') {
      lean = -0.3;
    }
    this.armR.rotation.x = damp(this.armR.rotation.x, ax, 25, dt);
    this.armR.rotation.y = damp(this.armR.rotation.y, ay, 25, dt);
    this.group.rotation.x = damp(this.group.rotation.x, this.state === 'dead' ? this.group.rotation.x : lean, 12, dt);
    // 공격 준비 시 눈 붉게
    this.eyeMat.emissive.setHex(this.state === 'attack' && t < 0.5 ? 0xff2020 : 0xffe08a);
  }
}

// ---------- 원거리형: 鬼火 (귀화) — 떠다니는 망령 ----------
class RangedYokai extends Enemy {
  constructor(scene, pos) {
    super(scene, pos);
    this.name = '鬼火';
    this.hp = this.maxHp = 28;
    this.speed = 2.8;
    this.radius = 0.5; this.height = 1.9;
    this.baseOpacity = 0.85;
    this._build();
    this.group.scale.set(0.01, 0.01, 0.01);
    this.fireCooldown = rand(1.2, 2.2);
    this.preferMin = 7; this.preferMax = 12;
    this.strafe = Math.random() < 0.5 ? 1 : -1;
    this.strafeT = rand(1, 3);
    this.bobY = 0.35;
  }

  _build() {
    const g = this.group;
    const ghost = 0x9ad8ff;
    const bodyMat = new THREE.MeshLambertMaterial({ color: ghost, emissive: 0x2050a0, emissiveIntensity: 0.5, transparent: true, opacity: 0.85, flatShading: true });
    const body = new THREE.Mesh(new THREE.ConeGeometry(0.45, 1.3, 7), bodyMat); body.position.y = 1.15;
    const head = new THREE.Mesh(new THREE.SphereGeometry(0.32, 8, 6), bodyMat); head.position.y = 1.95;
    const hood = new THREE.Mesh(new THREE.ConeGeometry(0.42, 0.7, 7), new THREE.MeshLambertMaterial({ color: 0x2a3a6a, emissive: 0x101a40, emissiveIntensity: 0.5, transparent: true, flatShading: true })); hood.position.y = 2.25;
    const eyeMat = new THREE.MeshLambertMaterial({ color: 0x000000, emissive: 0x000000, transparent: true });
    const eyeL = new THREE.Mesh(new THREE.SphereGeometry(0.07, 5, 4), eyeMat); eyeL.position.set(-0.12, 2.0, 0.27);
    const eyeR = new THREE.Mesh(new THREE.SphereGeometry(0.07, 5, 4), eyeMat); eyeR.position.set(0.12, 2.0, 0.27);
    const armGeo = new THREE.CylinderGeometry(0.06, 0.05, 0.7, 5); armGeo.translate(0, -0.35, 0);
    const armL = new THREE.Mesh(armGeo, bodyMat); armL.position.set(-0.4, 1.6, 0.1); armL.rotation.set(-0.9, 0, 0.5);
    const armR = new THREE.Mesh(armGeo, bodyMat); armR.position.set(0.4, 1.6, 0.1); armR.rotation.set(-0.9, 0, -0.5);
    // 궤도 도는 귀화 불꽃
    this.flames = [];
    const flameMat = new THREE.MeshBasicMaterial({ color: 0x70d0ff, transparent: true, opacity: 0.95 });
    for (let i = 0; i < 3; i++) {
      const f = new THREE.Mesh(new THREE.TetrahedronGeometry(0.16, 0), flameMat);
      g.add(f); this.flames.push(f);
    }
    this.armR = armR;
    g.add(body, head, hood, eyeL, eyeR, armL, armR);
    this._collectMats();
    // 불꽃은 항상 밝게 — 플래시 제외
    this.mats = this.mats.filter((e) => e.m !== flameMat);
    this.flameMat = flameMat;
  }

  behave(dt, ctx) {
    const p = ctx.player;
    const { dx, dz, d, ang } = this._toPlayer(p);
    this._faceTo(ang, dt, 6);
    if (!p.alive) return;
    this.fireCooldown -= dt;
    this.strafeT -= dt;
    if (this.strafeT <= 0) { this.strafe *= -1; this.strafeT = rand(1.5, 3.5); }

    if (this.state === 'chase') {
      // 거리 유지
      if (d < this.preferMin) this._moveTowards(-dx, -dz, d, dt, this.speed * 1.2);
      else if (d > this.preferMax) this._moveTowards(dx, dz, d, dt);
      // 측면 이동
      if (d > 1e-3) { this.pos.x += (-dz / d) * this.strafe * 1.6 * dt; this.pos.z += (dx / d) * this.strafe * 1.6 * dt; }
      if (this.fireCooldown <= 0 && d < 18) { this.setState('cast'); }
    } else if (this.state === 'cast') {
      const t = this.stateT;
      if (t < 0.6) {
        // 집중: 손끝에 불꽃 모임
        const src = this._handPos();
        ctx.effects.emit({ pos: new THREE.Vector3(src.x + rand(-0.6, 0.6), src.y + rand(-0.6, 0.6), src.z + rand(-0.6, 0.6)), vel: new THREE.Vector3(0, 0, 0), life: 0.3, size: 0.3, color: 0x70d0ff });
      }
      if (t >= 0.6 && !this.fired) {
        this.fired = true;
        const src = this._handPos();
        const target = new THREE.Vector3(p.pos.x, p.pos.y + 1.0, p.pos.z);
        // 약간의 리드
        const dir = target.sub(src).normalize();
        ctx.spawnProjectile(src, dir, { speed: 10, dmg: 10, color: 0x60c0ff });
        ctx.effects.burst(src, { count: 8, colors: [0x70d0ff, 0xffffff], speed: 2, life: 0.3, size: 0.3, gravity: 0, drag: 2 });
      }
      if (t >= 1.0) { this.setState('chase'); this.fired = false; this.fireCooldown = rand(2.0, 3.2); }
    }
  }

  _handPos() {
    const fx = Math.sin(this.yaw), fz = Math.cos(this.yaw);
    return new THREE.Vector3(this.pos.x + fx * 0.7 + fz * 0.3, 1.5 + this.bobY, this.pos.z + fz * 0.7 - fx * 0.3);
  }

  animate(dt) {
    const t = performance.now() * 0.001 + this.id;
    this.bobY = Math.sin(t * 2.2) * 0.18 + 0.35;
    if (this.state !== 'dissolve' && this.state !== 'dead' && this.state !== 'spawn') this.pos.y = this.bobY;
    for (let i = 0; i < this.flames.length; i++) {
      const f = this.flames[i];
      const a = t * 2.5 + (i / 3) * Math.PI * 2;
      f.position.set(Math.cos(a) * 0.75, 1.3 + Math.sin(a * 1.7) * 0.3, Math.sin(a) * 0.75);
      f.rotation.set(t * 3, t * 2, 0);
      const s = 0.8 + 0.3 * Math.sin(t * 8 + i);
      f.scale.set(s, s * 1.6, s);
    }
    this.flameMat.opacity = this.opacity * 0.95;
    this.armR.rotation.x = damp(this.armR.rotation.x, this.state === 'cast' ? -1.6 : -0.9, 12, dt);
  }
}

// ---------- 보스: 黒鬼 (흑귀) ----------
class BossOni extends MeleeYokai {
  constructor(scene, pos) {
    super(scene, pos);
    this.name = '黒鬼 — 대나무 숲의 주인';
    this.isBoss = true;
    this.hp = this.maxHp = 620;
    this.speed = 3.0;
    this.scaleBase = 2.4;
    this.radius = 1.25; this.height = 4.2;
    this.dmg = 24; this.attackRange = 3.6;
    this.attackCooldown = 2;
    this.phase = 1;
    // 색 교체: 검은 몸, 붉은 눈
    for (const e of this.mats) {
      if (e.m.color && e.m.color.getHex() === 0xb8322a) e.m.color.setHex(0x1c1620);
      if (e.m.color && e.m.color.getHex() === 0xd9a640) e.m.color.setHex(0x7a2a2a);
    }
    this.eyeMat.color.setHex(0xff3020); this.eyeMat.emissive.setHex(0xff2010);
    for (const e of this.mats) if (e.m === this.eyeMat) e.emissive = 0xff2010;
    // 가나보 가시
    const spikeGeo = new THREE.ConeGeometry(0.04, 0.12, 4);
    const club = this.armR.children[1];
    for (let i = 0; i < 8; i++) {
      const s = new THREE.Mesh(spikeGeo, mat(0x8a8a90));
      const a = (i / 8) * Math.PI * 2;
      s.position.set(Math.cos(a) * 0.15, Math.sin(a) * 0.15, 0.85);
      s.rotation.z = a - Math.PI / 2;
      club.add(s);
    }
    this._collectMats();
    this.mats = this.mats.filter((v, i, arr) => arr.findIndex((w) => w.m === v.m) === i);
    this.group.scale.set(0.01, 0.01, 0.01);
    this.charge = null;
  }

  behave(dt, ctx) {
    const p = ctx.player;
    const { dx, dz, d, ang } = this._toPlayer(p);
    if (this.hp < this.maxHp * 0.5 && this.phase === 1) {
      this.phase = 2;
      ctx.onBossPhase && ctx.onBossPhase(this);
      ctx.effects.shockwave(this.pos, { color: 0xff3020, radius: 9, life: 0.9, y: 0.1 });
      ctx.effects.burst(this.center, { count: 60, colors: [0xff3020, 0x8a1030, 0xffffff], speed: 6, life: 1.0, size: 0.6, gravity: -2, drag: 1 });
    }
    if (this.state === 'chase') {
      this._faceTo(ang, dt, 4);
      if (!p.alive) return;
      if (this.attackCooldown <= 0) {
        // 공격 선택
        const r = Math.random();
        if (d > 7 && r < 0.65) { this.setState('charge'); this.hit = false; this.charge = null; }
        else if (this.phase === 2 && d > 4 && r < 0.45) { this.setState('firering'); this.fired = false; }
        else if (d <= this.attackRange + 0.5) { this.setState('slam'); this.hit = false; }
        else this._moveTowards(dx, dz, d, dt);
      } else {
        if (d > this.attackRange) this._moveTowards(dx, dz, d, dt);
      }
    } else if (this.state === 'slam') {
      const t = this.stateT;
      if (t < 0.85) this._faceTo(ang, dt, 3);
      if (t >= 0.85 && !this.hit) {
        this.hit = true;
        const fx = Math.sin(this.yaw), fz = Math.cos(this.yaw);
        const impact = new THREE.Vector3(this.pos.x + fx * 2.4, 0, this.pos.z + fz * 2.4);
        ctx.effects.shockwave(impact, { color: 0xffa040, radius: 4.5, life: 0.55, y: 0.1 });
        ctx.effects.burst(impact, { count: 40, colors: [0x6a5a40, 0x9a8a60, 0xff8a30], speed: 6, life: 0.7, size: 0.5, gravity: -9, drag: 1, up: 2 });
        ctx.effects.addShake(0.8);
        const dd = Math.hypot(p.pos.x - impact.x, p.pos.z - impact.z);
        if (dd < 4.2) p.takeDamage(this.dmg, impact, ctx.effects);
      }
      if (t >= 1.5) { this.setState('chase'); this.attackCooldown = rand(1.2, 2.0); }
    } else if (this.state === 'charge') {
      const t = this.stateT;
      if (t < 0.7) {
        this._faceTo(ang, dt, 6);
        if (Math.random() < 0.6) ctx.effects.emit({ pos: new THREE.Vector3(this.pos.x + rand(-1, 1), 0.3, this.pos.z + rand(-1, 1)), vel: new THREE.Vector3(0, 2, 0), life: 0.4, size: 0.5, color: 0xff3020 });
      } else if (t < 1.5) {
        if (!this.charge) this.charge = new THREE.Vector3(Math.sin(this.yaw), 0, Math.cos(this.yaw));
        this.pos.addScaledVector(this.charge, 15 * dt);
        ctx.effects.emit({ pos: new THREE.Vector3(this.pos.x + rand(-1, 1), 0.3, this.pos.z + rand(-1, 1)), vel: new THREE.Vector3(0, 1.5, 0), life: 0.5, size: 0.7, color: 0x5a4a3a });
        if (!this.hit && d < this.radius + p.radius + 0.6) {
          this.hit = true;
          p.takeDamage(18, this.pos, ctx.effects);
          ctx.effects.addShake(0.5);
        }
        // 벽에 부딪히면 정지
        if (Math.hypot(this.pos.x, this.pos.z) > ARENA_RADIUS - this.radius - 0.2) { this.stateT = 1.5; ctx.effects.addShake(0.6); ctx.effects.shockwave(this.pos, { color: 0xffffff, radius: 3, life: 0.4 }); }
      }
      if (t >= 2.1) { this.setState('chase'); this.attackCooldown = rand(1.0, 1.8); }
    } else if (this.state === 'firering') {
      const t = this.stateT;
      if (t < 0.9) {
        ctx.effects.emit({ pos: this.center.add(new THREE.Vector3(rand(-1.5, 1.5), rand(-1, 1), rand(-1.5, 1.5))), vel: new THREE.Vector3(0, 0, 0), life: 0.3, size: 0.5, color: 0xff6030 });
      }
      if (t >= 0.9 && !this.fired) {
        this.fired = true;
        const n = 10;
        const src = this.center;
        for (let i = 0; i < n; i++) {
          const a = ang + (i / n) * Math.PI * 2;
          const dir = new THREE.Vector3(Math.sin(a), -0.08, Math.cos(a));
          ctx.spawnProjectile(src.clone(), dir, { speed: 8, dmg: 12, color: 0xff6030, size: 0.32, life: 5 });
        }
        ctx.effects.shockwave(this.pos, { color: 0xff6030, radius: 5, life: 0.5 });
      }
      if (t >= 1.6) { this.setState('chase'); this.attackCooldown = rand(1.5, 2.5); }
    }
  }

  animate(dt) {
    const t = this.stateT;
    let ax = 0.2, ay = 0, lean = 0;
    if (this.state === 'slam') {
      if (t < 0.85) { const k = easeOutCubic(t / 0.85); ax = lerp(0.2, -3.0, k); lean = -0.2 * k; }
      else { const k = clamp((t - 0.85) / 0.15, 0, 1); ax = lerp(-3.0, -0.3, easeOutCubic(k)); lean = lerp(-0.2, 0.3, k); }
      if (t > 1.1) { const k = clamp((t - 1.1) / 0.4, 0, 1); ax = lerp(-0.3, 0.2, k); lean = lerp(0.3, 0, k); }
    } else if (this.state === 'charge') {
      if (t < 0.7) { lean = -0.25; ax = -0.6; } else { lean = 0.35; ax = -1.2; ay = 0.8; }
    } else if (this.state === 'firering') {
      ax = -2.2; ay = 1.0; lean = -0.1;
    } else if (this.state === 'chase') {
      const w = performance.now() * 0.007 + this.id;
      this.legs[0].rotation.x = Math.sin(w) * 0.5; this.legs[1].rotation.x = -Math.sin(w) * 0.5;
      this.armL.rotation.x = -Math.sin(w) * 0.4;
      ax = 0.2 + Math.sin(w) * 0.2; lean = 0.1;
    }
    this.armR.rotation.x = damp(this.armR.rotation.x, ax, 18, dt);
    this.armR.rotation.y = damp(this.armR.rotation.y, ay, 18, dt);
    if (this.state !== 'dead') this.group.rotation.x = damp(this.group.rotation.x, lean, 10, dt);
    const telegraph = (this.state === 'slam' && t < 0.85) || (this.state === 'charge' && t < 0.7) || (this.state === 'firering' && t < 0.9);
    this.eyeMat.emissive.setHex(telegraph ? 0xffffff : 0xff2010);
    this.eyeMat.emissiveIntensity = telegraph ? 2 : 0.9;
  }
}

// ---------- 웨이브/스폰 관리 ----------
const WAVES = [
  { melee: 3, ranged: 0, title: '第一波', sub: '소귀들이 안개 속에서 기어 나온다' },
  { melee: 3, ranged: 2, title: '第二波', sub: '귀화가 대나무 사이를 떠돈다' },
  { melee: 4, ranged: 3, title: '第三波', sub: '숲 전체가 술렁인다' },
  { boss: true, title: '黒鬼', sub: '대나무 숲의 주인이 눈을 뜬다' },
];

class EnemyManager {
  constructor(scene) {
    this.scene = scene;
    this.list = [];
    this.projectiles = [];
    this.waveIndex = -1;
    this.waveDelay = 2.5;
    this.boss = null;
    this.bossDefeated = false;
    this.kills = 0;
    this.onMessage = null;
    this.onBossSpawn = null;
    this.onBossDefeated = null;
    this.dissolved = false;
    this.spawnQueue = [];
  }

  get aliveCount() { return this.list.filter((e) => e.alive).length; }
  get totalWaves() { return WAVES.length; }
  get allWavesCleared() { return this.waveIndex >= WAVES.length - 1 && this.aliveCount === 0 && this.spawnQueue.length === 0; }

  _spawnPos(player, min = 10, max = 16) {
    for (let i = 0; i < 20; i++) {
      const a = rand(0, Math.PI * 2);
      const r = rand(min, max);
      const p = new THREE.Vector3(player.pos.x + Math.cos(a) * r, 0, player.pos.z + Math.sin(a) * r);
      const d = Math.hypot(p.x, p.z);
      if (d > ARENA_RADIUS - 2) { const k = (ARENA_RADIUS - 2) / d; p.x *= k; p.z *= k; }
      if (Math.hypot(p.x - player.pos.x, p.z - player.pos.z) > 6) return p;
    }
    return new THREE.Vector3(0, 0, -12);
  }

  startWave(index, player) {
    this.waveIndex = index;
    const w = WAVES[index];
    if (!w) return;
    this.onMessage && this.onMessage(w.title, w.sub);
    if (w.boss) {
      const pos = new THREE.Vector3(0, 0, -12);
      this.boss = new BossOni(this.scene, pos);
      this.list.push(this.boss);
      this.onBossSpawn && this.onBossSpawn(this.boss);
      return;
    }
    let delay = 0;
    for (let i = 0; i < w.melee; i++) { this.spawnQueue.push({ t: delay, type: 'melee' }); delay += 0.35; }
    for (let i = 0; i < w.ranged; i++) { this.spawnQueue.push({ t: delay, type: 'ranged' }); delay += 0.35; }
  }

  spawnProjectile(pos, dir, opts) {
    this.projectiles.push(new Projectile(this.scene, pos, dir, opts));
  }

  dissolveAll(effects) {
    if (this.dissolved) return;
    this.dissolved = true;
    this.spawnQueue.length = 0;
    for (const e of this.list) e.dissolve(effects);
    for (const p of this.projectiles) p.destroy(effects);
  }

  update(dt, ctx) {
    const player = ctx.player;
    ctx.enemies = this.list;
    ctx.projectiles = this.projectiles;
    ctx.spawnProjectile = (p, d, o) => this.spawnProjectile(p, d, o);

    // 스폰 큐
    if (!this.dissolved) {
      for (let i = this.spawnQueue.length - 1; i >= 0; i--) {
        const s = this.spawnQueue[i];
        s.t -= dt;
        if (s.t <= 0) {
          const pos = this._spawnPos(player);
          const e = s.type === 'melee' ? new MeleeYokai(this.scene, pos) : new RangedYokai(this.scene, pos);
          this.list.push(e);
          ctx.effects.mist(new THREE.Vector3(pos.x, 0.5, pos.z), undefined, 25);
          this.spawnQueue.splice(i, 1);
        }
      }
      // 다음 웨이브
      if (this.aliveCount === 0 && this.spawnQueue.length === 0 && this.waveIndex < WAVES.length - 1 && player.alive) {
        this.waveDelay -= dt;
        if (this.waveDelay <= 0) { this.startWave(this.waveIndex + 1, player); this.waveDelay = 3.5; }
      }
      // 보스 2페이즈 시 추가 소환
      if (this.boss && this.boss.alive && this.boss.phase === 2 && !this.boss.addsSpawned) {
        this.boss.addsSpawned = true;
        this.spawnQueue.push({ t: 0.5, type: 'ranged' }, { t: 0.9, type: 'ranged' }, { t: 1.3, type: 'melee' });
      }
    }

    // 적 업데이트
    for (const e of this.list) e.update(dt, ctx);
    for (let i = this.list.length - 1; i >= 0; i--) {
      const e = this.list[i];
      if (e.removed) this.list.splice(i, 1);
    }
    // 보스 사망 → 새벽
    if (this.boss && !this.boss.alive && !this.bossDefeated && !this.boss.dissolving) {
      this.bossDefeated = true;
      this.onBossDefeated && this.onBossDefeated(this.boss);
    }

    // 투사체
    for (const p of this.projectiles) p.update(dt, ctx);
    for (let i = this.projectiles.length - 1; i >= 0; i--) if (!this.projectiles[i].alive) this.projectiles.splice(i, 1);
  }
}

return { Projectile, Enemy, MeleeYokai, RangedYokai, BossOni, EnemyManager };

    const dead = 0.12;
    const mag = Math.hypot(nx, ny);
    if (mag < dead) { input.axisX = 0; input.axisY = 0; return; }
    const scale = Math.min(1, (mag - dead) / (1 - dead)) / mag;
    input.axisX = nx * scale;
    input.axisY = -ny * scale; // 화면 위쪽 = 전진
  };

  const onStart = (e) => {
    for (const t of e.changedTouches) {
      const target = t.target;
      if (target.closest && target.closest('.tb, #tb-pause')) continue;
      const leftHalf = t.clientX < window.innerWidth * 0.5;
      if (leftHalf && stickId === null) {
        stickId = t.identifier; stickX = t.clientX; stickY = t.clientY;
        stick.style.left = `${stickX}px`; stick.style.top = `${stickY}px`;
        stick.style.display = 'block';
        setAxis(0, 0);
      } else if (lookId === null) {
        lookId = t.identifier; lookX = t.clientX; lookY = t.clientY;
        lookStart = performance.now(); lookMoved = 0;
      }
    }
    if (e.cancelable) e.preventDefault();
  };
  const onMove = (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) {
        setAxis(t.clientX - stickX, t.clientY - stickY);
      } else if (t.identifier === lookId) {
        const dx = t.clientX - lookX, dy = t.clientY - lookY;
        lookX = t.clientX; lookY = t.clientY;
        lookMoved += Math.hypot(dx, dy);
        input.mouseDX += dx * LOOK_SENS;
        input.mouseDY += dy * LOOK_SENS;
      }
    }
    if (e.cancelable) e.preventDefault();
  };
  const onEnd = (e) => {
    for (const t of e.changedTouches) {
      if (t.identifier === stickId) {
        stickId = null; input.axisX = 0; input.axisY = 0;
        stick.style.display = 'none';
      } else if (t.identifier === lookId) {
        if (performance.now() - lookStart < TAP_TIME && lookMoved < TAP_MOVE) input.light = true;
        lookId = null;
      }
    }
    if (e.cancelable) e.preventDefault();
  };
  const opts = { passive: false };
  layer.addEventListener('touchstart', onStart, opts);
  layer.addEventListener('touchmove', onMove, opts);
  layer.addEventListener('touchend', onEnd, opts);
  layer.addEventListener('touchcancel', onEnd, opts);

  // 액션 버튼
  for (const b of layer.querySelectorAll('.tb')) {
    const act = b.dataset.act;
    b.addEventListener('touchstart', (e) => { input[act] = true; b.classList.add('on'); if (e.cancelable) e.preventDefault(); e.stopPropagation(); }, opts);
    const off = (e) => { b.classList.remove('on'); if (e.cancelable) e.preventDefault(); e.stopPropagation(); };
    b.addEventListener('touchend', off, opts);
    b.addEventListener('touchcancel', off, opts);
    b.addEventListener('contextmenu', (e) => e.preventDefault());
  }
  const pauseBtn = layer.querySelector('#tb-pause');
  pauseBtn.addEventListener('touchstart', (e) => { if (e.cancelable) e.preventDefault(); e.stopPropagation(); onPause && onPause(); }, opts);
  pauseBtn.addEventListener('click', (e) => { e.preventDefault(); onPause && onPause(); });

  const api = {
    layer,
    setActive(on) {
      layer.classList.toggle('active', !!on);
      if (!on) { stickId = null; lookId = null; input.axisX = 0; input.axisY = 0; stick.style.display = 'none'; }
      else if (!hintTimer) { hint.classList.add('show'); hintTimer = setTimeout(() => hint.classList.remove('show'), 5000); }
    },
    setSpecialReady(ready) { layer.querySelector('.tb-special').classList.toggle('ready', !!ready); },
  };
  return api;
}

return { isTouchDevice, setupTouch };
})();

// ===== main.js =====
(() => {
// main.js — 초기화, 입력, 게임 루프, 상태(타이틀/플레이/일시정지/결과), 밤→새벽 규칙







const TOUCH = isTouchDevice();

const canvas = document.getElementById('game');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, TOUCH ? 1.5 : 1.75));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(62, window.innerWidth / window.innerHeight, 0.1, 260);

const ui = new UI({ touch: TOUCH });
let stage, player, enemies, effects;
let touch = null;
let state = 'title';   // title | playing | paused | ended
let wasLocked = false;
let elapsed = 0;
let hitstop = 0;
let dawnEndTimer = 0;
let endKind = null;
const stats = { kills: 0, maxCombo: 0, specials: 0, time: 0 };

// ---------- 입력 ----------
const input = { keys: {}, mouseDX: 0, mouseDY: 0, axisX: 0, axisY: 0, light: false, heavy: false, special: false, dash: false };
if (TOUCH) {
  touch = setupTouch(input, { onPause: () => pause() });
  document.body.classList.add('touch');
}

window.addEventListener('keydown', (e) => {
  if (e.repeat) return;
  input.keys[e.code] = true;
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight') input.dash = true;
  if (e.code === 'KeyF' || e.code === 'Space') { input.special = true; e.preventDefault(); }
  if (e.code === 'Escape' && state === 'playing') pause();
});
window.addEventListener('keyup', (e) => { input.keys[e.code] = false; });
window.addEventListener('blur', () => { for (const k in input.keys) input.keys[k] = false; });
document.addEventListener('mousemove', (e) => {
  if (state !== 'playing') return;
  input.mouseDX += e.movementX || 0;
  input.mouseDY += e.movementY || 0;
});
canvas.addEventListener('mousedown', (e) => {
  if (state !== 'playing') return;
  if (e.button === 0) input.light = true;
  if (e.button === 2) input.heavy = true;
});
canvas.addEventListener('contextmenu', (e) => e.preventDefault());
document.getElementById('ui').addEventListener('contextmenu', (e) => e.preventDefault());

document.addEventListener('pointerlockchange', () => {
  const locked = document.pointerLockElement === canvas;
  if (locked) wasLocked = true;
  if (!locked && wasLocked && state === 'playing') pause();
});

ui.screen.addEventListener('click', () => {
  if (state === 'title') startGame();
  else if (state === 'paused') resume();
  else if (state === 'ended') { resetWorld(); startGame(); }
});

function lockPointer() {
  if (TOUCH) return;
  try {
    const p = canvas.requestPointerLock({ unadjustedMovement: true });
    if (p && p.catch) p.catch(() => { try { canvas.requestPointerLock(); } catch (_) { /* 잠금 불가 환경 */ } });
  } catch (_) {
    try { canvas.requestPointerLock(); } catch (__) { /* ignore */ }
  }
}

// ---------- 월드 ----------
function buildWorld() {
  effects = new Effects(scene);
  stage = new Stage(scene, { mobile: TOUCH });
  player = new Player(scene);
  enemies = new EnemyManager(scene);
  enemies.onMessage = (t, s) => ui.message(t, s);
  enemies.onBossSpawn = (b) => { ui.showBoss(b.name); effects.addShake(0.6); };
  enemies.onBossDefeated = () => {
    stage.triggerDawn();
    ui.message('夜明け', '새벽이 온다 — 요괴들이 재가 되어 흩어진다', 4);
    endKind = 'victory';
  };
  elapsed = 0; hitstop = 0; dawnEndTimer = 0; endKind = null;
  stats.kills = 0; stats.maxCombo = 0; stats.specials = 0; stats.time = 0;
  ui.hideBoss();
  ui.setHP(100, 100); ui.setGauge(0, 100); ui.setCombo(0, 0);
}

function resetWorld() {
  // 씬 전체 정리 후 재생성
  while (scene.children.length) {
    const o = scene.children[0];
    scene.remove(o);
    o.traverse && o.traverse((c) => {
      if (c.isMesh || c.isPoints) {
        c.geometry && c.geometry.dispose();
        const ms = Array.isArray(c.material) ? c.material : [c.material];
        ms.forEach((m) => m && m.dispose && m.dispose());
      }
    });
  }
  scene.fog = null;
  buildWorld();
}

function startGame() {
  state = 'playing';
  wasLocked = false;
  ui.hideScreen();
  lockPointer();
  ui.message('竹林の夜', '요괴는 밤에만 움직인다. 새벽이 오면 사라진다.', 3.5);
  enemies.waveDelay = 2.5;
}
function pause() {
  if (state !== 'playing') return;
  state = 'paused';
  ui.showScreen('pause');
  if (document.pointerLockElement === canvas) document.exitPointerLock();
}
function resume() {
  state = 'playing';
  ui.hideScreen();
  lockPointer();
}
function endGame(kind) {
  state = 'ended';
  stats.time = elapsed;
  ui.hideBoss();
  ui.showScreen(kind, stats);
  if (document.pointerLockElement === canvas) document.exitPointerLock();
}

// ---------- 루프 ----------
const clock = new THREE.Clock();
const ctx = { player: null, stage: null, effects: null, enemies: [], projectiles: [], spawnProjectile: null };

function frame() {
  requestAnimationFrame(frame);
  let dt = Math.min(clock.getDelta(), 0.05);
  const playing = state === 'playing';

  // 히트스톱: 시간 거의 정지
  if (hitstop > 0) { hitstop -= dt; dt *= 0.08; }

  ctx.player = player; ctx.stage = stage; ctx.effects = effects;
  ctx.onBossPhase = () => { ui.message('黒鬼 · 激昂', '흑귀가 분노한다 — 귀화의 고리를 조심하라', 3); effects.addShake(0.5); };

  if (playing) {
    elapsed += dt;
    player.update(dt, input, ctx);
    enemies.update(dt, ctx);
    // 플레이어 이벤트
    for (const ev of player.events) {
      if (ev.type === 'damaged') ui.damageFlash();
      if (ev.type === 'special') { stats.specials++; ui.message('秘剣・波焔', '', 1.4); }
      if (ev.type === 'dead') { setTimeout(() => endGame('defeat'), 1400); state = 'dying'; }
    }
    if (player.hitstop > 0) { hitstop = Math.max(hitstop, player.hitstop); player.hitstop = 0; }
    stats.kills = player.kills;
    stats.maxCombo = Math.max(stats.maxCombo, player.combo);

    // 밤 → 새벽 규칙
    if (stage.isDawn) {
      enemies.dissolveAll(effects);
      if (!endKind) { endKind = 'survived'; ui.message('夜明け', '새벽이 온다 — 요괴들이 재가 되어 흩어진다', 4); ui.hideBoss(); }
      dawnEndTimer += dt;
      if (dawnEndTimer > 6.5) endGame(endKind);
    }
  } else if (state === 'dying') {
    player.update(dt, input, ctx);
    enemies.update(dt, ctx);
  }

  stage.update(dt, playing, player.pos);
  effects.update(dt);
  player.updateCamera(camera, dt, effects.shake);
  input.mouseDX = 0; input.mouseDY = 0;
  input.light = input.heavy = input.special = input.dash = false;

  // HUD
  if (touch) { touch.setActive(playing); touch.setSpecialReady(player.specialReady); }
  ui.setHP(player.hp, player.maxHp);
  ui.setGauge(player.gauge, player.gaugeMax);
  ui.setCombo(player.combo, player.comboPop);
  ui.setNight(stage.nightProgress, enemies.waveIndex, enemies.totalWaves, player.kills, stage.isDawn);
  ui.setDash(player.dashCooldown / 0.75);
  if (enemies.boss && enemies.boss.alive) ui.setBossHP(enemies.boss.hp, enemies.boss.maxHp);
  else if (enemies.boss && !enemies.boss.alive) ui.hideBoss();
  ui.update(dt);

  renderer.render(scene, camera);
}

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

buildWorld();
ui.showScreen('title');
frame();

// 디버그/테스트용 노출
window.__game = { get state() { return state; }, get time() { return stage.time; }, get player() { return player; }, get enemies() { return enemies; }, get stage() { return stage; }, startGame, input };

})();

</script>
</body>
